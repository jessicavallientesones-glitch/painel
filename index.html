<style>
:root{
  /* Identidade: menu marrom, área de trabalho creme e branco, dourado só nos detalhes */
  --marrom:#5A4032; --marrom-esc:#47322A; --marrom-linha:#735746;
  --ouro:#B8955F; --ouro-claro:#D9C092; --ouro-esc:#8F6E3E;
  --creme:#F7F2E9; --nude:#EBDDCB; --nude-claro:#F3EADD; --branco:#FFFFFF;
  --texto:#3B2B21; --suave:#85705F; --linha:#E3D6C4;
  --perigo:#9C3B2E; --perigo-bg:#F6E3DE; --aviso:#9A6B1E; --aviso-bg:#F7EBD3; --ok:#56704A; --ok-bg:#E6EDDF;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-texto:"Montserrat","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--creme);color:var(--texto);font-family:var(--f-texto);font-size:14px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
a{color:var(--ouro-esc)}
:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
.ouro-txt{background:linear-gradient(100deg,#9C7A45 0%,#D9C092 45%,#B8955F 70%,#8F6E3E 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.display{font-family:var(--f-display);font-weight:400}
.lateral .ouro-txt,.msg-dia .ouro-txt{background:linear-gradient(100deg,#C9A86F 0%,#EED9AE 45%,#D6B77E 75%,#C3A066 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hidden{display:none!important}
/* Login */
#tela-login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--creme)}
.login-card{width:100%;max-width:400px;background:var(--branco);border:1px solid var(--linha);border-radius:14px;padding:36px 32px;text-align:center}

.marca-nome{font-family:var(--f-display);letter-spacing:4px;font-size:20px;margin-top:16px}
.marca-sub{font-weight:300;letter-spacing:7px;font-size:11px;color:var(--suave);margin-top:4px}
.login-card form{display:flex;flex-direction:column;gap:12px;margin-top:26px;text-align:left}
.login-card .nota{font-size:12px;color:var(--suave);margin-top:16px}
label{font-size:12px;color:var(--suave);display:flex;flex-direction:column;gap:4px}
input,select,textarea{border:1px solid var(--linha);background:var(--branco);border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--ouro);outline:none;box-shadow:0 0 0 3px rgba(184,149,95,.18)}
.btn{border:1px solid var(--linha);background:var(--branco);border-radius:8px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ouro)}
.btn-pri{background:var(--marrom);border-color:var(--marrom);color:var(--creme)}
.btn-pri:hover{background:var(--marrom-esc)}
.btn-ouro{background:var(--ouro);border-color:var(--ouro);color:#2E2118}
.btn-perigo{color:var(--perigo);border-color:#E3BFB7}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-link{border:none;background:none;color:var(--ouro-esc);cursor:pointer;padding:0;text-decoration:underline;font-size:12px}
/* App */
#app{display:grid;grid-template-columns:240px minmax(0,1fr);height:100%}
.lateral{background:var(--marrom);color:var(--creme);display:flex;flex-direction:column;padding:22px 14px 16px;overflow-y:auto}
.lateral .mono{width:76px;height:76px;flex:none}
.lateral .marca-nome{font-size:14px;letter-spacing:3px;margin-top:12px;text-align:center}
.lateral .marca-sub{color:var(--ouro-claro);text-align:center;font-size:10px}
.lateral hr{border:none;border-top:1px solid var(--marrom-linha);margin:18px 4px}
.menu{display:flex;flex-direction:column;gap:2px}
.menu .grupo{font-size:10px;letter-spacing:2px;color:var(--ouro-claro);margin:12px 10px 4px;opacity:.85}
.menu a{display:flex;justify-content:space-between;align-items:center;color:var(--creme);text-decoration:none;padding:8px 12px;border-radius:7px;font-size:13px}
.menu a:hover{background:rgba(255,255,255,.07)}
.menu a.ativo{background:var(--nude);color:var(--marrom);font-weight:500;box-shadow:inset 3px 0 0 var(--ouro)}
.menu .tag{font-size:10px;opacity:.6}
.badge{background:var(--ouro);color:#2E2118;border-radius:10px;padding:0 7px;font-size:11px;font-weight:600;min-width:20px;text-align:center}
.relogio{margin-top:auto;border-top:1px solid var(--marrom-linha);padding-top:14px;text-align:center}
.relogio .data{font-size:11px;color:var(--nude)}
.relogio .hora{font-family:var(--f-display);font-size:26px;letter-spacing:1px;font-variant-numeric:tabular-nums}
.relogio .cidade{font-size:10px;letter-spacing:3px;color:var(--nude)}
.principal{overflow-y:auto;display:flex;flex-direction:column;min-width:0}
.topo{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--linha);background:var(--creme);position:sticky;top:0;z-index:5}
.topo .busca{flex:1;max-width:420px}
.topo .usuario{margin-left:auto;font-size:12px;color:var(--suave);display:flex;gap:10px;align-items:center}
.menu-mobile{display:none}
.conteudo{padding:26px 28px 48px;max-width:1240px;width:100%}
.faixa-teste{background:var(--aviso-bg);color:var(--aviso);font-size:12px;padding:6px 28px;border-bottom:1px solid #EBD6AE}
h1.tit{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0;color:var(--marrom);text-wrap:balance}
.fio{width:48px;height:1px;background:var(--ouro);margin:8px 0}
.sub{color:var(--suave);font-size:13px}
.cab{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.cab .acoes{display:flex;gap:8px;flex-wrap:wrap}
.msg-dia{background:var(--marrom);border-radius:10px;padding:16px 22px;margin:18px 0 22px}
.msg-dia .rot{font-size:10px;letter-spacing:3px;color:var(--nude)}
.msg-dia .txt{font-family:var(--f-display);font-size:20px;font-weight:500;margin-top:6px}
.msg-dia .assina{font-family:var(--f-display);font-style:italic;font-size:16px;color:var(--ouro-claro);margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--branco);border-top:1px solid var(--ouro);padding:14px 16px;cursor:pointer;text-align:left;border-left:none;border-right:none;border-bottom:none}
.kpi:hover{background:var(--nude-claro)}
.kpi .n{font-family:var(--f-display);font-size:32px;color:var(--marrom);line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--suave)}
.grade2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;margin-top:18px}
.cartao{background:var(--branco);border:1px solid var(--linha);border-radius:10px;padding:16px 18px}
.cartao h3{font-size:11px;letter-spacing:2px;color:var(--suave);font-weight:500;margin:0 0 12px;text-transform:uppercase}
.item-dia{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--nude-claro);cursor:pointer}
.item-dia:last-child{border-bottom:none}
.chip-data{background:var(--nude-claro);border-radius:7px;min-width:52px;text-align:center;padding:4px 6px;color:var(--marrom)}
.chip-data b{display:block;font-family:var(--f-display);font-size:20px;font-weight:400;line-height:1.1}
.chip-data small{font-size:10px;letter-spacing:1px}
.aviso{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:8px;margin-bottom:8px;font-size:13px;cursor:pointer}
.aviso.perigo{background:var(--perigo-bg);color:var(--perigo)}
.aviso.alerta{background:var(--aviso-bg);color:var(--aviso)}
.aviso.ok{background:var(--ok-bg);color:var(--ok)}
.aviso .ponto{width:8px;height:8px;border-radius:50%;background:currentColor;margin-top:6px;flex:none}

<script>
"use strict";
/* =========================================================
   Utilidades
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, "0");
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const MESES_C = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
const DSEM = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
const DSEM_C = ["DOM","SEG","TER","QUA","QUI","SEX","SÁB"];
function hojeStr(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function toUTC(s){ const [y,m,d] = s.split("-").map(Number); return Date.UTC(y, m-1, d); }
function fromUTC(t){ const d = new Date(t); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; }
function addDias(s, n){ return fromUTC(toUTC(s) + n*86400000); }
function diaSemana(s){ return new Date(toUTC(s)).getUTCDay(); }
function difDias(a, b){ return Math.round((toUTC(b) - toUTC(a)) / 86400000); }
function fmtData(s){ if(!s) return "—"; const [y,m,d] = s.split("-"); return `${d}/${m}/${y}`; }
function fmtDataLonga(s){ const [y,m,d] = s.split("-").map(Number); return `${DSEM[diaSemana(s)]}, ${d} de ${MESES[m-1]} de ${y}`; }
function fmtMoeda(v){ return (Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function soDig(s){ return String(s||"").replace(/\D/g,""); }
function fmtCPF(s){ const d = soDig(s); return d.length===11 ? `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6,9)}-${d.slice(9)}` : s||""; }
function cpfValido(s){
  const d = soDig(s); if(d.length!==11 || /^(\d)\1+$/.test(d)) return false;
  const calc = k => { let t=0; for(let i=0;i<k;i++) t += Number(d[i])*(k+1-i); const r = (t*10)%11; return r===10?0:r; };
  return calc(9)===Number(d[9]) && calc(10)===Number(d[10]);
}
function fmtTam(b){ return b>1048576 ? (b/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(b/1024))+" KB"; }
function b64(buf){ const a = new Uint8Array(buf); let s=""; for(let i=0;i<a.length;i+=32768) s += String.fromCharCode.apply(null, a.subarray(i,i+32768)); return btoa(s); }
function unb64(s){ const bin = atob(s); const a = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a.buffer; }
function toast(msg, erro){ const t = document.createElement("div"); t.className = "toast"+(erro?" erro":""); t.textContent = msg; $("#toasts").appendChild(t); setTimeout(()=>t.remove(), erro?6000:3500); }

/* =========================================================
   Criptografia (Web Crypto: PBKDF2-SHA256 + AES-256-GCM)
   A chave-mestra aleatória cifra os dados; cada senha (e o
   código de recuperação) apenas "embrulha" essa chave.
   ========================================================= */
const ITER = 600000;
const enc = new TextEncoder(), dec = new TextDecoder();
async function derivar(senha, salt){
  const base = await crypto.subtle.importKey("raw", enc.encode(senha), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:ITER, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function cifrarBytes(chave, bytes){ const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, chave, bytes); return {iv:b64(iv), ct}; }
async function decifrarBytes(chave, iv, ct){ return crypto.subtle.decrypt({name:"AES-GCM", iv:new Uint8Array(unb64(iv))}, chave, ct); }
async function embrulhar(senha, mestraRaw){ const salt = crypto.getRandomValues(new Uint8Array(16)); const k = await derivar(senha, salt); const r = await cifrarBytes(k, mestraRaw); return {salt:b64(salt), iv:r.iv, ct:b64(r.ct)}; }
async function desembrulhar(senha, w){ const k = await derivar(senha, new Uint8Array(unb64(w.salt))); return decifrarBytes(k, w.iv, unb64(w.ct)); }
async function importarMestra(raw){ return crypto.subtle.importKey("raw", raw, {name:"AES-GCM"}, false, ["encrypt","decrypt"]); }
function gerarCodigoRec(){ const alf = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; const r = crypto.getRandomValues(new Uint8Array(20)); let s=""; for(let i=0;i<20;i++){ s += alf[r[i]%alf.length]; if(i%4===3 && i<19) s+="-"; } return s; }

/* =========================================================
   Armazenamento local (IndexedDB) — guarda só dados cifrados
   ========================================================= */
const ARM_LOCAL = (() => {
  let db = null, memoria = {kv:{}, arquivos:{}}, ok = true;
  function abrir(){ return new Promise(res => {
    try{ const r = indexedDB.open("jva_sistema", 1);
      r.onupgradeneeded = () => { r.result.createObjectStore("kv"); r.result.createObjectStore("arquivos"); };
      r.onsuccess = () => { db = r.result; res(true); };
      r.onerror = () => { ok = false; res(false); };
    }catch(e){ ok = false; res(false); }
  }); }
  function op(store, modo, fn){ return new Promise((res, rej) => {
    if(!db){ res(fn(null)); return; }
    const tx = db.transaction(store, modo); const st = tx.objectStore(store); const r = fn(st);
    tx.oncomplete = () => res(r && "result" in r ? r.result : undefined); tx.onerror = () => rej(tx.error);
  }); }
  return {
    abrir, modo:"local", get disponivel(){ return ok && !!db; },
    get: (st,k) => db ? op(st,"readonly",s=>s.get(k)) : Promise.resolve(memoria[st][k]),
    put: (st,k,v) => db ? op(st,"readwrite",s=>s.put(v,k)) : Promise.resolve(memoria[st][k]=v),
    del: (st,k) => db ? op(st,"readwrite",s=>s.delete(k)) : Promise.resolve(delete memoria[st][k]),
    chaves: st => db ? op(st,"readonly",s=>s.getAllKeys()) : Promise.resolve(Object.keys(memoria[st])),
    limpar: st => db ? op(st,"readwrite",s=>s.clear()) : Promise.resolve(memoria[st]={})
  };
})();
/* Nuvem: banco privado da sua conta Claude (data/users/<id>/…). Só dados já cifrados
   com a sua senha saem do navegador; nem a plataforma lê o conteúdo. Peças grandes
   são divididas em partes. */
const ARM_NUVEM = (() => {
  let db = null, uid = null; const PARTE = 180000;
  const col = st => db.collection(`data/users/${uid}/${st}/itens`);
  const colP = st => db.collection(`data/users/${uid}/${st}_partes/itens`);
  const chaveDoc = k => String(k).replace(/[^A-Za-z0-9_\-.~:@+]/g, "_").replace(/^\.+$/, "_").slice(0, 150);
  const dados = s_ => s_ && s_.exists ? s_.data() : null;
  function serial(v){ return JSON.stringify(v, (k, x) => x instanceof ArrayBuffer ? {__ab:b64(new Uint8Array(x))} : (x instanceof Uint8Array ? {__ab:b64(x)} : x)); }
  function desserial(t){ return JSON.parse(t, (k, x) => x && typeof x==="object" && typeof x.__ab==="string" ? unb64(x.__ab) : x); }
  async function tentar(fn){ try{ return await fn(); }catch(e){ if(e && e.code==="unavailable"){ await new Promise(r => setTimeout(r, 400 + Math.random()*800)); return fn(); } throw e; } }
  async function abrir(){
    try{
      if(!(window.claude && typeof window.claude.use==="function")) return false;
      const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if(!d || !u) return false; uid = await u.id(); if(!uid) return false; db = d; return true;
    }catch(e){ return false; }
  }
  async function put(st, k, v){
    const t = serial(v), id = chaveDoc(k), n = Math.max(1, Math.ceil(t.length / PARTE));
    const ant = dados(await tentar(() => col(st).doc(id).get())); const antN = ant?.n || 0;
    for(let i=0;i<n;i++) await tentar(() => colP(st).doc(`${id}__${i}`).set({t:t.slice(i*PARTE, (i+1)*PARTE)}));
    await tentar(() => col(st).doc(id).set({n, k:String(k), em:new Date().toISOString()}));
    for(let i=n;i<antN;i++) await colP(st).doc(`${id}__${i}`).delete().catch(()=>{});
  }
  async function get(st, k){
    const id = chaveDoc(k); const md = dados(await tentar(() => col(st).doc(id).get())); if(!md || !md.n) return undefined;
    let t = ""; for(let i=0;i<md.n;i++){ const pd = dados(await tentar(() => colP(st).doc(`${id}__${i}`).get())); if(!pd) return undefined; t += pd.t; }
    return desserial(t);
  }
  async function del(st, k){
    const id = chaveDoc(k); const md = dados(await col(st).doc(id).get().catch(() => null));
    await col(st).doc(id).delete().catch(()=>{});
    for(let i=0;i<(md?.n||0);i++) await colP(st).doc(`${id}__${i}`).delete().catch(()=>{});
  }
  async function chaves(st){ const r = await tentar(() => col(st).limit(1000).get()); return r.docs.map(d => (d.data()||{}).k || d.id); }
  async function limpar(st){ for(const k of await chaves(st)) await del(st, k); }
  return {abrir, modo:"nuvem", get disponivel(){ return !!db; }, get, put, del, chaves, limpar};

/* =========================================================
   Feriados nacionais pré-carregados (conferir) e prazos
   ========================================================= */
function pascoa(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1; return `${y}-${pad(mes)}-${pad(dia)}`; }
function feriadosNacionais(y){
  const L1="Lei 662/1949 (red. Lei 10.607/2002)";
  return [
    [`${y}-01-01`,"Confraternização Universal",L1],[`${y}-04-21`,"Tiradentes",L1],[`${y}-05-01`,"Dia do Trabalho",L1],
    [`${y}-09-07`,"Independência do Brasil",L1],[`${y}-10-12`,"Nossa Senhora Aparecida","Lei 6.802/1980"],
    [`${y}-11-02`,"Finados",L1],[`${y}-11-15`,"Proclamação da República",L1],
    [`${y}-11-20`,"Dia Nacional de Zumbi e da Consciência Negra","Lei 14.759/2023"],[`${y}-12-25`,"Natal",L1]
  ].map(([data,nome,fonte]) => ({id:uid(), data, nome, abrangencia:"Nacional", fonte, origem:"pré-carregado", conferido:false}));
}
function normalizarDB(){ // retirada definitiva de gravação/transcrição e novos módulos
  delete DB.gravacoes; delete DB.transcricoes;
  if(Array.isArray(DB.config.mensagens) && JSON.stringify(DB.config.mensagens) === JSON.stringify(MENSAGENS_ANTIGAS)) DB.config.mensagens = null; // passa a usar as novas mensagens motivacionais
  garantirAcessos(); garantirEscritorio(); garantirFinanceiro(); garantirConteudo();
}
function garantirFeriados(){
  const ano = new Date().getFullYear(); let novos = 0;
  for(let y=ano-1; y<=ano+2; y++){
    if(!DB.feriados.some(f => f.origem==="pré-carregado" && f.data.startsWith(String(y)))){ DB.feriados.push(...feriadosNacionais(y)); novos++; }
    if(!DB.suspensoes.some(s => s.inicio===`${y}-12-20`)) DB.suspensoes.push({id:uid(), inicio:`${y}-12-20`, fim:`${y+1}-01-20`, motivo:"Suspensão de prazos (recesso)", fonte:"CPC, art. 220", origem:"pré-carregado"});
  }
  if(novos) salvar();
}
function motivoNaoUtil(s){
  const w = diaSemana(s);
  if(w===0) return "domingo"; if(w===6) return "sábado";
  const f = DB.feriados.find(x => x.data===s); if(f) return "feriado: "+f.nome;
  const sp = DB.suspensoes.find(x => s>=x.inicio && s<=x.fim); if(sp) return "suspensão: "+sp.motivo;
  return null;
}
function ehUtil(s){ return !motivoNaoUtil(s); }
function proxUtil(s, memo){ let d = addDias(s,1); while(!ehUtil(d)){ memo && memo.push(`${fmtData(d)} não conta (${motivoNaoUtil(d)})`); d = addDias(d,1); } return d; }
function calcularPrazo({base, modo, dias, tipo}){
  const memo = []; let publicacao = null, inicio;
  if(modo==="djen"){
    memo.push(`Disponibilização no DJEN em ${fmtData(base)}.`);
    publicacao = proxUtil(base, memo);
    memo.push(`Considera-se publicada no primeiro dia útil seguinte: ${fmtData(publicacao)} (Lei 11.419/2006, art. 4º, § 3º).`);
    inicio = proxUtil(publicacao, memo);
  } else {
    memo.push(`Intimação/ciência em ${fmtData(base)}; exclui-se o dia do começo (CPC, art. 224).`);
    inicio = proxUtil(base, memo);
  }
  memo.push(`Início da contagem: ${fmtData(inicio)}.`);
  let venc;
  if(tipo==="uteis"){
    let d = inicio, c = 1;
    while(c < dias){ d = addDias(d,1); const m = motivoNaoUtil(d); if(m) memo.push(`${fmtData(d)} não conta (${m})`); else c++; }
    venc = d; memo.push(`${dias} dias úteis contados (CPC, art. 219): vencimento em ${fmtData(venc)}.`);
  } else {
    venc = addDias(inicio, dias-1); memo.push(`${dias} dias corridos terminam em ${fmtData(venc)}.`);
    if(!ehUtil(venc)){ const v0 = venc; venc = proxUtil(venc, memo); memo.push(`${fmtData(v0)} não é dia útil; prorrogado para ${fmtData(venc)} (CPC, art. 224, § 1º).`); }
  }
  memo.push("Feriados locais, estaduais e forenses só entram se estiverem cadastrados. Confira antes de confiar no vencimento.");
  return {publicacao, inicio, vencimento:venc, memoria:memo};
}
function diasUteisAte(s){ // dias úteis de hoje até s (negativo se passou)
  const h = hojeStr(); if(s===h) return 0;
  let n = 0, d = h;
  if(s > h){ while(d < s){ d = addDias(d,1); if(ehUtil(d)) n++; } return n; }
  while(d > s){ d = addDias(d,-1); if(ehUtil(d)) n--; } return n;
}

/* =========================================================
   Arquivos: download (artefato pede confirmação; local baixa)
   ========================================================= */
async function salvarArquivo(nome, dados, mime){
  try{
    if(window.claude && typeof window.claude.use === "function"){
      const dl = await window.claude.use("downloads");
      if(dl){ const blob = dados instanceof Blob ? dados : new Blob([dados], {type:mime||"application/octet-stream"}); await dl.save({filename:nome, data:blob}); toast("Arquivo entregue para download."); return true; }
    }
  }catch(e){
    if(e && e.code==="declined"){ toast("Download cancelado."); return false; }
    if(e && e.code==="rejected_extension"){ toast("Este tipo de arquivo não pode ser baixado no ambiente de teste. Na versão instalada ele funciona.", true); return false; }
  }
  const blob = dados instanceof Blob ? dados : new Blob([dados], {type:mime||"application/octet-stream"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000); return true;
}

/* =========================================================
   Diálogos próprios (alert/confirm não funcionam no artefato)
   ========================================================= */
function modal(titulo, corpo, botoes){
  return new Promise(res => {
    const f = document.createElement("div"); f.className = "fundo-modal";
    f.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(titulo)}"><h2>${esc(titulo)}</h2><div class="corpo">${corpo}</div><div class="rodape"></div></div>`;
    const rod = f.querySelector(".rodape");
    const fechar = v => { f.remove(); document.removeEventListener("keydown", tecla); res(v); };
    const tecla = e => { if(e.key==="Escape") fechar(null); };
    (botoes || [{t:"Fechar", v:null}]).forEach(b => {
      const bt = document.createElement("button"); bt.type = "button"; bt.className = "btn "+(b.cls||""); bt.textContent = b.t;
      bt.onclick = async () => { if(b.acao){ const r = await b.acao(f); if(r===false) return; fechar(r===undefined ? b.v : r); } else fechar(b.v); };
      rod.appendChild(bt);
    });
    document.addEventListener("keydown", tecla);
    document.body.appendChild(f);
    const pri = f.querySelector("input,select,textarea"); if(pri) pri.focus();
  });
}
const confirmar = (titulo, texto, rotulo, perigo) => modal(titulo, `<p>${texto}</p>`, [{t:"Cancelar", v:false}, {t:rotulo||"Confirmar", v:true, cls: perigo?"btn-perigo":"btn-pri"}]);
function lerForm(f){ const o = {}; f.querySelectorAll("[name]").forEach(el => { o[el.name] = el.type==="checkbox" ? el.checked : el.value.trim(); }); return o; }

async function carregarDados(){
  const r = await ARM.get("kv", "dados");
  if(!r){ DB = bancoVazio(); }
  else {
    DB = JSON.parse(dec.decode(await decifrarBytes(CHAVE, r.iv, r.ct)));
    if((DB.versao||1) < ESQUEMA_VERSAO){ // cópia cifrada intacta antes de mexer na estrutura
      await ARM.put("kv", "copia-antes-v"+ESQUEMA_VERSAO, {iv:r.iv, ct:r.ct, de:DB.versao||1, em:new Date().toISOString(), clientes:DB.clientes.length});
    }
    const base = bancoVazio(); for(const k in base) if(!(k in DB)) DB[k] = base[k];
    if((DB.versao||1) < ESQUEMA_VERSAO){ DB.versao = ESQUEMA_VERSAO; DB._migrado = new Date().toISOString(); }
  }
  garantirFeriados(); normalizarDB();
}

function statusPrazo(p){

function linkGoogle(t, data, hora, duracaoMin, local, det){
  const p = new URLSearchParams({action:"TEMPLATE", text:t, details:det||"", location:local||"", ctz:"America/Sao_Paulo"});
  if(hora){ const [h,m] = hora.split(":").map(Number); const ini = new Date(Date.UTC(2000,0,1,h,m)); const fim = new Date(ini.getTime()+(duracaoMin||60)*60000);
    const f = (s, d) => s.replace(/-/g,"") + "T" + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + "00";
    p.set("dates", f(data, ini) + "/" + f(fim.getUTCDate()===1 ? data : addDias(data,1), fim));
  } else p.set("dates", data.replace(/-/g,"") + "/" + addDias(data,1).replace(/-/g,""));
  return "https://calendar.google.com/calendar/render?" + p.toString();
}
function gerarICS(itens){
  const l = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Jessica Valiente Advocacia//Sistema//PT-BR","CALSCALE:GREGORIAN"];
  itens.forEach(i => {
    l.push("BEGIN:VEVENT", "UID:"+i.id+"@jva", "DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z");
    if(i.hora){ const h = i.hora.replace(":",""); l.push(`DTSTART;TZID=America/Sao_Paulo:${i.data.replace(/-/g,"")}T${h}00`); }
    else l.push(`DTSTART;VALUE=DATE:${i.data.replace(/-/g,"")}`, `DTEND;VALUE=DATE:${addDias(i.data,1).replace(/-/g,"")}`);
    l.push("SUMMARY:"+i.titulo.replace(/[,;]/g," "));
    if(i.local) l.push("LOCATION:"+i.local.replace(/[,;]/g," "));
    l.push("END:VEVENT");
  });
  l.push("END:VCALENDAR"); return l.join("\r\n");
}

let abaCliente = "dados";

      ${d("Telefone",cl.telefone)}${d("WhatsApp",cl.whatsapp)}${d("E-mail",cl.email)}${d("Endereço",[cl.endereco,cl.complemento,cl.bairro].filter(Boolean).join(", "))}${d("Cidade/UF",[cl.cidade,cl.uf].filter(Boolean).join("/"))}${d("CEP",cl.cep)}
      ${d("Etiquetas",(cl.etiquetas||[]).join(", "))}${d("Cadastrado em",cl.criado?fmtData(cl.criado.slice(0,10)):"")}</div>

      ${cl.whatsapp?`<p style="margin-top:14px"><a href="https://wa.me/55${soDig(cl.whatsapp)}" target="_blank" rel="noopener">Abrir conversa no WhatsApp</a> <span class="sub">(${esc(cl.whatsapp)})</span></p>`:""}</div>`,

        if(r){ DB.atendimentos.push({id:uid(), clienteId:id, usuario:USU.nome, ...r}); registrar("atendimento", `Atendimento registrado: ${cl.nome}`); salvar(); render.historico(); }
      };
    }
  };
  (render[abaCliente] || render.dados)();
  ligarTabelas(corpo);
  c.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { abaCliente = b.dataset.a; telaCliente(id); });
  $("#cl-edit").onclick = () => editarCliente(id);
  $("#cl-proc").onclick = () => editarProcesso(null, {clienteId:id});
  $("#cl-prazo").onclick = () => editarPrazo(null, {clienteId:id});
  $("#cl-comp").onclick = () => editarCompromisso(null, {clienteId:id});
  $("#cl-doc").onclick = () => gerarDocumento({clienteId:id});

      DB.clientes = DB.clientes.filter(x => x.id!==id); DB.familiares = DB.familiares.filter(f => f.clienteId!==id); DB.atendimentos = DB.atendimentos.filter(a => a.clienteId!==id);
      registrar("exclusão", `Cliente excluído: ${cl.nome}`); salvar(); toast("Cliente excluído."); ir("clientes");

  };

function ligarTabelas(raiz){
  raiz.querySelectorAll("tr[data-proc]").forEach(tr => tr.onclick = () => ir("processo-"+tr.dataset.proc));
  raiz.querySelectorAll("[data-prazo]").forEach(el => el.onclick = e => { if(e.target.closest("a,button")) return; editarPrazo(el.dataset.prazo); });
  raiz.querySelectorAll("[data-comp]").forEach(el => el.onclick = e => { if(e.target.closest("a,button")) return; editarCompromisso(el.dataset.comp); });
  raiz.querySelectorAll("[data-feito]").forEach(b => b.onclick = e => { e.stopPropagation(); const p = DB.prazos.find(x => x.id===b.dataset.feito); p.status = "concluido"; p.cumpridoEm = hojeStr(); p.cumpridoPor = USU.nome; registrar("prazo", `Prazo cumprido: ${p.descricao}`); salvar(); toast("Prazo marcado como cumprido."); rota(); });
  raiz.querySelectorAll("[data-ics]").forEach(b => b.onclick = e => { e.stopPropagation(); const x = DB.compromissos.find(c => c.id===b.dataset.ics) || DB.prazos.find(p => p.id===b.dataset.ics); const it = x.vencimento ? {id:x.id, titulo:"Prazo: "+x.descricao, data:x.vencimento} : {id:x.id, titulo:`${x.tipo}: ${x.titulo}`, data:x.data, hora:x.hora, local:x.local}; salvarArquivo("evento.ics", gerarICS([it]), "text/calendar"); });
}

const SITUACOES = ["em andamento","aguardando","pendente de documento","suspenso","em recurso","encerrado","arquivado"];

  ${lista.map(p => { const mv = DB.movimentacoes.filter(m => m.processoId===p.id).sort((a,b)=>b.data.localeCompare(a.data))[0];
    return `<tr class="clicavel" data-proc="${p.id}"><td class="num">${esc(rotProc(p))}${p.nb?`<div class="sub">NB ${esc(p.nb)}</div>`:""}${p.sigiloso?' <span class="pill alerta">sigiloso</span>':""}</td><td>${esc(nomeCli(p.clienteId))}</td><td>${p.tipo==="judicial"?"Judicial":"Administrativo"}</td><td>${esc(p.acao||"—")}</td><td>${esc(p.orgao||"—")}</td><td><span class="pill ${["encerrado","arquivado"].includes(p.situacao)?"":p.situacao==="suspenso"?"alerta":"ok"}">${esc(p.situacao)}</span></td><td>${mv?`${fmtData(mv.data)}<div class="sub">${esc(mv.descricao.slice(0,60))}</div>`:"—"}</td></tr>`; }).join("")}</tbody></table></div>`;
}
function opcoesClientes(sel){ return `<option value="">Selecione o cliente</option>` + [...DB.clientes].sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR")).map(c => `<option value="${c.id}" ${sel===c.id?"selected":""}>${esc(c.nome)}${c.cpf?" · "+fmtCPF(c.cpf):""}</option>`).join(""); }
function opcoesProcessos(sel, clienteId){ return `<option value="">Sem processo vinculado</option>` + DB.processos.filter(p => !clienteId || p.clienteId===clienteId).map(p => `<option value="${p.id}" ${sel===p.id?"selected":""}>${esc(rotProc(p))} · ${esc(nomeCli(p.clienteId))}</option>`).join(""); }
async function editarProcesso(id, pre){

    <label>Vara / órgão julgador<input name="vara" value="${esc(p.vara)}"></label>
    <label>Área do Direito<select name="area">${o(p.area||"Previdenciário",["Previdenciário","Família","Trabalhista","Cível","Consumidor","Tributário","Criminal","Outra"])}</select></label>

    <label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" name="sigiloso" style="width:auto" ${p.sigiloso?"checked":""}> Segredo de justiça / documentos indisponíveis</label>

document.addEventListener("change", e => { if(e.target.id==="pr-cli"){ const c = cliente(e.target.value); const el = $("#pr-resumo"); if(el) el.innerHTML = c ? `${esc(c.nome)} · CPF ${esc(fmtCPF(c.cpf))||"—"} · NIT ${esc(c.nit)||"—"} · ${esc(c.cidade||"")}` : ""; } });
function telaProcessos(c, filtro){

    if(filtro.tipo && p.tipo!==filtro.tipo) return false;
    if(filtro.sit==="ativos" && ["encerrado","arquivado"].includes(p.situacao)) return false;
    if(filtro.sit && filtro.sit!=="ativos" && p.situacao!==filtro.sit) return false;
    if(filtro.q){ const q = filtro.q.toLowerCase(); return [p.numero,p.protocolo,p.nb,p.acao,p.orgao,nomeCli(p.clienteId)].some(x => (x||"").toLowerCase().includes(q)); }
    return true;
  });
  c.innerHTML = `<div class="cab"><div><h1 class="tit">Processos e requerimentos</h1><div class="fio"></div><div class="sub">${DB.processos.filter(p=>p.tipo==="judicial").length} judiciais · ${DB.processos.filter(p=>p.tipo==="administrativo").length} administrativos</div></div><div class="acoes"><button class="btn btn-pri" id="novo-proc">Novo processo ou requerimento</button></div></div>

  <select id="fp-sit"><option value="ativos" ${filtro.sit==="ativos"?"selected":""}>Em aberto</option><option value="" ${filtro.sit===""?"selected":""}>Todas as situações</option>${SITUACOES.map(s=>`<option ${filtro.sit===s?"selected":""}>${s}</option>`).join("")}</select></div>
  ${tabelaProcessos(lista)}`;
  $("#novo-proc").onclick = () => DB.clientes.length ? editarProcesso() : modal("Cadastre um cliente primeiro", "<p>Todo processo pertence a um cliente. Cadastre o cliente e depois o processo, para que os dados dele sejam aproveitados.</p>");
  ligarTabelas(c);
  const refaz = () => { telaProcessos(c, {q:$("#fp-q").value, tipo:$("#fp-tipo").value, sit:$("#fp-sit").value}); const q = $("#fp-q"); q.focus(); q.setSelectionRange(q.value.length, q.value.length); };

      [{t:"Cancelar", v:null}, {t:"Salvar", cls:"btn-pri", acao: f => { const v = lerForm(f.querySelector("form")); return v.descricao ? v : false; }}]);
    if(r){ DB.movimentacoes.push({id:uid(), processoId:id, origem:"manual", usuario:USU.nome, ...r}); registrar("movimentação", `Movimentação em ${rotProc(p)}: ${r.descricao.slice(0,60)}`); salvar(); telaProcesso(id); }

  const del = $("#pr-del");

      DB.processos = DB.processos.filter(x => x.id!==id); DB.movimentacoes = DB.movimentacoes.filter(m => m.processoId!==id); DB.prazos = DB.prazos.filter(x => x.processoId!==id); DB.compromissos = DB.compromissos.filter(x => x.processoId!==id);
      DB.documentos.forEach(dd => { if(dd.processoId===id) dd.processoId = ""; });
      registrar("exclusão", `Processo excluído: ${rotProc(p)} (${nomeCli(p.clienteId)})`); salvar(); toast("Processo excluído."); ir("processos");
    }

}

function tabelaPrazos(lista, compacto){
  if(!lista.length) return `<div class="tabela-wrap"><div class="vazio">Nenhum prazo.</div></div>`;
  lista = [...lista].sort((a,b) => (a.status==="concluido") - (b.status==="concluido") || a.vencimento.localeCompare(b.vencimento));
  return `<div class="tabela-wrap"><table><thead><tr><th>Vencimento</th><th>Prazo</th>${compacto?"":"<th>Processo / cliente</th><th>Responsável</th>"}<th>Situação</th><th></th></tr></thead><tbody>
  ${lista.map(p => { const st = statusPrazo(p); const pr = processo(p.processoId);
    return `<tr class="clicavel" data-prazo="${p.id}"><td class="num">${fmtData(p.vencimento)}${p.fatal?' <span class="pill perigo">fatal</span>':""}</td><td>${esc(p.descricao)}${p.conferido?"":' <span class="pill alerta">conferir</span>'}</td>${compacto?"":`<td>${pr?esc(rotProc(pr))+"<div class='sub'>"+esc(nomeCli(p.clienteId))+"</div>":esc(nomeCli(p.clienteId))}</td><td>${esc(p.responsavel||"—")}${p.revisor?`<div class="sub">Revisa: ${esc(p.revisor)}</div>`:""}</td>`}<td><span class="pill ${st.cls}">${esc(st.t)}</span></td>
    <td style="white-space:nowrap">${p.status!=="concluido"?`<button class="btn btn-sm" data-feito="${p.id}">Cumprido</button> `:""}<a class="btn btn-sm" href="${linkGoogle("Prazo: "+p.descricao, p.vencimento, null, 0, "", `${pr?"Processo "+rotProc(pr)+". ":""}Conferir no sistema.`)}" target="_blank" rel="noopener">Google Agenda</a></td></tr>`; }).join("")}</tbody></table></div>`;
}
function tabelaCompromissos(lista, compacto){
  if(!lista.length) return `<div class="tabela-wrap"><div class="vazio">Nenhum compromisso.</div></div>`;
  lista = [...lista].sort((a,b) => (a.data+(a.hora||"")).localeCompare(b.data+(b.hora||"")));
  return `<div class="tabela-wrap"><table><thead><tr><th>Data</th><th>Compromisso</th>${compacto?"":"<th>Cliente</th>"}<th>Local</th><th></th></tr></thead><tbody>
  ${lista.map(x => `<tr class="clicavel" data-comp="${x.id}"><td class="num">${fmtData(x.data)}<div class="sub">${esc(x.hora||"dia todo")}</div></td><td><span class="pill">${esc(x.tipo)}</span> ${esc(x.titulo)}${x.status==="cancelado"?' <span class="pill">cancelado</span>':""}</td>${compacto?"":`<td>${esc(nomeCli(x.clienteId))}</td>`}<td>${esc(x.local||"—")}</td>
  <td style="white-space:nowrap"><a class="btn btn-sm" href="${linkGoogle(`${x.tipo}: ${x.titulo}`, x.data, x.hora, Number(x.duracao)||60, x.local, x.processoId?"Processo "+rotProc(processo(x.processoId)):"")}" target="_blank" rel="noopener">Google Agenda</a> <button class="btn btn-sm" data-ics="${x.id}">.ics</button></td></tr>`).join("")}</tbody></table></div>`;
}
async function editarPrazo(id, pre){
  const p = id ? DB.prazos.find(x => x.id===id) : {modo:"djen", base:hojeStr(), dias:15, tipoContagem:"uteis", responsavel:USU.nome, status:"pendente", ...pre};
  if(p.processoId && !p.clienteId) p.clienteId = processo(p.processoId)?.clienteId;
  const corpo = `<form class="campos" id="f-prazo">
    <label class="largo">Descrição do prazo *<input name="descricao" required value="${esc(p.descricao)}" placeholder="Contestação, réplica, recurso, cumprimento de exigência"></label>
    <label>Cliente<select name="clienteId" id="pz-cli">${opcoesClientes(p.clienteId)}</select></label>
    <label>Processo<select name="processoId" id="pz-proc">${opcoesProcessos(p.processoId, p.clienteId)}</select></label>
    <label>Data-base<input name="base" id="pz-base" type="date" value="${esc(p.base)}"></label>
    <label>A data-base é<select name="modo" id="pz-modo"><option value="djen" ${p.modo==="djen"?"selected":""}>Disponibilização no DJEN</option><option value="intimacao" ${p.modo==="intimacao"?"selected":""}>Intimação/ciência (início no dia útil seguinte)</option></select></label>
    <label>Quantidade de dias<input name="dias" id="pz-dias" type="number" min="1" value="${esc(p.dias)}"></label>
    <label>Contagem<select name="tipoContagem" id="pz-tipo"><option value="uteis" ${p.tipoContagem==="uteis"?"selected":""}>Dias úteis (CPC)</option><option value="corridos" ${p.tipoContagem==="corridos"?"selected":""}>Dias corridos</option></select></label>
    <label>Vencimento calculado<input name="vencimento" id="pz-venc" type="date" value="${esc(p.vencimento)}"></label>
    <label>Responsável (executa)<input name="responsavel" value="${esc(p.responsavel)}"></label>
    <label>Revisor<input name="revisor" value="${esc(p.revisor)}"></label>
    <label>Acompanha<input name="acompanha" value="${esc(p.acompanha)}"></label>
    <label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" name="fatal" style="width:auto" ${p.fatal?"checked":""}> Prazo fatal</label>
    <label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" name="conferido" style="width:auto" ${p.conferido?"checked":""} ${USU.perfil==="estagiario"?"disabled title='Só advogado confere'":""}> Conferido por advogado</label>
    <label class="largo">Observações<textarea name="obs">${esc(p.obs)}</textarea></label>
    <div class="largo memoria" id="pz-memo"></div>
    <div class="sub largo" id="pz-erro" style="color:var(--perigo)"></div></form>`;
  const recalcular = f => {
    const base = f.querySelector("#pz-base").value, dias = Number(f.querySelector("#pz-dias").value);
    if(!base || !dias){ f.querySelector("#pz-memo").innerHTML = "Informe a data-base e os dias para calcular."; return; }
    const r = calcularPrazo({base, modo:f.querySelector("#pz-modo").value, dias, tipo:f.querySelector("#pz-tipo").value});
    f.querySelector("#pz-venc").value = r.vencimento;
    f.querySelector("#pz-memo").innerHTML = `<b>Memória do cálculo</b><ol>${r.memoria.map(m => `<li>${esc(m)}</li>`).join("")}</ol>`;
  };
  const prom = modal(id ? "Editar prazo" : "Novo prazo", corpo, [
    ...(id && pode("excluir") ? [{t:"Excluir", cls:"btn-perigo", acao: async () => { DB.prazos = DB.prazos.filter(x => x.id!==id); registrar("exclusão", `Prazo excluído: ${p.descricao}`); salvar(); return "excluido"; }}] : []),
    {t:"Cancelar", v:null},
    {t:"Salvar", cls:"btn-pri", acao: f => { const v = lerForm(f.querySelector("form")); const e = f.querySelector("#pz-erro");
      if(!v.descricao){ e.textContent = "Descreva o prazo."; return false; } if(!v.vencimento){ e.textContent = "Calcule ou informe o vencimento."; return false; }
      v.dias = Number(v.dias); if(USU.perfil==="estagiario") v.conferido = !!p.conferido; return v; }}]);
  const f = document.querySelector("#f-prazo").closest(".modal");
  ["#pz-base","#pz-modo","#pz-dias","#pz-tipo"].forEach(s => f.querySelector(s).addEventListener("input", () => recalcular(f)));
  f.querySelector("#pz-cli").addEventListener("change", e => { f.querySelector("#pz-proc").innerHTML = opcoesProcessos("", e.target.value); });
  f.querySelector("#pz-proc").addEventListener("change", e => { const pr = processo(e.target.value); if(pr) f.querySelector("#pz-cli").value = pr.clienteId; });
  if(!id) recalcular(f); else if(p.base) recalcular(f);
  const r = await prom;
  if(r === "excluido"){ toast("Prazo excluído."); rota(); return; }
  if(!r) return;
  if(id){ Object.assign(p, r); registrar("prazo", `Prazo alterado: ${p.descricao} (${fmtData(p.vencimento)})`); }
  else { const n = {id:uid(), status:"pendente", criadoPor:USU.nome, criado:new Date().toISOString(), ...r}; DB.prazos.push(n); registrar("prazo", `Prazo cadastrado: ${n.descricao} (${fmtData(n.vencimento)})${n.clienteId?" · "+nomeCli(n.clienteId):""}`); }
  salvar(); toast("Prazo salvo."); rota();
}

let agendaAba = "calendario", agendaMes = null;
function telaAgenda(c){
  const h = hojeStr(); agendaMes = agendaMes || h.slice(0,7);
  const abertos = DB.prazos.filter(p => p.status!=="concluido");
  c.innerHTML = `<div class="cab"><div><h1 class="tit">Prazos e agenda</h1><div class="fio"></div><div class="sub">${abertos.length} prazo(s) em aberto · ${abertos.filter(p=>p.vencimento<h).length} vencido(s) · ${abertos.filter(p=>!p.conferido).length} a conferir</div></div>
  <div class="acoes"><button class="btn btn-pri" id="ag-prazo">Novo prazo</button><button class="btn" id="ag-comp">Novo compromisso</button><button class="btn" id="ag-ics">Exportar agenda (.ics)</button></div></div>
  <div class="abas">${[["calendario","Calendário"],["prazos","Prazos"],["compromissos","Compromissos"],["concluidos","Prazos cumpridos"]].map(([k,t]) => `<button data-ag="${k}" class="${agendaAba===k?"ativo":""}">${t}</button>`).join("")}</div><div id="ag-corpo"></div>`;
  const corpo = $("#ag-corpo");
  if(agendaAba==="calendario"){
    const [y,m] = agendaMes.split("-").map(Number); const prim = `${agendaMes}-01`; const ini = addDias(prim, -diaSemana(prim));
    let cel = ""; for(let i=0;i<42;i++){ const d = addDias(ini,i); const fer = DB.feriados.find(f=>f.data===d);
      const evs = [...DB.prazos.filter(p=>p.vencimento===d && p.status!=="concluido").map(p=>`<span class="ev ${p.fatal?"fatal":"prazo"}" data-prazo="${p.id}" title="${esc(p.descricao)}">${esc(p.descricao)}</span>`),
                   ...DB.compromissos.filter(x=>x.data===d && x.status!=="cancelado").map(x=>`<span class="ev" data-comp="${x.id}" title="${esc(x.titulo)}">${esc(x.hora||"")} ${esc(x.tipo)}</span>`)].join("");
      cel += `<div class="dia ${d.slice(0,7)!==agendaMes?"fora":""} ${d===h?"hoje":""} ${fer?"feriado":""}"><span class="nd">${Number(d.slice(8))}</span>${fer?`<span class="fer">${esc(fer.nome)}</span>`:""}${evs}</div>`; }
    corpo.innerHTML = `<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><button class="btn btn-sm" id="cal-ant" aria-label="Mês anterior">‹</button><div class="secao-tit" style="margin:0;min-width:200px;text-align:center">${MESES[m-1].replace(/^./,s=>s.toUpperCase())} de ${y}</div><button class="btn btn-sm" id="cal-prox" aria-label="Próximo mês">›</button><button class="btn btn-sm" id="cal-hoje">Hoje</button></div>
    <div class="cal">${DSEM_C.map(d=>`<div class="dsem">${d}</div>`).join("")}${cel}</div>
    <p class="sub">Laranja: prazos · vermelho: prazos fatais · bege: compromissos · fundo dourado claro: feriado cadastrado.</p>`;
    const mud = n => { const dt = new Date(Date.UTC(y, m-1+n, 1)); agendaMes = `${dt.getUTCFullYear()}-${pad(dt.getUTCMonth()+1)}`; telaAgenda(c); };
    $("#cal-ant").onclick = () => mud(-1); $("#cal-prox").onclick = () => mud(1); $("#cal-hoje").onclick = () => { agendaMes = h.slice(0,7); telaAgenda(c); };
  } else if(agendaAba==="prazos") corpo.innerHTML = tabelaPrazos(abertos);
  else if(agendaAba==="concluidos") corpo.innerHTML = tabelaPrazos(DB.prazos.filter(p=>p.status==="concluido"));
  else corpo.innerHTML = tabelaCompromissos(DB.compromissos.filter(x => x.data >= addDias(h,-30)));
  ligarTabelas(corpo);
  c.querySelectorAll("[data-ag]").forEach(b => b.onclick = () => { agendaAba = b.dataset.ag; telaAgenda(c); });
  $("#ag-prazo").onclick = () => editarPrazo();
  $("#ag-comp").onclick = () => editarCompromisso();
  $("#ag-ics").onclick = () => {
    const it = [...DB.compromissos.filter(x=>x.data>=h && x.status!=="cancelado").map(x=>({id:x.id, titulo:`${x.tipo}: ${x.titulo}`, data:x.data, hora:x.hora, local:x.local})), ...abertos.map(p=>({id:p.id, titulo:"Prazo: "+p.descricao, data:p.vencimento}))];
    if(!it.length){ toast("Não há itens futuros para exportar."); return; }
    salvarArquivo("agenda-jva.ics", gerarICS(it), "text/calendar");
  };
}

const CATS_DOC = ["Documento pessoal","Comprovante de residência","CNIS","Laudo / atestado médico","Exame","PPP / LTCAT","Procuração","Contrato","Declaração","Requerimento","Petição","Decisão / sentença","Outro"];
function blocoDocumentos(filtro){
  const docs = DB.documentos.filter(d => (!filtro.clienteId || d.clienteId===filtro.clienteId) && (!filtro.processoId || d.processoId===filtro.processoId)).sort((a,b) => b.data.localeCompare(a.data));

function ligarDocumentos(raiz, filtro){
  const gd = raiz.querySelector(".doc-gerar"); if(gd) gd.onclick = () => gerarDocumento({clienteId:filtro.clienteId || processo(filtro.processoId)?.clienteId, processoId:filtro.processoId});
  raiz.querySelectorAll("[data-assdoc]").forEach(b => b.onclick = () => gerenciarAssinatura(b.dataset.assdoc));
  raiz.querySelectorAll("[data-pedirass]").forEach(b => b.onclick = async () => {
    const d = DB.documentos.find(x => x.id===b.dataset.pedirass), cl = cliente(d.clienteId);
    if(!cl){ toast("Vincule o documento a um cliente primeiro.", true); return; }
    const a = {id:uid(), documentoId:d.id, clienteId:d.clienteId, processoId:d.processoId||"", titulo:`${d.nome.replace(/\.pdf$/i,"")}`, status:"pendente", criado:new Date().toISOString(), signatarios:[{nome:cl.nome.toUpperCase(), papel:"Cliente", tipo:"cliente", assinou:false}], historico:[]};
    DB.assinaturas.push(a); histAss(a, "Documento marcado para assinatura"); salvar(); gerenciarAssinatura(a.id);
  });
  const up = raiz.querySelector(".doc-up");
  if(up) up.onchange = async () => {
    const cat = raiz.querySelector(".doc-cat").value; let n = 0;
    for(const file of up.files){
      if(file.size > 25*1048576){ toast(`${file.name}: acima de 25 MB.`, true); continue; }
      const buf = await file.arrayBuffer(); const r = await cifrarBytes(CHAVE, buf); const id = uid();
      await ARM.put("arquivos", id, {iv:r.iv, ct:r.ct});
      DB.documentos.push({id, clienteId:filtro.clienteId||"", processoId:filtro.processoId||"", nome:file.name, tipo:file.type, tamanho:file.size, categoria:cat, data:hojeStr(), enviadoPor:USU.nome});
      registrar("documento", `Documento enviado: ${file.name}${filtro.clienteId?" · "+nomeCli(filtro.clienteId):""}`); n++;
    }
    salvar(); if(n) toast(`${n} arquivo(s) guardado(s) com criptografia.`); rota();
  };

    const d = DB.documentos.find(x => x.id===b.dataset.baixar); const r = await ARM.get("arquivos", d.id);
    if(!r){ toast("Arquivo não encontrado neste computador.", true); return; }
    const buf = await decifrarBytes(CHAVE, r.iv, r.ct); registrar("documento", `Documento baixado: ${d.nome}`); salvar();
    salvarArquivo(d.nome, new Blob([buf], {type:d.tipo}), d.tipo);
  });

    const d = DB.documentos.find(x => x.id===b.dataset.ddel);

  });
}

async function logoLimpo(opac){
  const logo = await carregarLogo(), n = 600, cv = document.createElement("canvas"); cv.width = cv.height = n;
  const g = cv.getContext("2d"); g.drawImage(logo, 0, 0, n, n); const im = g.getImageData(0, 0, n, n), d = im.data;

// Monta o PDF: doc = {titulo, paragrafos:[texto], local, assinantes:[{nome, linha2}], marcaDagua}
async function gerarPDF(doc){
  const W = 595.28, H = 841.89, ML = 70.87, MR = 56.69, LT = W - ML - MR;
  const esc_ = DB.escritorio, TAM = 12, ENT = 17.5;
  const timbre = await imagemTimbre(esc_, W, 78), md = doc.marcaDagua ? await imagemMarcaDagua(300) : null;
  const rodapeTxt = [esc_.endereco && `${esc_.endereco}${esc_.cidade?", "+esc_.cidade:""}`, esc_.telefone && `WhatsApp ${esc_.telefone}`, esc_.email, esc_.instagram].filter(Boolean).join("  ·  ");
  const paginas = []; let ops = [], y = 0;
  const TOPO = H - 78 - 34, BASE = 74;
  const novaPagina = () => { ops = []; paginas.push(ops); y = TOPO; };
  novaPagina();
  const texto = (x, yy, segs, tw) => { ops.push(`BT ${(tw||0).toFixed(3)} Tw 1 0 0 1 ${x.toFixed(2)} ${yy.toFixed(2)} Tm`); let fAt = null;
    segs.forEach(s => { if(s.f!==fAt){ ops.push(`/F${s.f} ${s.tam||TAM} Tf`); fAt = s.f; } ops.push(`${strPDF(s.t)} Tj`); }); ops.push("ET"); };

  // título
  if(doc.titulo){ const tw = larguraTxt(doc.titulo, "B", 13.5); texto((W - tw)/2, y, [{t:doc.titulo, f:"B", tam:13.5}]); y -= 34; }

    const centro = par.startsWith("^^"), dir = par.startsWith(">>"); let p = par.replace(/^(\^\^|>>)\s*/, "");
    const recuo = (centro || dir) ? 0 : 35.4;
    const linhas = quebrarLinhas(p, "R", TAM, LT - recuo);
    linhas.forEach((l, i) => {
      if(y < BASE + 10) novaPagina();
      const segs = linhaSegs(l), larg = l.reduce((w, q) => w + (q.esp ? larguraTxt(" ", "R", TAM) : q.w), 0);
      const nEsp = l.filter(q => q.esp).length, ultima = i === linhas.length - 1;
      const xi = ML + (i===0 ? recuo : 0), disp = LT - (i===0 ? recuo : 0);

    const par_ = ass.slice(i, i+2), altura = 78;

    });

  }

}
function finalizarPDF(paginas, {titulo, timbre, md, rodapeTxt}){

    if(idMD) cab.unshift(`q 300 0 0 300 ${((W-300)/2).toFixed(2)} ${((H-300)/2 - 20).toFixed(2)} cm /Md Do Q`);

const UNID = ["","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez","onze","doze","treze","catorze","quinze","dezesseis","dezessete","dezoito","dezenove"];
const DEZ = ["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"];
const CEM = ["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];
function ate999(n){ if(n===100) return "cem"; const c = Math.floor(n/100), r = n%100, p = []; if(c) p.push(CEM[c]); if(r){ if(r<20) p.push(UNID[r]); else { const d = Math.floor(r/10), u = r%10; p.push(DEZ[d] + (u ? " e " + UNID[u] : "")); } } return p.join(" e "); }
function inteiroExtenso(n){
  if(n===0) return "zero";
  const grupos = [[1e9,"bilhão","bilhões"],[1e6,"milhão","milhões"],[1e3,"mil","mil"],[1,"",""]], p = []; let resto = n;
  grupos.forEach(([v, s, pl]) => { const q = Math.floor(resto / v); resto %= v; if(!q) return; p.push(v===1e3 && q===1 ? "mil" : `${ate999(q)}${s ? " " + (q>1 ? pl : s) : ""}`); });
  if(p.length < 2) return p[0] || "";
  const ult = p[p.length-1], ultN = n % 1000, junta = ultN < 100 || ultN % 100 === 0 ? " e " : ", ";
  return p.slice(0,-1).join(", ") + junta + ult;
}
function reaisExtenso(v){
  v = Math.round((Number(v)||0)*100); const r = Math.floor(v/100), c = v%100, p = [];
  if(r) p.push(`${inteiroExtenso(r)}${r>=1e6 && r%1e6===0 ? " de" : ""} ${r===1?"real":"reais"}`);
  if(c) p.push(`${inteiroExtenso(c)} ${c===1?"centavo":"centavos"}`);
  return p.join(" e ") || "zero real";
}

function qualificacaoCliente(cl, faltas){

function linhaProf(p){ return `${p.tipo==="estagiario" ? (F(p.genero)?"Estagiária":"Estagiário") : (F(p.genero)?"Advogada":"Advogado")} · OAB/${p.uf||"RS"} ${p.oab||LACUNA}`; }
function concordar(lista){ const pl = lista.length > 1, fem = lista.every(p => F(p.genero)); return (m, f, mp, fp) => pl ? (fem ? fp : mp) : (fem ? f : m); }
function enderecoEscritorio(){ const e = DB.escritorio; return [e.endereco, e.cidade].filter(Boolean).join(", "); }

const MODELOS_BASE = {
  procuracao:{t:"Procuração", cat:"Procuração", titulo:"PROCURAÇÃO"},
  contrato:{t:"Contrato de honorários", cat:"Contrato", titulo:"CONTRATO DE PRESTAÇÃO DE SERVIÇOS ADVOCATÍCIOS"},
  hipossuficiencia:{t:"Declaração de hipossuficiência", cat:"Declaração", titulo:"DECLARAÇÃO DE HIPOSSUFICIÊNCIA ECONÔMICA"}
};
function montarTexto(tipo, o){
  const cl = cliente(o.clienteId), faltas = [], profs = (DB.escritorio.profissionais||[]).filter(p => (o.profs||[]).includes(p.id));
  const qc = qualificacaoCliente(cl, faltas), fc = F(cl.genero), gc = (m, f) => fc ? f : m;
  const c = concordar(profs), qp = profs.map(p => qualificacaoProf(p, faltas)).join("; ");
  const end = enderecoEscritorio(), email = DB.escritorio.email;
  const temEst = profs.some(p => p.tipo==="estagiario"), temAdv = profs.some(p => p.tipo!=="estagiario");
  const avisos = [];
  if(tipo!=="hipossuficiencia" && !profs.length) avisos.push("Selecione ao menos um profissional.");
  if(tipo!=="hipossuficiencia" && profs.length && !temAdv) avisos.push("Nenhum advogado(a) selecionado. Estagiário só pratica atos em conjunto com advogado e sob a responsabilidade dele (Lei 8.906/1994, art. 3º, § 2º).");
  const p = [];
  if(tipo==="procuracao"){
    p.push(`**${gc("OUTORGANTE","OUTORGANTE")}:** ${qc}.`);
    p.push(`**${c("OUTORGADO","OUTORGADA","OUTORGADOS","OUTORGADAS")}:** ${qp || LACUNA}${end ? `, com escritório profissional na ${end}` : ""}${email ? `, e-mail ${email}` : ""}.`);
    let pod = `**PODERES:** por este instrumento particular de mandato, ${gc("o outorgante","a outorgante")} nomeia e constitui ${c("seu bastante procurador o outorgado acima qualificado","sua bastante procuradora a outorgada acima qualificada","seus bastantes procuradores os outorgados acima qualificados","suas bastantes procuradoras as outorgadas acima qualificadas")}, a quem confere os poderes da cláusula *ad judicia et extra* para o foro em geral, podendo propor as ações competentes e defender os seus interesses em qualquer juízo, instância ou tribunal, inclusive nos Juizados Especiais, e praticar todos os atos necessários ao fiel cumprimento deste mandato`;
    if(o.especiais) pod += `, conferindo ainda os poderes especiais para receber citação, confessar, reconhecer a procedência do pedido, transigir, desistir, renunciar ao direito sobre o qual se funda a ação, receber, dar quitação, firmar compromisso e assinar declaração de hipossuficiência econômica (art. 105 do Código de Processo Civil)`;
    if(o.inss) pod += `; e para ${gc("representá-lo","representá-la")} perante o Instituto Nacional do Seguro Social (INSS) e demais órgãos públicos, podendo requerer benefícios, revisões e certidões, ter vista e extrair cópias de processos administrativos, cumprir exigências, agendar atendimentos e perícias, apresentar documentos e interpor recursos`;
    pod += `, podendo ainda substabelecer, com ou sem reserva de poderes.`;
    p.push(pod);
    if(o.finalidade) p.push(`**FINALIDADE ESPECÍFICA:** ${o.finalidade.replace(/\.$/,"")}.`);
    if(temEst) p.push(`${profs.filter(x => x.tipo==="estagiario").length>1 ? "Os estagiários outorgados atuarão" : (F(profs.find(x => x.tipo==="estagiario").genero) ? "A estagiária outorgada atuará" : "O estagiário outorgado atuará")} nos limites do art. 3º, § 2º, da Lei nº 8.906/1994, em conjunto com advogado(a) e sob a responsabilidade deste(a).`);
  }
  if(tipo==="contrato"){
    const CTDO = c("CONTRATADO","CONTRATADA","CONTRATADOS","CONTRATADAS"), CTE = gc("CONTRATANTE","CONTRATANTE");
    p.push(`**${CTE}:** ${qc}.`);
    p.push(`**${CTDO}:** ${qp || LACUNA}${end ? `, com escritório profissional na ${end}` : ""}.`);
    p.push(`As partes acima qualificadas ajustam a prestação de serviços advocatícios mediante as cláusulas seguintes.`);
    p.push(`**CLÁUSULA 1ª – DO OBJETO.** ${c("O CONTRATADO prestará","A CONTRATADA prestará","OS CONTRATADOS prestarão","AS CONTRATADAS prestarão")} ${gc("ao CONTRATANTE","à CONTRATANTE")} serviços advocatícios consistentes em ${o.objeto ? o.objeto.replace(/\.$/,"") : (faltas.push("objeto do contrato"), LACUNA)}.`);
    const hon = [];
    if(Number(o.valorFixo) > 0) hon.push(`o valor de ${fmtMoeda(o.valorFixo)} (${reaisExtenso(o.valorFixo)})${o.formaPagamento ? ", " + o.formaPagamento.replace(/\.$/,"") : ""}`);
    if(Number(o.percentual) > 0) hon.push(`o percentual de ${String(o.percentual).replace(".",",")}% (${inteiroExtenso(Math.floor(Number(o.percentual)))}${Number(o.percentual)%1 ? " vírgula " + inteiroExtenso(Math.round((Number(o.percentual)%1)*10)) : ""} por cento) ${o.basePercentual ? o.basePercentual.replace(/\.$/,"") : "sobre o proveito econômico obtido"}`);
    if(!hon.length) faltas.push("valor ou percentual dos honorários");
    p.push(`**CLÁUSULA 2ª – DOS HONORÁRIOS.** Pelos serviços contratados, ${gc("o CONTRATANTE","a CONTRATANTE")} pagará ${hon.length ? hon.join(", acrescido de ") : LACUNA}. Os honorários contratuais não se confundem com os honorários de sucumbência, que pertencem ao(à) advogado(a), nos termos do art. 23 da Lei nº 8.906/1994.`);
    p.push(`**CLÁUSULA 3ª – DAS DESPESAS.** Custas, emolumentos, perícias particulares, cópias, deslocamentos e demais despesas necessárias ao andamento do serviço correm por conta ${gc("do CONTRATANTE","da CONTRATANTE")}, mediante comunicação prévia, e não estão incluídas nos honorários.`);
    p.push(`**CLÁUSULA 4ª – DAS OBRIGAÇÕES ${gc("DO CONTRATANTE","DA CONTRATANTE")}.** ${gc("O CONTRATANTE","A CONTRATANTE")} compromete-se a fornecer documentos e informações verdadeiros e completos, a comunicar mudança de endereço, telefone ou de qualquer situação que interesse ao caso, e a comparecer aos atos para os quais for ${gc("convocado","convocada")}, como atendimentos, perícias e audiências.`);
    p.push(`**CLÁUSULA 5ª – DA RESCISÃO.** Qualquer das partes poderá rescindir este contrato mediante comunicação por escrito. Havendo rescisão ou revogação do mandato por iniciativa ${gc("do CONTRATANTE","da CONTRATANTE")}, sem culpa ${c("do CONTRATADO","da CONTRATADA","dos CONTRATADOS","das CONTRATADAS")}, serão devidos os honorários proporcionais aos serviços já prestados.`);
    p.push(`**CLÁUSULA 6ª – DO TÍTULO EXECUTIVO.** Este contrato constitui título executivo, nos termos do art. 24 da Lei nº 8.906/1994.`);
    p.push(`**CLÁUSULA 7ª – DA ASSINATURA ELETRÔNICA.** As partes admitem como válida a assinatura deste instrumento por meio eletrônico, inclusive pela assinatura eletrônica do gov.br, nos termos do art. 10, § 2º, da Medida Provisória nº 2.200-2/2001.`);
    p.push(`**CLÁUSULA 8ª – DO FORO.** Fica eleito o foro da comarca de ${o.foro || (faltas.push("comarca do foro"), LACUNA)} para dirimir as questões oriundas deste contrato.`);
    p.push(`E, por estarem justas e contratadas, as partes assinam o presente instrumento.`);
  }
  if(tipo==="hipossuficiencia"){
    p.push(`${qc}, **DECLARA**, para fins de concessão da gratuidade da justiça (arts. 98 e 99 do Código de Processo Civil), que não possui condições de arcar com as custas, as despesas processuais e os honorários advocatícios sem prejuízo do próprio sustento e do de sua família.`);
    p.push(`Declara, ainda, estar ${gc("ciente","ciente")} de que a falsidade desta declaração pode ${gc("sujeitá-lo","sujeitá-la")} às sanções civis, administrativas e penais cabíveis.`);
  }
  const assinantes = [{nome:cl.nome.toUpperCase(), linha2: cl.cpf ? "CPF " + fmtCPF(cl.cpf) : "CPF " + LACUNA, papel: tipo==="procuracao" ? "Outorgante" : tipo==="contrato" ? "Contratante" : "Declarante", tipo:"cliente"}];
  if(tipo==="contrato") profs.forEach(pf => assinantes.push({nome:pf.nome.toUpperCase(), linha2:linhaProf(pf), papel:"Contratado(a)", tipo:"prof", profId:pf.id}));
  if(tipo==="contrato" && o.testemunhas) [1,2].forEach(n => assinantes.push({nome:`Testemunha ${n}`, linha2:"Nome e CPF:", papel:"Testemunha", tipo:"testemunha"}));
  return {paragrafos:p, faltas:[...new Set(faltas)], avisos, assinantes};
}

async function gerarDocumento(pre){
  pre = pre || {};
  if(!DB.clientes.length){ await modal("Gerar documento", `<p>Cadastre um cliente primeiro. Os documentos são preenchidos com os dados da ficha dele.</p>`); return; }
  const profs = DB.escritorio.profissionais || [];
  const hoje = hojeStr(), cidade = (DB.escritorio.cidade||"").trim();
  const r1 = await modal("Gerar documento", `<form class="campos" id="f-gd">
    <label class="largo">Modelo<select name="tipo">${Object.entries(MODELOS_BASE).map(([k,m]) => `<option value="${k}" ${pre.tipo===k?"selected":""}>${m.t}</option>`).join("")}</select></label>
    <label>Cliente *<select name="clienteId" required>${opcoesClientes(pre.clienteId)}</select></label>
    <label>Processo (opcional)<select name="processoId">${opcoesProcessos(pre.processoId, pre.clienteId)}</select></label>
    <fieldset class="largo grupo-prof" data-para="procuracao contrato"><legend>Profissionais (outorgados / contratados)</legend>${profs.length ? profs.map(pf => `<label class="chk"><input type="checkbox" name="prof_${pf.id}" ${pf.padrao!==false?"checked":""}> ${esc(pf.nome)} <span class="sub">· ${esc(linhaProf(pf))}</span></label>`).join("") : `<p class="sub">Nenhum profissional cadastrado. Cadastre em Configurações → Escritório e timbrado.</p>`}</fieldset>
    <label class="largo chk" data-para="procuracao"><input type="checkbox" name="especiais" checked> Incluir poderes especiais do art. 105 do CPC</label>
    <label class="largo chk" data-para="procuracao"><input type="checkbox" name="inss" checked> Incluir representação perante o INSS e órgãos públicos</label>
    <label class="largo" data-para="procuracao">Finalidade específica (opcional)<input name="finalidade" placeholder="ex.: requerer aposentadoria por idade perante o INSS"></label>
    <label class="largo" data-para="contrato">Objeto do contrato *<textarea name="objeto" placeholder="ex.: requerimento administrativo de aposentadoria por idade perante o INSS e, se necessário, a respectiva ação judicial"></textarea></label>
    <label data-para="contrato">Honorários fixos (R$)<input name="valorFixo" type="number" min="0" step="0.01"></label>
    <label data-para="contrato">Forma de pagamento dos fixos<input name="formaPagamento" placeholder="ex.: em 3 parcelas mensais, vencendo a primeira em 10/12/2026"></label>
    <label data-para="contrato">Percentual (%)<input name="percentual" type="number" min="0" max="100" step="0.5"></label>
    <label data-para="contrato">Base do percentual<input name="basePercentual" value="sobre o proveito econômico obtido, incluídos os valores atrasados"></label>
    <label data-para="contrato">Comarca do foro<input name="foro" value="${esc(cidade)}"></label>
    <label class="chk" data-para="contrato"><input type="checkbox" name="testemunhas"> Incluir linhas para duas testemunhas</label>
    <label>Local e data<input name="local" value="${esc(cidade ? cidade + ", " + dataExtenso(hoje) + "." : dataExtenso(hoje) + ".")}"></label>
    <label class="chk"><input type="checkbox" name="marcaDagua" checked> Monograma JV clarinho ao fundo</label>
  </form>`, [{t:"Cancelar", v:null}, {t:"Continuar", cls:"btn-pri", acao: f => { const v = lerForm(f.querySelector("form")); if(!v.clienteId){ toast("Selecione o cliente.", true); return false; } v.profs = profs.filter(pf => v["prof_"+pf.id]).map(pf => pf.id); return v; }}]);
  // (os campos que não pertencem ao modelo escolhido ficam ocultos; ver ligação abaixo)
  if(!r1) return;
  const m = MODELOS_BASE[r1.tipo], t = montarTexto(r1.tipo, r1);
  const r2 = await modal(`Conferir: ${m.t}`, `${t.avisos.map(a => `<div class="aviso perigo"><span class="ponto"></span><span>${esc(a)}</span></div>`).join("")}
    ${t.faltas.length ? `<div class="aviso alerta"><span class="ponto"></span><span>Faltam dados na ficha (aparecem como ${LACUNA}): ${esc(t.faltas.join(", "))}. Complete a ficha e gere de novo, ou corrija no texto abaixo.</span></div>` : ""}
    <form class="campos" id="f-gd2"><label class="largo">Título<input name="titulo" value="${esc(m.titulo)}"></label>
    <label class="largo">Texto (um parágrafo por bloco; **negrito** e *itálico* funcionam)<textarea name="texto" class="texto-doc">${esc(t.paragrafos.join("\n\n"))}</textarea></label>
    <label class="largo">Local e data<input name="local" value="${esc(r1.local)}"></label>
    <div class="largo"><div class="sub">Assinaturas no fim do documento</div>${t.assinantes.map(a => `<div class="pill" style="margin:4px 6px 0 0">${esc(a.papel)}: ${esc(a.nome)}</div>`).join("")}</div>
    <label class="largo chk"><input type="checkbox" name="assinar" checked> Marcar para assinatura no gov.br</label></form>`,
    [{t:"Voltar", v:null}, {t:"Gerar PDF", cls:"btn-pri", acao: f => lerForm(f.querySelector("form"))}]);
  if(!r2) return;
  const cl = cliente(r1.clienteId);
  const paragrafos = r2.texto.split(/\n\s*\n/).map(s => s.replace(/\s*\n\s*/g, " ").trim()).filter(Boolean);
  let blob;
  try { blob = await gerarPDF({titulo:r2.titulo, paragrafos, local:r2.local, assinantes:t.assinantes, marcaDagua:r1.marcaDagua}); }
  catch(e){ console.error(e); toast("Não foi possível gerar o PDF.", true); return; }
  const buf = await blob.arrayBuffer(), cif = await cifrarBytes(CHAVE, buf), id = uid();
  await ARM.put("arquivos", id, {iv:cif.iv, ct:cif.ct});
  const nomeArq = `${m.t} - ${cl.nome} - ${fmtData(hojeStr()).replace(/\//g,"-")}.pdf`;
  DB.documentos.push({id, clienteId:cl.id, processoId:r1.processoId||"", nome:nomeArq, tipo:"application/pdf", tamanho:buf.byteLength, categoria:m.cat, data:hojeStr(), enviadoPor:USU.nome, gerado:true, modelo:r1.tipo});
  registrar("documento", `Documento gerado: ${m.t} · ${cl.nome}`);
  if(r2.assinar){
    DB.assinaturas.push({id:uid(), documentoId:id, clienteId:cl.id, processoId:r1.processoId||"", titulo:`${m.t} · ${cl.nome}`, status:"pendente", criado:new Date().toISOString(),
      signatarios:t.assinantes.filter(a => a.tipo!=="testemunha").map(a => ({nome:a.nome, papel:a.papel, tipo:a.tipo, assinou:false})), historico:[{ts:new Date().toISOString(), usuario:USU.nome, t:"Documento gerado e marcado para assinatura"}]});
    registrar("assinatura", `Marcado para assinatura: ${m.t} · ${cl.nome}`);
  }
  salvar();
  const r3 = await modal("Documento gerado", `<p><b>${esc(nomeArq)}</b> foi guardado, cifrado, na ficha de ${esc(cl.nome)}${r1.processoId?" e no processo":""}.</p>${r2.assinar?`<p class="sub">Ele aparece em Assinaturas como <b>pendente</b>. Abra lá para mandar ao cliente e acompanhar.</p>`:""}`,
    [{t:"Fechar", v:null}, ...(r2.assinar?[{t:"Ir para Assinaturas", v:"ass"}]:[]), ...(r1.tipo==="contrato"?[{t:"Lançar honorário no financeiro", v:"fin"}]:[]), {t:"Baixar PDF", cls:"btn-pri", v:"baixar"}]);
  if(r3==="baixar") salvarArquivo(nomeArq, blob, "application/pdf");
  if(r3==="fin"){ const fixo = cent(r1.valorFixo), pct = Number(r1.percentual)||0;
    const hon = await editarHonorario(null, {clienteId:cl.id, processoId:r1.processoId||"", servico:(r1.objeto||"").replace(/\.$/,""), tipo: fixo>0 ? "fixo" : "exito", valorTotal:fixo, percentual: pct||"", basePercentual:r1.basePercentual||"", contratoDocId:id});
    if(hon && fixo>0 && pct>0) await editarHonorario(null, {clienteId:cl.id, processoId:r1.processoId||"", servico:`${(r1.objeto||"").replace(/\.$/,"")} (êxito)`, tipo:"exito", valorTotal:0, percentual:pct, basePercentual:r1.basePercentual||"", contratoDocId:id});
    if(hon) toast("Honorário lançado no financeiro."); }
  if(r3==="ass") ir("assinaturas"); else rota();
}

document.addEventListener("change", e => { if(e.target.matches('#f-gd [name="tipo"]')) filtrarCamposModelo(); if(e.target.matches('#f-gd [name="clienteId"]')){ const s = document.querySelector('#f-gd [name="processoId"]'); s.innerHTML = opcoesProcessos("", e.target.value); } });
function filtrarCamposModelo(){ const f = document.querySelector("#f-gd"); if(!f) return; const t = f.querySelector('[name="tipo"]').value; f.querySelectorAll("[data-para]").forEach(el => el.style.display = el.dataset.para.split(" ").includes(t) ? "" : "none"); }
new MutationObserver(() => { const f = document.querySelector("#f-gd"); if(f && !f.dataset.ok){ f.dataset.ok = "1"; filtrarCamposModelo(); } }).observe(document.body, {childList:true});

const ST_ASS = {pendente:["Pendente","alerta"], aguardando:["Aguardando assinatura","alerta"], assinado:["Assinado","ok"], cancelado:["Cancelado",""]};
const URL_ASSINADOR = "https://assinador.iti.br/", URL_VALIDADOR = "https://validar.iti.gov.br/";
function pillAss(a){ const [t, cl] = ST_ASS[a.status]; return `<span class="pill ${cl}">${t}</span>${a.status==="assinado" && a.conferido ? ` <span class="pill ok">conferido</span>` : ""}`; }
function assDoDocumento(docId){ return DB.assinaturas.find(a => a.documentoId===docId && a.status!=="cancelado"); }
function mensagemWhats(a){
  const cl = cliente(a.clienteId), nome = (cl?.nome||"").split(" ")[0], doc = DB.documentos.find(d => d.id===a.documentoId);
  const prim = (USU.nome||"").split(" ")[0];
  return `Olá, ${nome}! Aqui é ${prim}, do escritório ${DB.escritorio.nome}.

Vou te mandar agora, aqui pelo WhatsApp, o PDF "${(doc?.nome||a.titulo).replace(/\.pdf$/i,"")}" para você assinar pelo gov.br. É gratuito e dá para fazer pelo celular:

1. Salve o PDF que vou enviar.
2. Abra o site ${URL_ASSINADOR} e entre com o seu CPF e a senha do gov.br.

4. Digite o código que chega no aplicativo gov.br (ou por SMS) e clique em Autorizar.
5. Baixe o arquivo assinado e me mande de volta aqui.

Importante: a conta gov.br precisa ser nível prata ou ouro. Se for bronze, dá para subir o nível pelo aplicativo gov.br (por exemplo, com reconhecimento facial ou pelo seu banco).

Qualquer dúvida, é só me chamar.`;
}

  <ol class="passos">

    <li><b>Quem assina.</b> Marque quem já assinou.<div>${a.signatarios.map((s, i) => `<label class="chk"><input type="checkbox" data-sig="${i}" ${s.assinou?"checked":""}> ${esc(s.nome)} <span class="sub">· ${esc(s.papel)}</span></label>`).join("")}</div>
      <div class="linha-add"><input id="as-novo-sig" placeholder="Acrescentar outra pessoa que assina"><button type="button" class="btn btn-sm" id="as-add-sig">Acrescentar</button></div></li>

      <textarea id="as-msg" class="texto-msg">${esc(a.mensagem || mensagemWhats(a))}</textarea>

   Regras: valores em centavos inteiros para não acumular erro;
   escritório e pessoal nunca se misturam (campo "ambito");

const CATS = {
  despesa:{escritorio:["Aluguel","Internet","Energia elétrica","Água","Telefone","Materiais de escritório","Sistemas e ferramentas","Marketing","Cursos e capacitações","Transporte","Anuidade OAB e taxas","Impostos","Custas adiantadas para clientes","Retiradas (pró-labore)","Outras despesas"],

};
const FORMAS = ["Pix","Dinheiro","Transferência","Boleto","Cartão de crédito","Cartão de débito","Outro"];
const COR_ENT = "#9E7424", COR_SAI = "#6E5BA0", COR_ANT = "#9C948B"; // validadas (dataviz): contraste e daltonismo
const ST_FIN = {pago:["Pago","ok"], parcial:["Parcialmente pago","alerta"], pendente:["Pendente",""], atrasado:["Atrasado","perigo"], apurar:["A apurar",""]};
const cent = v => { let t = String(v??"").trim().replace(/[R$\s]/g, ""); if(t.includes(",")) t = t.replace(/\./g, "").replace(",", "."); return Math.round((Number(t) || 0) * 100); }; // aceita "1.500,50" e "1500.5"
const centN = v => Math.round((Number(v) || 0) * 100);
const reais = c => fmtMoeda((c||0)/100);
const mesDe = d => (d||"").slice(0,7);
const nomeMes = ym => { const [y,m] = ym.split("-").map(Number); return `${MESES[m-1]} de ${y}`; };
const mesCurto = ym => { const [y,m] = ym.split("-").map(Number); return `${MESES_C[m-1]}/${String(y).slice(2)}`; };
function addMeses(ym, n){ let [y,m] = ym.split("-").map(Number); m += n; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return `${y}-${pad(m)}`; }
function diaNoMes(ym, dia){ const [y,m] = ym.split("-").map(Number); const ult = new Date(Date.UTC(y, m, 0)).getUTCDate(); return `${ym}-${pad(Math.min(Number(dia)||1, ult))}`; }
function pillFin(st){ const [t, c] = ST_FIN[st]; return `<span class="pill ${c}">${t}</span>`; }

function alterou(obj, antes, depois, oque){
  const vaz = v => v===undefined || v===null || v==="" || v===false;
  const mud = Object.keys(depois).filter(k => !(vaz(antes[k]) && vaz(depois[k])) && JSON.stringify(antes[k]) !== JSON.stringify(depois[k]) && !["alteracoes"].includes(k));
  if(!mud.length) return;
  (obj.alteracoes = obj.alteracoes || []).push({ts:new Date().toISOString(), usuario:USU.nome, campos:mud.map(k => `${k}: ${fmtCampo(k, antes[k])} → ${fmtCampo(k, depois[k])}`)});
  registrar("financeiro", `${oque} alterado (${mud.join(", ")})`);
}
function fmtCampo(k, v){ if(v===undefined||v===null||v==="") return "vazio"; if(/^(valor|valorTotal|saldoInicial)$/.test(k)) return reais(v); if(/^(vencimento|pagoEm|data|dataContratacao|dataInicial)$/.test(k)) return fmtData(v); if(k==="contaId") return conta(v)?.nome||v; if(k==="clienteId") return nomeCli(v); return String(v); }

const parcelasDe = hid => DB.parcelas.filter(p => p.honorarioId===hid).sort((a,b) => a.numero - b.numero);
const recebDaParcela = pid => DB.recebimentos.filter(r => r.parcelaId===pid);
function infoParcela(p, h_){
  const rec = recebDaParcela(p.id).reduce((s, r) => s + r.valor, 0), saldo = Math.max(0, p.valor - rec), hoje = h_ || hojeStr();
  const st = saldo === 0 ? "pago" : p.vencimento < hoje ? "atrasado" : rec > 0 ? "parcial" : "pendente";
  return {rec, saldo, st};
}
function infoHonorario(h){
  const ps = parcelasDe(h.id);
  if(h.tipo==="exito" && !ps.length) return {total:0, rec:0, saldo:0, vencido:0, st:"apurar", ps};
  let rec = 0, saldo = 0, vencido = 0; const hoje = hojeStr();
  ps.forEach(p => { const i = infoParcela(p, hoje); rec += i.rec; saldo += i.saldo; if(i.st==="atrasado") vencido += i.saldo; });
  const st = saldo === 0 && ps.length ? "pago" : vencido > 0 ? "atrasado" : rec > 0 ? "parcial" : "pendente";
  return {total:h.valorTotal||0, rec, saldo, vencido, st, ps};
}
function dividirParcelas(total, n, primeiro){
  const base = Math.floor(total / n), resto = total - base * n, out = [];
  for(let i=0;i<n;i++){ const ym = addMeses(mesDe(primeiro), i); out.push({numero:i+1, vencimento:diaNoMes(ym, primeiro.slice(8)), valor: base + (i===n-1 ? resto : 0)}); }
  return out;
}

/* ---------- saldos, movimentos e fluxo ---------- */
function movimentos(amb, opts){
  opts = opts || {}; const out = [];
  if(amb==="escritorio") DB.recebimentos.forEach(r => { const h = DB.honorarios.find(x => x.id===r.honorarioId), p = DB.parcelas.find(x => x.id===r.parcelaId), n = h ? parcelasDe(h.id).length : 0;
    out.push({data:r.data, ent:r.valor, sai:0, desc:`Honorários · ${nomeCli(r.clienteId)}${n>1&&p?` (${p.numero}/${n})`:""}`, cat:"Honorários", clienteId:r.clienteId, contaId:r.contaId, origem:"recebimento", ref:r.id}); });
  DB.receitas.filter(l => l.ambito===amb && l.pagoEm).forEach(l => out.push({data:l.pagoEm, ent:l.valor, sai:0, desc:l.descricao, cat:l.categoria, clienteId:l.clienteId, contaId:l.contaId, origem:"receita", ref:l.id}));
  DB.despesas.filter(l => l.ambito===amb && l.pagoEm).forEach(l => out.push({data:l.pagoEm, ent:0, sai:l.valor, desc:l.descricao, cat:l.categoria, contaId:l.contaId, origem:"despesa", ref:l.id}));
  if(opts.previstos){
    if(amb==="escritorio") DB.parcelas.forEach(p => { const i = infoParcela(p); if(i.saldo>0){ const h = DB.honorarios.find(x => x.id===p.honorarioId); out.push({data:p.vencimento, ent:i.saldo, sai:0, desc:`A receber · ${nomeCli(h?.clienteId)} (${p.numero}/${parcelasDe(p.honorarioId).length})`, cat:"Honorários", clienteId:h?.clienteId, previsto:true}); } });
    DB.receitas.filter(l => l.ambito===amb && !l.pagoEm).forEach(l => out.push({data:l.vencimento, ent:l.valor, sai:0, desc:`A receber · ${l.descricao}`, cat:l.categoria, previsto:true}));
    DB.despesas.filter(l => l.ambito===amb && !l.pagoEm).forEach(l => out.push({data:l.vencimento, ent:0, sai:l.valor, desc:`A pagar · ${l.descricao}`, cat:l.categoria, previsto:true}));
  }
  return out.sort((a,b) => a.data.localeCompare(b.data) || (b.ent - a.ent));
}
function contaConta(m){ const c = conta(m.contaId); return !c || m.data >= (c.dataInicial||"0000"); }
function saldoAte(amb, dataLimite){ // saldo ao fim do dia dataLimite (inclusive)
  const ini = contasDe(amb).reduce((s,c) => s + (c.saldoInicial||0), 0);
  return ini + movimentos(amb).filter(m => contaConta(m) && m.data <= dataLimite).reduce((s,m) => s + m.ent - m.sai, 0);
}
function saldoConta(c){ return (c.saldoInicial||0) + movimentos(c.ambito).filter(m => m.contaId===c.id && m.data >= (c.dataInicial||"0000")).reduce((s,m) => s + m.ent - m.sai, 0); }
function resumoMes(amb, ym){
  const mv = movimentos(amb).filter(m => mesDe(m.data)===ym);
  const ent = mv.reduce((s,m) => s+m.ent, 0), sai = mv.reduce((s,m) => s+m.sai, 0);
  const despMes = DB.despesas.filter(l => l.ambito===amb && mesDe(l.vencimento)===ym);
  return {ent, sai, res:ent - sai, despPrev:despMes.reduce((s,l) => s+l.valor, 0), despAberto:despMes.filter(l => !l.pagoEm).reduce((s,l) => s+l.valor, 0)};
}
