/* =========================================================
   PUBLICAÇÃO OFICIAL — Instagram API com login do Instagram
   (graph.instagram.com) + hospedagem das imagens (Cloudinary,
   upload sem assinatura). Só publica o que tem aprovação
   expressa e cuja arte/legenda não mudou desde a aprovação.
   ========================================================= */
const CC_IG_BASE = "https://graph.instagram.com/v22.0/";
async function ccIGReq(metodo, caminho, params, token){
  const p = Object.assign({}, params, {access_token: token}); let r;
  if(metodo==="GET"){ const u = new URL(CC_IG_BASE + caminho); Object.entries(p).forEach(([k, v]) => u.searchParams.set(k, v)); r = await fetch(u); }
  else r = await fetch(CC_IG_BASE + caminho, {method:"POST", body:new URLSearchParams(p)});
  const j = await r.json().catch(() => ({})); if(!r.ok || j.error) throw new Error(j.error?.error_user_msg || j.error?.message || ("HTTP " + r.status)); return j;
}
function ccPubCfg(){ const c = ccCfg(); return {token:c.ig.token, userId:c.ig.userId, cloud:(c.feed.cloud||"").trim(), preset:(c.feed.preset||"").trim(), ativo:!!c.feed.pubAuto, atrasoMaxH:c.feed.atrasoMaxH||6}; }
function ccPubPronto(cfg){ return !!(cfg && cfg.ativo && cfg.token && cfg.userId && cfg.cloud && cfg.preset); }
async function ccCloudEnviar(blob, cfg, nome){
  const fd = new FormData(); fd.append("file", blob, nome); fd.append("upload_preset", cfg.preset); fd.append("folder", "instagram-feed");
  const r = await fetch(`https://api.cloudinary.com/v1_1/${encodeURIComponent(cfg.cloud)}/image/upload`, {method:"POST", body:fd});
  const j = await r.json().catch(() => ({})); if(!r.ok || j.error || !j.secure_url) throw new Error("Hospedagem de imagens: " + (j.error?.message || ("HTTP " + r.status))); return j.secure_url;
}
async function ccPubPreparar(i){
  const cfg = ccPubCfg(); if(!cfg.cloud || !cfg.preset) throw new Error("Hospedagem de imagens não configurada.");
  const h = ccFeedAssinatura(i); if(i.pub?.urls && i.pub.urlsHash===h) return i.pub.urls;
  await ccFontes(); const urls = [];
  for(let n=0;n<Math.min(10, i.slides.length);n++){ urls.push(await ccCloudEnviar(await ccSlideBlob(i, n, "jpg"), cfg, `${i.dataPrevista||"post"}-${ccSlug(i.titulo)}-${n+1}.jpg`)); }
  i.pub = Object.assign({}, i.pub, {urls, urlsHash:h, preparadoEm:new Date().toISOString(), erroPrep:null}); salvar(); return urls;
}
function ccPubPrepararFundo(i){ if(!i.design || !ccPubPronto(ccPubCfg())) return; ccPubPreparar(i).catch(e => { i.pub = Object.assign({}, i.pub, {erroPrep:e.message, prepTentativa:new Date().toISOString()}); salvar(); }); }
async function ccPubEnviarIG(job, cfg){
  let criacao;
  if(job.urls.length===1) criacao = (await ccIGReq("POST", `${cfg.userId}/media`, {image_url:job.urls[0], caption:job.legenda}, cfg.token)).id;
  else { const filhos = []; for(const u of job.urls) filhos.push((await ccIGReq("POST", `${cfg.userId}/media`, {image_url:u, is_carousel_item:"true"}, cfg.token)).id);
    criacao = (await ccIGReq("POST", `${cfg.userId}/media`, {media_type:"CAROUSEL", children:filhos.join(","), caption:job.legenda}, cfg.token)).id; }
  for(let t=0;t<30;t++){ const st = await ccIGReq("GET", criacao, {fields:"status_code"}, cfg.token); if(st.status_code==="FINISHED") break; if(["ERROR","EXPIRED"].includes(st.status_code)) throw new Error(`O Instagram recusou a mídia (${st.status_code}).`); if(t===29) throw new Error("O Instagram não terminou de processar a mídia a tempo."); await new Promise(r => setTimeout(r, 3000)); }
  const pub = await ccIGReq("POST", `${cfg.userId}/media_publish`, {creation_id:criacao}, cfg.token);
  const conf = await ccIGReq("GET", pub.id, {fields:"id,permalink,timestamp"}, cfg.token);
  if(!conf.id || !conf.permalink) throw new Error("O Instagram não confirmou a publicação; ela não foi registrada como publicada.");
  return {mediaId:conf.id, permalink:conf.permalink, timestamp:conf.timestamp};
}
async function ccPublicarItemAPI(i){
  if(!["agendado","aprovado"].includes(i.status) || !i.aprovacao) throw new Error("Sem aprovação expressa: nada foi publicado.");
  if(!i.design) throw new Error("Publicação no visual antigo: use a publicação manual.");
  if(i.aprovacao.hash !== ccFeedAssinatura(i)){ i.aprovacao = null; ccMudarStatus(i, "aprovacao", "Conteúdo diferente do aprovado: voltou para aprovação"); salvar(); throw new Error("A arte ou a legenda mudou depois da aprovação. Aprove de novo."); }
  const cfg = ccPubCfg(); if(!cfg.token || !cfg.userId) throw new Error("Instagram não conectado.");
  i.pub = Object.assign({}, i.pub, {status:"publicando", inicio:new Date().toISOString()}); salvar();
  try{ const urls = await ccPubPreparar(i); const r = await ccPubEnviarIG({urls, legenda:ccFeedLegendaCompleta(i)}, cfg); ccPubSucesso(i, r); }
  catch(e){ i.pub = Object.assign({}, i.pub, {status:"erro", erro:e.message, tentativas:(i.pub?.tentativas||0)+1, ultimaTentativa:new Date().toISOString()}); registrar("conteúdo", `Falha ao publicar "${i.titulo}": ${e.message}`); salvar(); throw e; }
}
function ccPubSucesso(i, r){
  i.pub = Object.assign({}, i.pub, {status:"publicado", fonte:"api", mediaId:r.mediaId, permalink:r.permalink, confirmadoEm:new Date().toISOString(), erro:null});
  i.link = r.permalink; i.publicadoEm = r.timestamp ? new Date(r.timestamp).toLocaleDateString("sv-SE") : hojeStr();
  ccMudarStatus(i, "publicado", `Publicado pela API oficial e confirmado pelo Instagram: ${r.permalink}`); ccConcluirTarefas(i, "publicar"); salvar();
}

/* ---------- Agenda: roda a cada minuto enquanto o sistema estiver aberto ---------- */
let CC_PUB_RODANDO = false, CC_AGENDA_MEM = null, CC_AGENDA_RES = [];
function ccAgendaCongelar(){ // chamado ao bloquear: guarda só o necessário, em memória
  try{
    CC_AGENDA_MEM = null; if(!DB || !DB.conteudo) return; const cfg = ccPubCfg(); if(!ccPubPronto(cfg)) return;
    const jobs = ccFeedItens().filter(i => i.status==="agendado" && i.design && i.aprovacao && i.aprovacao.hash===ccFeedAssinatura(i) && i.pub?.urls && i.pub.urlsHash===ccFeedAssinatura(i) && !["publicando","publicado"].includes(i.pub?.status))
      .map(i => ({id:i.id, quando:atQuando(i).getTime(), urls:i.pub.urls.slice(), legenda:ccFeedLegendaCompleta(i), titulo:i.titulo, feito:false}));
    if(jobs.length) CC_AGENDA_MEM = {cfg:Object.assign({}, cfg), jobs};
  }catch(e){}
}
function ccPubAoEntrar(){
  if(CC_AGENDA_RES.length && DB?.conteudo){ CC_AGENDA_RES.forEach(r => { const i = ccItem(r.id); if(!i) return;
      if(r.ok) ccPubSucesso(i, r.res); else i.pub = Object.assign({}, i.pub, {status:"erro", erro:r.erro, tentativas:(i.pub?.tentativas||0)+1, ultimaTentativa:new Date().toISOString()}); });
    const n = CC_AGENDA_RES.filter(r => r.ok).length, f = CC_AGENDA_RES.length - n; CC_AGENDA_RES = []; salvar(); setTimeout(() => toast(`Enquanto o sistema estava bloqueado: ${n} publicação(ões) confirmada(s) pelo Instagram${f?`, ${f} com falha`:""}.`), 800); }
  CC_AGENDA_MEM = null; setTimeout(ccPubTique, 4000);
}
async function ccPubTique(){
  if(CC_PUB_RODANDO) return; CC_PUB_RODANDO = true;
  try{
    const agora = Date.now();
    if(DB && DB.conteudo && DB.conteudo.config && DB.conteudo.config.feed){
      const cfg = ccPubCfg(); if(!ccPubPronto(cfg)) return; const maxAtraso = cfg.atrasoMaxH * 3600000;
      for(const i of ccFeedItens().filter(x => x.status==="agendado" && x.design && x.dataPrevista && atQuando(x).getTime() <= agora && x.pub?.status!=="publicando")){
        if(agora - atQuando(i).getTime() > maxAtraso){ if(i.pub?.status!=="atrasado"){ i.pub = Object.assign({}, i.pub, {status:"atrasado"}); registrar("conteúdo", `Horário perdido: ${i.titulo}`); salvar(); } continue; }
        if(i.pub?.status==="atrasado") continue;
        if(i.pub?.status==="erro" && ((i.pub.tentativas||0) >= 3 || agora - new Date(i.pub.ultimaTentativa||0).getTime() < 10*60000)) continue;
        try{ await ccPublicarItemAPI(i); toast(`Publicado e confirmado pelo Instagram: ${i.titulo}`); }catch(e){ toast(`Falha ao publicar “${i.titulo}”: ${e.message}`, true); }
        ccRerenderSeguro(); break;
      }
      const prox = ccFeedItens().find(i => i.status==="agendado" && i.design && i.aprovacao && !(i.pub?.urls && i.pub.urlsHash===ccFeedAssinatura(i)) && atQuando(i).getTime() - agora < 48*3600000 && !(i.pub?.erroPrep && agora - new Date(i.pub.prepTentativa||0).getTime() < 30*60000));
      if(prox){ prox.pub = Object.assign({}, prox.pub, {prepTentativa:new Date().toISOString()}); try{ await ccPubPreparar(prox); }catch(e){ prox.pub.erroPrep = e.message; salvar(); } }
    } else if(CC_AGENDA_MEM){
      const cfg = CC_AGENDA_MEM.cfg, maxAtraso = (cfg.atrasoMaxH||6) * 3600000;
      const job = CC_AGENDA_MEM.jobs.find(j => !j.feito && j.quando <= agora && agora - j.quando <= maxAtraso);
      if(job){ job.feito = true; try{ CC_AGENDA_RES.push({id:job.id, ok:true, res: await ccPubEnviarIG(job, cfg)}); }catch(e){ CC_AGENDA_RES.push({id:job.id, ok:false, erro:e.message}); } }
    }
  } finally { CC_PUB_RODANDO = false; }
}
setInterval(ccPubTique, 60000);

/* =========================================================
   AGENDAMENTO PELO META BUSINESS SUITE (quando a API não está
   disponível): redistribui os aprovados (1 ou 2 por dia),
   envia as artes para a hospedagem e baixa um pacote com
   links, legendas, datas e horários para agendar no Planner.
   ========================================================= */
async function ccFeedPacoteAgendamento(opc){
  const l = ccFeedItens().filter(i => ["agendado","aprovado"].includes(i.status) && i.aprovacao && i.design).sort((a,b) => atQuando(a) - atQuando(b));
  if(!l.length){ toast("Nenhuma publicação aprovada para agendar.", true); return; }
  const cfg = ccPubCfg(); if(!cfg.cloud || !cfg.preset){ toast("Configure a hospedagem de imagens (Cloudinary) em Integrações.", true); return; }
  const horas = opc.porDia===2 ? [opc.h1, opc.h2] : [opc.h1]; let d = opc.inicio, k = 0;
  if(opc.redistribuir){ l.forEach(i => { const de = atDH(i); i.dataPrevista = d; i.hora = horas[k]; i.historico.push({ts:new Date().toISOString(), de:i.status, para:i.status, obs:`Redistribuído (${opc.porDia} por dia): ${de} → ${atDH(i)}`, usuario:USU?.nome||""}); k++; if(k >= horas.length){ k = 0; d = addDias(d, 1); } }); }
  const pacote = []; let n = 0;
  for(const i of l){ n++; toast(`Enviando artes ${n} de ${l.length}…`);
    try{ const urls = await ccPubPreparar(i); i.pub = Object.assign({}, i.pub, {modo:"metabs"});
      pacote.push({id:i.id, data:i.dataPrevista, hora:i.hora, tipo:i.tipo, titulo:i.titulo, imagens:urls, legenda:ccFeedLegendaCompleta(i)}); }
    catch(e){ toast(`Falha ao enviar “${i.titulo}”: ${e.message}`, true); return; } }
  registrar("conteúdo", `Pacote de agendamento gerado: ${pacote.length} publicação(ões)`); salvar();
  salvarArquivo(`agendamento-instagram-${hojeStr()}.json`, new Blob([JSON.stringify({gerado:new Date().toISOString(), conta:ccCfg().arroba, publicacoes:pacote}, null, 1)], {type:"application/json"}), "application/json");
  toast(`Pacote pronto: ${pacote.length} publicação(ões). Salvo na pasta Downloads.`); ccRerender();
}

}

/* =========================================================
   INTELIGÊNCIA ARTIFICIAL — assistente com documentos
   Usa a IA da plataforma Claude (sem chave de API no código).
   Apoio administrativo e informativo: sem parecer jurídico.
   ========================================================= */
const IA_SISTEMA = `Você é a assistente de apoio administrativo e documental de Jéssica Valiente, correspondente jurídica (Dom Pedrito/RS) que NÃO é advogada e não tem inscrição na OAB como advogada.
Regras obrigatórias:
- Ajude com organização, resumos, extração de dados, checklists, tabelas, roteiros, relatórios administrativos e informações gerais sobre Direito Previdenciário e de Família.
- Não emita parecer, estratégia processual ou orientação jurídica individualizada; quando o pedido exigir isso, diga que deve ser encaminhado a advogado(a) inscrito(a) na OAB.
- Não invente leis, números de processo, julgados, índices ou valores. Se não tiver certeza, diga que é preciso conferir em fonte oficial e indique qual (Planalto, gov.br/inss, STF, STJ, TRF4, TJRS, TNU).
- Não faça diagnósticos médicos: apenas organize o que está escrito nos documentos.
- Responda em português do Brasil, de forma clara, em blocos curtos e com tópicos.`;
const IA_TAREFAS = [
  ["Resumir", "Resuma o(s) documento(s) anexado(s) em tópicos curtos: do que se trata, datas, pessoas, valores e pontos de atenção."],
  ["Extrair dados", "Extraia os dados do documento em uma tabela (campo | valor): nomes, CPF/NB se houver, datas, valores, órgãos, números de protocolo ou processo."],
  ["Faltando o quê?", "Liste as informações e documentos que parecem estar faltando para organizar este caso administrativamente, em forma de checklist."],
  ["Checklist", "Crie um checklist prático de documentos e próximos passos administrativos para este assunto."],
  ["Tabela", "Converta as informações em uma tabela organizada."],
  ["Resumir decisão", "Resuma a decisão judicial anexada: tribunal, número, data, relator, pedido, o que foi decidido e fundamentos citados (sem opinar sobre o caso)."],
  ["Comparar", "Compare os documentos anexados e aponte diferenças e informações divergentes (datas, valores, nomes)."],
  ["Relatório", "Gere um relatório administrativo informativo com os dados apresentados, deixando claro que não é parecer jurídico."]
];
let IA_ESTADO = {anexos:[], enviando:false, ctrl:null};
function iaDB(){ if(!DB.ia) DB.ia = {conversas:[], atual:null}; return DB.ia; }
function iaConversa(){ const d = iaDB(); let c = d.conversas.find(x => x.id===d.atual); if(!c){ c = {id:uid(), titulo:"Nova conversa", criado:new Date().toISOString(), msgs:[]}; d.conversas.unshift(c); d.atual = c.id; } return c; }
async function iaLerArquivo(f){
  const nome = f.name, tipo = f.type || "";
  if(/pdf$/i.test(nome) || tipo==="application/pdf"){
    try{
      if(!window.pdfjsLib){ await new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }
      const pdf = await window.pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise; let t = "";
      for(let p=1;p<=Math.min(pdf.numPages, 60);p++){ const pg = await pdf.getPage(p); const tc = await pg.getTextContent(); t += `\n[página ${p}]\n` + tc.items.map(i => i.str).join(" "); }
      if(t.replace(/\s|\[página \d+\]/g,"").length < 40) return {nome, texto:"", aviso:"PDF sem texto (provavelmente digitalizado como imagem). Envie fotos das páginas para a IA ler as imagens."};
      return {nome, texto:t.slice(0, 120000), paginas:pdf.numPages};
    }catch(e){ return {nome, texto:"", aviso:"Não foi possível ler este PDF."}; }
  }
  if(/^image\//.test(tipo)) return {nome, imagem:f};
  if(/\.docx$/i.test(nome)){ try{ if(!window.mammoth){ await new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); }); }
    const r = await window.mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()}); return {nome, texto:r.value.slice(0, 120000)}; }catch(e){ return {nome, texto:"", aviso:"Não foi possível ler este .docx."}; } }
  return {nome, texto:(await f.text()).slice(0, 120000)};
}
function iaMd(t){ // markdown simples e seguro
  let h = esc(t);
  h = h.replace(/^### (.*)$/gm, "<h4>$1</h4>").replace(/^## (.*)$/gm, "<h3>$1</h3>").replace(/^# (.*)$/gm, "<h3>$1</h3>");
  h = h.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|\n)[-•] (.*)/g, "$1• $2");
  h = h.replace(/((?:^\|.*\|\s*$\n?)+)/gm, blk => { const ls = blk.trim().split("\n").filter(l => !/^\|\s*-+/.test(l)); return `<div class="tabela-wrap"><table>${ls.map((l, i) => `<tr>${l.replace(/^\||\|$/g,"").split("|").map(c => i ? `<td>${c.trim()}</td>` : `<th>${c.trim()}</th>`).join("")}</tr>`).join("")}</table></div>`; });
  return h.replace(/\n/g, "<br>");
}
async function telaIA(c){
  const sample = await window.claude?.use?.("sample").catch(() => null);
  const d = iaDB(), conv = iaConversa();
  c.innerHTML = `<div class="cab"><div><h1 class="tit">Inteligência artificial</h1><div class="fio"></div><div class="sub">Assistente para resumos, extração de dados, checklists, tabelas e relatórios administrativos · apoio, não parecer jurídico</div></div>
    <div class="acoes"><button class="btn" id="ia-nova">Nova conversa</button></div></div>
  ${sample ? "" : `<div class="aviso alerta" style="cursor:default"><span class="ponto"></span><span>A IA funciona na versão online do painel (dentro do Claude). Neste arquivo local ela não está disponível.</span></div>`}
  <div class="ia-wrap"><div class="ia-lado cartao"><h3>Conversas</h3>${d.conversas.slice(0, 30).map(x => `<div class="ia-conv ${x.id===conv.id?"ativo":""}" data-cv="${x.id}"><span>${esc(x.titulo)}</span><button class="btn-link" data-rmcv="${x.id}" title="Excluir">×</button></div>`).join("")}</div>
    <div class="ia-main cartao"><div class="ia-msgs" id="ia-msgs">${conv.msgs.length ? conv.msgs.map(m => `<div class="ia-msg ${m.role}"><div class="ia-quem">${m.role==="user"?"Você":"Assistente"}</div><div>${m.role==="user" ? esc(m.content).replace(/\n/g,"<br>") : iaMd(m.content)}</div>${m.anexos?.length?`<div class="sub">📎 ${m.anexos.map(esc).join(", ")}</div>`:""}${m.role==="assistant"?`<div class="ia-acoes"><button class="btn-link" data-cp="${conv.msgs.indexOf(m)}">copiar</button><button class="btn-link" data-bx="${conv.msgs.indexOf(m)}">baixar .txt</button></div>`:""}</div>`).join("") : `<div class="vazio">Anexe documentos (PDF, Word, texto ou fotos) e escolha uma tarefa, ou escreva o que precisa.</div>`}</div>
      <div class="cc-chips" style="margin:8px 0">${IA_TAREFAS.map(([t], n) => `<button class="cc-chip" data-tf="${n}">${esc(t)}</button>`).join("")}</div>
      <div id="ia-anexos" class="sub">${IA_ESTADO.anexos.map((a, n) => `<span class="pill">📎 ${esc(a.nome)}${a.aviso?" ⚠":""} <button class="btn-link" data-rman="${n}">×</button></span>`).join(" ")}</div>
      <form id="ia-f" class="ia-form"><textarea id="ia-txt" placeholder="Escreva aqui… (Enter envia, Shift+Enter quebra linha)"></textarea>
        <div class="barra-acoes" style="margin:6px 0 0"><label class="btn btn-sm">📎 Anexar<input type="file" id="ia-up" multiple accept=".pdf,.txt,.docx,.csv,.md,image/*" hidden></label><button class="btn btn-pri" id="ia-env" ${sample?"":"disabled"}>Enviar</button><button type="button" class="btn btn-sm hidden" id="ia-parar">Parar</button></div></form>
      <p class="sub" style="margin:6px 0 0">Os textos dos documentos anexados são enviados à IA do Claude para processar o seu pedido. Evite anexar dados sensíveis de clientes sem necessidade. A IA pode errar: confira em fonte oficial.</p></div></div>`;
  const box = $("#ia-msgs"); box.scrollTop = box.scrollHeight;
  $("#ia-nova").onclick = () => { d.atual = null; iaConversa(); salvar(); telaIA(c); };
  c.querySelectorAll("[data-cv]").forEach(x => x.onclick = e => { if(e.target.closest("[data-rmcv]")) return; d.atual = x.dataset.cv; telaIA(c); });
  c.querySelectorAll("[data-rmcv]").forEach(b => b.onclick = async () => { if(!(await confirmar("Excluir conversa", "Excluir esta conversa?", "Excluir", true))) return; d.conversas = d.conversas.filter(x => x.id!==b.dataset.rmcv); if(d.atual===b.dataset.rmcv) d.atual = null; salvar(); telaIA(c); });
  c.querySelectorAll("[data-rman]").forEach(b => b.onclick = () => { IA_ESTADO.anexos.splice(+b.dataset.rman, 1); telaIA(c); });
  c.querySelectorAll("[data-cp]").forEach(b => b.onclick = () => navigator.clipboard?.writeText(conv.msgs[+b.dataset.cp].content).then(() => toast("Copiado."), () => toast("Não foi possível copiar.", true)));
  c.querySelectorAll("[data-bx]").forEach(b => b.onclick = () => salvarArquivo(`ia-${hojeStr()}.txt`, conv.msgs[+b.dataset.bx].content, "text/plain"));
  $("#ia-up").onchange = async e => { for(const f of e.target.files){ const a = await iaLerArquivo(f); IA_ESTADO.anexos.push(a); if(a.aviso) toast(a.nome + ": " + a.aviso, true); } telaIA(c); };
  c.querySelectorAll("[data-tf]").forEach(b => b.onclick = () => { $("#ia-txt").value = IA_TAREFAS[+b.dataset.tf][1]; $("#ia-txt").focus(); });
  $("#ia-txt").onkeydown = e => { if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); $("#ia-f").requestSubmit(); } };
  $("#ia-parar").onclick = () => IA_ESTADO.ctrl?.abort();
  $("#ia-f").onsubmit = async e => {
    e.preventDefault(); if(!sample || IA_ESTADO.enviando) return; const txt = $("#ia-txt").value.trim(); if(!txt && !IA_ESTADO.anexos.length) return;
    const anx = IA_ESTADO.anexos.splice(0); const docs = anx.filter(a => a.texto).map(a => `--- DOCUMENTO: ${a.nome} ---\n${a.texto}`).join("\n\n");
    const imgs = anx.filter(a => a.imagem).map(a => a.imagem);
    const pedido = (txt || "Analise os documentos anexados.") + (docs ? `\n\n${docs}` : "");
    conv.msgs.push({role:"user", content:txt || "(documentos anexados)", anexos:anx.map(a => a.nome), contexto: docs ? docs.slice(0, 60000) : undefined});
    if(conv.titulo==="Nova conversa") conv.titulo = (txt || anx[0]?.nome || "Conversa").slice(0, 60);
    const hist = conv.msgs.slice(-12, -1).map(m => ({role:m.role, content: m.role==="user" && m.contexto ? m.content + "\n\n" + m.contexto : m.content}));
    const msgs = [{role:"user", content:IA_SISTEMA + "\n\nEntendido? Responda apenas 'Entendido.'"}, {role:"assistant", content:"Entendido."}, ...hist, {role:"user", content:pedido}];
    const resp = {role:"assistant", content:""}; conv.msgs.push(resp); IA_ESTADO.enviando = true; IA_ESTADO.ctrl = new AbortController(); telaIA(c);
    const alvo = () => $("#ia-msgs")?.lastElementChild?.querySelector("div:nth-child(2)");
    $("#ia-parar")?.classList.remove("hidden");
    try{
      const lim = imgs.length ? await sample.limits?.().catch(() => ({})) : {};
      const r = await sample(msgs, {signal:IA_ESTADO.ctrl.signal, cache:false, modelTier: docs.length > 20000 ? "complex" : "default", ...(imgs.length && lim?.images ? {images:imgs} : {}),
        onText: ({text}) => { resp.content = text; const el = alvo(); if(el) el.innerHTML = iaMd(text); }});
      resp.content = r.text || resp.content; if(imgs.length && !lim?.images) resp.content = "⚠ As imagens não puderam ser enviadas nesta conta.\n\n" + resp.content;
    }catch(err){ resp.content = resp.content || (err?.code==="rate_limited" ? "Muitas solicitações seguidas. Aguarde um pouco e tente de novo." : err?.code==="not_granted" ? "A IA não foi autorizada para este painel." : "Não foi possível obter resposta: " + (err?.message || "erro")); }
    IA_ESTADO.enviando = false; salvar(); if(CC_SUB !== undefined && location.hash.startsWith("#ia")) telaIA(c);
  };
}


iniciar();
</script>
