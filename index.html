/* ---------- gráficos (SVG, com dica ao passar o mouse e tabela) ---------- */
function graficoBarras(meses, series, opts){
  // meses: ["2026-01",...]; series: [{nome, cor, valores:[centavos]}]
  const W = 720, H = 230, ml = 64, mr = 12, mt = 14, mb = 30, lw = W - ml - mr, lh = H - mt - mb;
  const max = Math.max(1, ...series.flatMap(s => s.valores));
  const passo = escalaPasso(max / 100), topo = Math.ceil(max / 100 / passo) * passo * 100;
  const gw = lw / meses.length, bw = Math.max(4, Math.min(18, (gw - 10) / series.length - 2));
  const y = v => mt + lh - (v / topo) * lh;
  let svg = `<svg viewBox="0 0 ${W} ${H}" class="graf" role="img" aria-label="${esc(opts.titulo)}">`;
  for(let t = 0; t <= topo; t += passo*100){ svg += `<line x1="${ml}" x2="${W-mr}" y1="${y(t)}" y2="${y(t)}" class="grade"/><text x="${ml-6}" y="${y(t)+4}" text-anchor="end" class="eixo">${abrev(t)}</text>`; }
  meses.forEach((m, i) => {
    const gx = ml + i * gw, cx = gx + gw/2, tot = series.length * (bw + 2) - 2;
    series.forEach((s, j) => { const v = s.valores[i], x = cx - tot/2 + j*(bw+2), yy = y(v), h_ = Math.max(0, mt + lh - yy);
      if(h_ > 0) svg += `<path d="M${x},${mt+lh} V${yy+Math.min(4,h_)} q0,-4 4,-4 h${bw-8} q4,0 4,4 V${mt+lh} Z" fill="${s.cor}"/>`; });
    svg += `<text x="${cx}" y="${H-10}" text-anchor="middle" class="eixo">${esc(opts.rotulo ? opts.rotulo(m) : mesCurto(m))}</text>`;
    svg += `<rect x="${gx}" y="${mt}" width="${gw}" height="${lh}" fill="transparent" class="alvo" data-dica="${esc(`<b>${opts.rotulo ? opts.rotulo(m) : nomeMes(m)}</b>` + series.map(s => `<div><i style="background:${s.cor}"></i>${s.nome}: ${reais(s.valores[i])}</div>`).join("") + (opts.extra ? opts.extra(i) : ""))}"/>`;
  });
  svg += `<line x1="${ml}" x2="${W-mr}" y1="${mt+lh}" y2="${mt+lh}" class="base"/></svg>`;
  return `<div class="graf-caixa">${legenda(series)}${svg}<div class="dica" hidden></div></div>`;
}
function graficoLinhas(rotulos, series, opts){
  const W = 720, H = 230, ml = 64, mr = 12, mt = 14, mb = 30, lw = W - ml - mr, lh = H - mt - mb;
  const todos = series.flatMap(s => s.valores.filter(v => v!==null));
  const mx = Math.max(0, ...todos), mn = Math.min(0, ...todos), passo = escalaPasso(Math.max(1, (mx - mn)) / 100);
  const topo = Math.ceil(mx / 100 / passo) * passo * 100, fundo = Math.floor(mn / 100 / passo) * passo * 100, faixa = Math.max(1, topo - fundo);
  const y = v => mt + lh - ((v - fundo) / faixa) * lh, x = i => ml + (rotulos.length===1 ? lw/2 : i * lw / (rotulos.length - 1));
  let svg = `<svg viewBox="0 0 ${W} ${H}" class="graf" role="img" aria-label="${esc(opts.titulo)}">`;
  for(let t = fundo; t <= topo; t += passo*100){ svg += `<line x1="${ml}" x2="${W-mr}" y1="${y(t)}" y2="${y(t)}" class="${t===0?"base":"grade"}"/><text x="${ml-6}" y="${y(t)+4}" text-anchor="end" class="eixo">${abrev(t)}</text>`; }
  series.forEach(s => { const pts = s.valores.map((v, i) => v===null ? null : [x(i), y(v)]).filter(Boolean);
    if(pts.length) svg += `<polyline points="${pts.map(p => p.join(",")).join(" ")}" fill="none" stroke="${s.cor}" stroke-width="2" ${s.tracejado?'stroke-dasharray="5 4"':""}/>` + pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${s.cor}" stroke="#fff" stroke-width="2"/>`).join(""); });
  rotulos.forEach((r, i) => { svg += `<text x="${x(i)}" y="${H-10}" text-anchor="middle" class="eixo">${esc(r)}</text>`;
    svg += `<rect x="${x(i) - lw/rotulos.length/2}" y="${mt}" width="${lw/rotulos.length}" height="${lh}" fill="transparent" class="alvo" data-dica="${esc(`<b>${r}</b>` + series.map(s => `<div><i style="background:${s.cor}"></i>${s.nome}: ${s.valores[i]===null?"—":reais(s.valores[i])}</div>`).join(""))}"/>`; });
  svg += `</svg>`;
  return `<div class="graf-caixa">${legenda(series)}${svg}<div class="dica" hidden></div></div>`;
}
function legenda(series){ return `<div class="legenda">${series.map(s => `<span><i style="background:${s.cor}"></i>${esc(s.nome)}</span>`).join("")}</div>`; }
function escalaPasso(maxReais){ const bruto = maxReais / 4, p10 = Math.pow(10, Math.floor(Math.log10(Math.max(1, bruto)))); return [1,2,2.5,5,10].map(k => k*p10).find(v => v >= bruto) || p10*10; }
function abrev(c){ const v = c/100, a = Math.abs(v); return a >= 1e6 ? `R$ ${(v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1})} mi` : a >= 1e3 ? `R$ ${(v/1e3).toLocaleString("pt-BR",{maximumFractionDigits:1})} mil` : `R$ ${v.toLocaleString("pt-BR",{maximumFractionDigits:0})}`; }
function ligarDicas(raiz){
  raiz.querySelectorAll(".graf-caixa").forEach(cx => { const d = cx.querySelector(".dica");
    cx.querySelectorAll(".alvo").forEach(a => { a.addEventListener("mousemove", ev => { d.innerHTML = a.dataset.dica; d.hidden = false; const r = cx.getBoundingClientRect(); let lx = ev.clientX - r.left + 14; if(lx > r.width - 190) lx = ev.clientX - r.left - 200; d.style.left = lx + "px"; d.style.top = (ev.clientY - r.top - 10) + "px"; a.classList.add("on"); });
      a.addEventListener("mouseleave", () => { d.hidden = true; a.classList.remove("on"); }); }); });
}

function chaveGrupo(d, g){ if(g==="diario") return d; if(g==="mensal") return d.slice(0,7); if(g==="anual") return d.slice(0,4); const dw = diaSemana(d); return addDias(d, -((dw+6)%7)); }
function rotGrupo(k, g){ if(g==="diario") return fmtData(k); if(g==="mensal") return nomeMes(k); if(g==="anual") return k; return `Semana de ${fmtData(k)} a ${fmtData(addDias(k,6))}`; }
function dadosFluxo(amb, de, ate, prev){
  const todos = movimentos(amb, {previstos:prev}).filter(m => !m.previsto || m.data >= hojeStr() || prev);
  const saldoIni = saldoAte(amb, addDias(de, -1));
  const mv = todos.filter(m => m.data >= de && m.data <= ate);
  let saldo = saldoIni; mv.forEach(m => { if(contaConta(m) || m.previsto){ saldo += m.ent - m.sai; } m.saldo = saldo; });
  return {saldoIni, mv, saldoFim:saldo};
}

function abaFinanceiroCliente(corpo, id){
  const hs = DB.honorarios.filter(h => h.clienteId===id).sort((a,b) => (b.dataContratacao||"").localeCompare(a.dataContratacao||""));
  const recs = DB.recebimentos.filter(r => r.clienteId===id).sort((a,b) => b.data.localeCompare(a.data));
  const avs = DB.receitas.filter(l => l.clienteId===id);
  const tot = hs.reduce((s,h) => { const i = infoHonorario(h); return {t:s.t+i.total, r:s.r+i.rec, s:s.s+i.saldo, v:s.v+i.vencido}; }, {t:0,r:0,s:0,v:0});
  const hist = [...recs.map(r => ({d:r.data, t:`Pagamento recebido: ${reais(r.valor)} (${r.forma})`})), ...hs.map(h => ({d:h.dataContratacao, t:`Honorário contratado: ${h.servico} · ${h.tipo==="exito"&&!h.valorTotal?"êxito, a apurar":reais(h.valorTotal)}`})), ...hs.flatMap(h => (h.alteracoes||[]).map(a => ({d:a.ts.slice(0,10), t:`Alteração em "${h.servico}" por ${a.usuario}: ${a.campos.join("; ")}`}))), ...avs.map(l => ({d:l.pagoEm||l.vencimento, t:`Receita avulsa: ${l.descricao} · ${reais(l.valor)} ${l.pagoEm?"(recebida)":"(em aberto)"}`}))].sort((a,b) => (b.d||"").localeCompare(a.d||""));
  corpo.innerHTML = `<div class="fin"><div class="kpis kpis-fin" style="grid-template-columns:repeat(4,minmax(0,1fr))"><div class="kpi"><div class="n">${reais(tot.t)}</div><div class="l">Honorários combinados</div></div><div class="kpi"><div class="n">${reais(tot.r)}</div><div class="l">Pagamentos realizados</div></div><div class="kpi"><div class="n">${reais(tot.s)}</div><div class="l">Valores pendentes</div></div><div class="kpi ${tot.v?"neg":""}"><div class="n">${reais(tot.v)}</div><div class="l">Em atraso</div></div></div>
  <div class="barra-acoes"><button class="btn btn-pri" id="cf-hon">Novo honorário</button></div>
  <div class="secao-tit" style="font-size:18px">Serviços contratados</div>
  <div class="tabela-wrap"><table><thead><tr><th>Serviço</th><th>Contratação</th><th class="num">Total</th><th class="num">Recebido</th><th class="num">Saldo</th><th>Parcelas</th><th>Situação</th><th></th></tr></thead><tbody>${hs.length ? hs.map(h => { const i = infoHonorario(h); return `<tr><td>${esc(h.servico)}${h.processoId?`<div class="sub">${esc(rotProc(processo(h.processoId)))}</div>`:""}</td><td class="num">${fmtData(h.dataContratacao)}</td><td class="num">${i.st==="apurar"?"a apurar":reais(i.total)}</td><td class="num">${reais(i.rec)}</td><td class="num">${reais(i.saldo)}</td><td>${i.ps.map(p => { const ip = infoParcela(p); return `<span class="pill ${ST_FIN[ip.st][1]}" title="${fmtData(p.vencimento)} · ${reais(p.valor)}">${p.numero}</span>`; }).join(" ")||"—"}</td><td>${pillFin(i.st)}</td><td><button class="btn btn-sm btn-pri" data-hon="${h.id}">Abrir</button></td></tr>`; }).join("") : `<tr><td colspan="8" class="vazio">Nenhum honorário lançado para este cliente.</td></tr>`}</tbody></table></div>
  <div class="secao-tit" style="font-size:18px">Histórico financeiro</div>
  <div class="linha-tempo">${hist.length ? hist.map(x => `<div class="ev"><div class="sub">${fmtData(x.d)}</div><div>${esc(x.t)}</div></div>`).join("") : `<div class="sub">Sem movimentação.</div>`}</div></div>`;
  $("#cf-hon").onclick = async () => { const h = await editarHonorario(null, {clienteId:id}); if(h) rota(); };

/* A chave-mestra não é exportável; para incluir um usuário, a senha do
   administrador desembrulha a chave e a embrulha com a senha nova. */
async function criarUsuarioComSenhaAdmin(dados, senhaAdmin){
  const adm = META.usuarios.find(x => x.id===USU.id);
  const raw = await desembrulhar(senhaAdmin, adm.w);
  const novo = {id:uid(), nome:dados.nome, login:dados.login.toLowerCase(), perfil:dados.perfil, criado:new Date().toISOString(), w: await embrulhar(dados.senha, raw)};
  META.usuarios.push(novo); await ARM.put("kv","meta",META); return novo;
}

/* ---- Backup e restauração ---- */
async function fazerBackup(){
  toast("Preparando backup cifrado…");
  await salvarAgora();
  const dados = await ARM.get("kv","dados");
  const arquivos = [];
  const pularV = (DB.conteudo && DB.conteudo.config && !DB.conteudo.config.backupVideos) ? ccIdsVideo() : new Set(); let nPul = 0;
  for(const k of await ARM.chaves("arquivos")){ if(pularV.has(k)){ nPul++; continue; } const a = await ARM.get("arquivos", k); arquivos.push({id:k, iv:a.iv, ct:b64(a.ct)}); }
  if(nPul) toast(`${nPul} arquivo(s) de vídeo da Central de Conteúdo ficaram fora do backup (opção em Integrações).`);
  const pacote = {formato:"JVA-backup", versao:1, criado:new Date().toISOString(), meta:META, dados:{iv:dados.iv, ct:b64(dados.ct)}, arquivos};
  const nome = `backup-jessica-valiente-${hojeStr()}.json`;
  const ok = await salvarArquivo(nome, JSON.stringify(pacote), "application/json");
  if(ok){ DB.config.ultimoBackup = new Date().toISOString(); registrar("backup", `Backup gerado (${arquivos.length} arquivo(s))`); salvar(); if(location.hash==="#config") rota(); }
}
async function restaurarBackup(){
  const r = await modal("Restaurar backup", `<form class="campos"><label class="largo">Arquivo de backup (.json)<input type="file" name="arq" id="rb-arq" accept=".json,application/json" required></label><label>Usuário do backup<input name="login"></label><label>Senha do backup<input name="senha" type="password"></label><label class="largo">Ou, sem a senha: código de recuperação válido na data do backup<input name="codigo" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX"></label><p class="sub largo">A restauração <b>substitui</b> todos os dados deste computador pelos do backup. O backup só abre com usuário e senha que existiam quando ele foi feito.</p><div class="sub largo" id="rb-erro" style="color:var(--perigo)"></div></form>`,
    [{t:"Cancelar", v:null}, {t:"Restaurar", cls:"btn-pri", acao: async f => {
      const e = f.querySelector("#rb-erro"); const file = f.querySelector("#rb-arq").files[0]; const v = lerForm(f.querySelector("form"));
      if(!file){ e.textContent = "Escolha o arquivo."; return false; }
      e.textContent = "Abrindo e verificando o backup…";
      try{
        const p = JSON.parse(await file.text()); if(p.formato!=="JVA-backup") throw new Error("formato");
        let raw, u;
        if(v.codigo){ raw = await desembrulhar(v.codigo.toUpperCase().replace(/[^A-Z0-9]/g,""), p.meta.recuperacao); u = p.meta.usuarios.find(x => x.perfil==="admin" && !x.inativo) || p.meta.usuarios[0]; }
        else { u = p.meta.usuarios.find(x => x.login===v.login.toLowerCase()); if(!u) throw new Error("login"); raw = await desembrulhar(v.senha, u.w); }
        const k = await importarMestra(raw);
        const db = JSON.parse(dec.decode(await decifrarBytes(k, p.dados.iv, unb64(p.dados.ct))));
        { const manter = new Set(); ((db.conteudo && db.conteudo.midias) || []).forEach(m => { manter.add(m.id); (m.renders||[]).forEach(r => manter.add(r.id)); }); p.arquivos.forEach(a => manter.delete(a.id));
          for(const k of await ARM.chaves("arquivos")) if(!manter.has(k)) await ARM.del("arquivos", k); }
        for(const a of p.arquivos) await ARM.put("arquivos", a.id, {iv:a.iv, ct:unb64(a.ct)});
        await ARM.put("kv","meta",p.meta); await ARM.put("kv","dados",{iv:p.dados.iv, ct:unb64(p.dados.ct)});
        META = p.meta; CHAVE = k; USU = u; DB = db; { const base = bancoVazio(); for(const k2 in base) if(!(k2 in DB)) DB[k2] = base[k2]; } normalizarDB(); return true;
      }catch(x){ e.textContent = x.message==="formato" ? "Este arquivo não é um backup do sistema." : (v.codigo ? "O código de recuperação não confere com este backup." : "Usuário ou senha não conferem com este backup."); return false; }
    }}]);
  if(r){ garantirFeriados(); registrar("backup","Backup restaurado"); salvar(); toast("Backup restaurado."); abrirApp(); }
}

function removerTeste(){
  const cids = new Set(DB.clientes.filter(x=>x.teste).map(x=>x.id));
  const pids = new Set(DB.processos.filter(p=>cids.has(p.clienteId)).map(p=>p.id));
  DB.documentos.filter(d=>cids.has(d.clienteId)).forEach(d => ARM.del("arquivos", d.id));
  DB.clientes = DB.clientes.filter(x=>!cids.has(x.id)); DB.processos = DB.processos.filter(p=>!pids.has(p.id));
  ["familiares","atendimentos","documentos"].forEach(k => DB[k] = DB[k].filter(x=>!cids.has(x.clienteId)));
  DB.movimentacoes = DB.movimentacoes.filter(m=>!pids.has(m.processoId));
  DB.prazos = DB.prazos.filter(p=>!p.teste && !cids.has(p.clienteId)); DB.compromissos = DB.compromissos.filter(x=>!x.teste && !cids.has(x.clienteId));
  registrar("teste","Dados de teste removidos"); salvar(); desenharMenu("config");
}

/* ---- Busca global ---- */
$("#busca-global").addEventListener("keydown", e => {
  if(e.key !== "Enter") return;
  const q = e.target.value.trim(); if(!q) return; const ql = q.toLowerCase(), d = soDig(q);
  const cl = DB.clientes.filter(x => x.nome.toLowerCase().includes(ql) || (d.length>=3 && (x.cpf||"").includes(d)));
  const pr = DB.processos.filter(p => [p.numero,p.protocolo,p.nb].some(v => v && (v.toLowerCase().includes(ql) || (d.length>=4 && soDig(v).includes(d)))));
  if(cl.length + pr.length === 1){ ir(cl.length ? "cliente-"+cl[0].id : "processo-"+pr[0].id); e.target.value = ""; return; }
  modal(`Resultados para "${q}"`, (cl.length||pr.length) ? `${cl.map(x=>`<div class="item-dia" data-ir="cliente-${x.id}"><div><b>${esc(x.nome)}</b><div class="sub">Cliente · ${esc(fmtCPF(x.cpf))}</div></div></div>`).join("")}${pr.map(p=>`<div class="item-dia" data-ir="processo-${p.id}"><div><b>${esc(rotProc(p))}</b><div class="sub">${esc(p.acao||"")} · ${esc(nomeCli(p.clienteId))}</div></div></div>`).join("")}` : `<p class="sub">Nada encontrado.</p>`);
  setTimeout(() => document.querySelectorAll("[data-ir]").forEach(el => el.onclick = () => { document.querySelector(".fundo-modal")?.remove(); ir(el.dataset.ir); }), 0);
});

{id:"p-idade", area:"prev", titulo:"Aposentadoria por idade: o que é preciso hoje", capa:"Aposentadoria por idade", kw:["aposentadoria por idade","idade","aposentar","aposentadoria"],
 publico:"Pessoas perto dos 60 anos que contribuíram pouco tempo", objetivo:"Educar e gerar salvamentos",

 pontos:["Hoje, a mulher precisa ter 62 anos de idade e o homem 65 anos.","Além da idade, é preciso ter tempo de contribuição: em regra, 15 anos para a mulher.","Para o homem, são 15 anos se ele já contribuía antes de 13 de novembro de 2019, e 20 anos se começou depois.","Tempo como trabalhador rural, auxílio-doença intercalado com contribuição e outros períodos podem contar. Vale conferir tudo no extrato do INSS."],

{id:"p-transicao", area:"prev", titulo:"Regras de transição da aposentadoria em 2026", capa:"Regras de transição 2026", kw:["transição","pontos","idade mínima progressiva","tempo de contribuição","pedágio"],
 publico:"Quem já contribuía antes da Reforma de 2019", objetivo:"Informar mudança anual e gerar compartilhamentos",
 ganchos:["As regras da aposentadoria mudaram de novo em 2026. Você sabe o que mudou?","Começou a contribuir antes de 2019? Então existem regras de transição para você.","Todo ano a conta da aposentadoria fica um pouco mais difícil. Entenda."],
 pontos:["Quem já contribuía antes da Reforma de novembro de 2019 pode usar as regras de transição.","Na regra dos pontos, você soma idade e tempo de contribuição. Em 2026, a mulher precisa de 93 pontos e o homem de 103.","Nessa regra também é preciso ter pelo menos 30 anos de contribuição, se mulher, e 35, se homem.","Na idade mínima progressiva, em 2026 são 59 anos e meio para a mulher e 64 anos e meio para o homem, com os mesmos 30 e 35 anos de contribuição.","Essas exigências sobem um pouco a cada ano. Por isso, saber em qual regra você se encaixa faz diferença."],
 mudanca:"em 2026, a pontuação subiu um ponto e a idade mínima progressiva subiu seis meses",
 mito:["As regras de transição são iguais para todo mundo.","Cada regra tem requisitos diferentes e pode gerar valores diferentes. O ideal é comparar."],
 erro:"escolher a primeira regra que fecha os requisitos sem comparar o valor que cada uma pode gerar",
 pergunta:"Qual regra de transição é melhor para mim?",
 hipotese:"a Sandra tem 58 anos e 31 anos de contribuição e quer saber quando poderá se aposentar",
 base:"EC 103/2019, arts. 15, 16, 17 e 20", conferir:"Os números (93/103 pontos; 59,5/64,5 anos) valem para 2026. Atualize em janeiro de cada ano.", tags:["reformadaprevidencia","regrasdetransicao","aposentadoria"]},

{id:"p-cnis", area:"prev", titulo:"CNIS: o extrato que decide a sua aposentadoria", capa:"Já conferiu seu CNIS?", kw:["cnis","extrato","vínculos","contribuições","meu inss"],
 publico:"Qualquer trabalhador que contribui ou já contribuiu para o INSS", objetivo:"Gerar ação prática e salvamentos",
 ganchos:["Existe um documento que pode adiantar ou atrasar a sua aposentadoria. Você já olhou o seu?","Antes de pedir qualquer benefício no INSS, confere isso aqui.","Seu tempo de trabalho pode estar sumindo do sistema do INSS."],
 pontos:["O CNIS é o extrato com todos os seus vínculos e contribuições registrados no INSS.","Você consegue baixar o seu pelo aplicativo ou site Meu INSS, com a sua conta gov.br.","É comum faltar um emprego antigo, aparecer data errada ou salário diferente do que você recebia.","Se algo estiver errado, dá para pedir a correção apresentando documentos como carteira de trabalho, contracheques ou termo de rescisão.","O melhor momento para arrumar o CNIS é antes de pedir o benefício, e não depois de uma negativa."],
 mito:["Se trabalhei com carteira assinada, o INSS já tem tudo certinho.","Muitas vezes há falhas no cadastro. Conferir o CNIS evita surpresa."],
 erro:"descobrir só na hora da aposentadoria que um vínculo antigo não aparece no sistema",
 pergunta:"Como eu sei se o INSS está contando todo o meu tempo de trabalho?",
 hipotese:"o Seu João trabalhou 4 anos numa fazenda com carteira assinada nos anos 90, mas esse vínculo não aparece no extrato dele",
 base:"Lei 8.213/91, art. 29-A; Decreto 3.048/99, art. 19", conferir:null, tags:["cnis","meuinss","tempodecontribuicao"]},

{id:"p-planejamento", area:"prev", titulo:"Planejamento previdenciário: para que serve", capa:"Planejar a aposentadoria", kw:["planejamento","planejamento previdenciário","simulação","valor da aposentadoria"],
 publico:"Pessoas de 40 a 60 anos que querem se organizar", objetivo:"Construir autoridade",
 ganchos:["Você sabe quando vai poder se aposentar e quanto vai receber?","Contribuir sem saber para onde está indo pode custar caro.","Planejamento previdenciário não é luxo. Deixa eu te mostrar por quê."],
 pontos:["O planejamento previdenciário é uma análise do seu histórico de contribuições para entender quando e como você pode se aposentar.","Ele começa pela conferência do CNIS e dos documentos de trabalho.","Depois, compara as regras possíveis e estima o valor em cada uma.","Também mostra se vale a pena contribuir de outro jeito, ou se há períodos que podem ser reconhecidos.","Não é só para quem está perto de se aposentar. Quanto antes, mais opções você tem."],
 mito:["Planejamento previdenciário é só para quem ganha muito.","Ele serve para qualquer pessoa que quer evitar erros e contribuições desnecessárias."],
 erro:"pagar contribuições por anos sem saber se elas vão realmente fazer diferença",
 pergunta:"Vale a pena fazer planejamento previdenciário se ainda faltam muitos anos?",
 hipotese:"a Cláudia tem 48 anos, alternou carteira assinada e períodos como autônoma e não sabe quanto falta",
 base:"EC 103/2019; Lei 8.213/91", conferir:null, tags:["planejamentoprevidenciario","aposentadoria","previdencia"]},

{id:"p-auxilio", area:"prev", titulo:"Auxílio por incapacidade temporária (antigo auxílio-doença)", capa:"Auxílio-doença: quem tem direito", kw:["auxílio-doença","auxilio doenca","incapacidade temporária","afastamento","doença"],
 publico:"Trabalhadores que ficaram doentes ou se acidentaram", objetivo:"Educar e gerar compartilhamentos",
 ganchos:["Ficar doente não garante, sozinho, o auxílio-doença. Entenda o porquê.","Precisou se afastar do trabalho por doença? Veja o que o INSS analisa.","O antigo auxílio-doença mudou de nome. Mas as dúvidas continuam as mesmas."],
 pontos:["O antigo auxílio-doença hoje se chama auxílio por incapacidade temporária.","Ele é para quem fica incapaz de trabalhar por mais de 15 dias seguidos. Para quem tem carteira assinada, os primeiros 15 dias são pagos pela empresa.","Em regra, são exigidas 12 contribuições, mas isso é dispensado em caso de acidente de qualquer natureza e de algumas doenças graves previstas em lista.","Também é preciso manter a qualidade de segurado, ou seja, estar contribuindo ou dentro do período de graça.","O que conta é a incapacidade para o trabalho, e não apenas ter uma doença. Por isso, os laudos fazem tanta diferença."],
 mito:["Quem tem uma doença tem direito ao auxílio-doença.","O que dá direito é a incapacidade para trabalhar, comprovada em perícia."],
 erro:"ir para a perícia sem laudos atualizados que expliquem as limitações para o trabalho",
 pergunta:"Tenho uma doença crônica. Tenho direito ao auxílio-doença?",
 hipotese:"o Carlos, pedreiro, machucou o joelho jogando futebol e não consegue subir em andaimes há um mês",
 base:"Lei 8.213/91, arts. 25, I; 26, II; 59 e 60; EC 103/2019", conferir:null, tags:["auxiliodoenca","incapacidade","pericia"]},

{id:"p-invalidez", area:"prev", titulo:"Aposentadoria por incapacidade permanente", capa:"Aposentadoria por invalidez hoje", kw:["invalidez","incapacidade permanente","aposentadoria por invalidez"],
 publico:"Pessoas com doenças ou sequelas que impedem qualquer trabalho", objetivo:"Educar",
 ganchos:["A antiga aposentadoria por invalidez mudou de nome. E tem detalhes que pouca gente sabe.","Quando o auxílio-doença vira aposentadoria? Vou explicar.","Aposentadoria por invalidez é para sempre? Nem sempre."],
 pontos:["A antiga aposentadoria por invalidez hoje se chama aposentadoria por incapacidade permanente.","Ela é para quem está incapaz de forma total e definitiva para o trabalho, sem possibilidade de reabilitação para outra atividade.","A análise considera a doença, mas também idade, escolaridade e o tipo de trabalho que a pessoa sempre fez.","Ela pode ser revista em perícias periódicas, então manter o acompanhamento médico e os documentos em dia é importante."],
 mito:["Aposentadoria por invalidez nunca é revista.","O INSS pode convocar para perícia de revisão em várias situações."],
 erro:"parar o tratamento e não guardar os documentos médicos depois de aposentado",
 pergunta:"Quem recebe auxílio-doença há muito tempo vira aposentado por invalidez automaticamente?",
 hipotese:"a Rosa, 58 anos, trabalhou a vida inteira como faxineira e tem uma doença na coluna que não melhora com tratamento",
 base:"Lei 8.213/91, arts. 42 a 47 e 101; EC 103/2019", conferir:null, tags:["aposentadoriaporinvalidez","incapacidadepermanente","inss"]},

{id:"p-pericia", area:"prev", titulo:"Como se preparar para a perícia do INSS", capa:"Perícia do INSS: prepare-se", kw:["perícia","pericia","laudo","perito"],
 publico:"Quem tem perícia médica marcada no INSS", objetivo:"Orientação prática e salvamentos",
 ganchos:["Tem perícia marcada no INSS? Antes de ir, assista isso.","A perícia dura poucos minutos. Por isso, a preparação faz diferença.","O que levar para a perícia do INSS? Anota aí."],
 pontos:["Leve os documentos médicos originais: laudos, exames, receitas e atestados, de preferência recentes.","Um bom laudo informa o diagnóstico, o tratamento e, principalmente, quais limitações você tem para trabalhar.","Na conversa com o perito, explique com sinceridade o seu trabalho e o que você não consegue mais fazer no dia a dia.","Chegue com antecedência e leve documento com foto.","Se o resultado for negativo, existem caminhos, como o recurso administrativo, dentro do prazo."],
 erro:"levar só exames, sem um laudo que explique a relação entre a doença e o trabalho",
 pergunta:"O que eu levo no dia da perícia do INSS?",
 hipotese:"a Ana tem perícia amanhã e separou só um exame de imagem de dois anos atrás",
 base:"Lei 8.213/91, art. 101; Decreto 3.048/99", conferir:null, tags:["periciainss","laudomedico","auxiliodoenca"]},

{id:"p-maternidade", area:"prev", titulo:"Salário-maternidade: quem tem direito", capa:"Salário-maternidade", kw:["salário-maternidade","salario maternidade","gestante","maternidade","licença-maternidade","bebê"],
 publico:"Gestantes, mães recentes e mães por adoção", objetivo:"Informar direito pouco conhecido e gerar compartilhamentos",
 ganchos:["Você sabia que nem só quem tem carteira assinada pode receber salário-maternidade?","Desempregada e grávida? Talvez você tenha direito ao salário-maternidade.","Uma decisão do STF mudou o salário-maternidade. Você ficou sabendo?"],
 pontos:["O salário-maternidade é pago em caso de nascimento, adoção ou guarda judicial para fins de adoção, e também em situações de aborto não criminoso.","Em regra, ele dura 120 dias.","Têm direito a empregada, a trabalhadora doméstica, a MEI e autônoma que contribui, a contribuinte facultativa e a segurada especial do meio rural.","Desde a decisão do STF de 2024, o INSS não exige mais o mínimo de 10 contribuições. Mas continua sendo preciso ter a qualidade de segurada.","Mesmo desempregada, a mulher pode ter direito, se ainda estiver no chamado período de graça."],
 mudanca:"o STF derrubou a exigência de 10 contribuições, e o INSS passou a aplicar isso para pedidos feitos desde abril de 2024",
 mito:["Salário-maternidade é só para quem tem carteira assinada.","MEI, autônoma, facultativa, trabalhadora rural e até desempregada podem ter direito."],
 erro:"achar que não tem direito porque perdeu o emprego durante a gravidez, sem verificar o período de graça",
 pergunta:"Fui demitida grávida. Ainda posso receber salário-maternidade?",
 hipotese:"a Juliana é MEI, começou a contribuir há poucos meses e o bebê nasceu agora",
 base:"Lei 8.213/91, arts. 71 a 73; STF, ADI 2110 e 2111; IN PRES/INSS 188/2025", conferir:"A dispensa de carência vale para requerimentos desde 05/04/2024. Conferir eventuais novas instruções do INSS.", tags:["salariomaternidade","maternidade","direitodamulher"]},

{id:"p-pensaomorte", area:"prev", titulo:"Pensão por morte: quanto tempo dura", capa:"Pensão por morte dura quanto?", kw:["pensão por morte","pensao por morte","viúva","viuva","falecimento","óbito"],
 publico:"Viúvos, viúvas e familiares de segurados falecidos", objetivo:"Educar com clareza",
 ganchos:["Pensão por morte nem sempre é vitalícia. Você sabia?","Perdeu o marido ou a esposa? Entenda como funciona a pensão por morte.","Quanto tempo dura a pensão por morte do INSS? Depende de três coisas."],
 pontos:["A pensão por morte é paga aos dependentes de quem era segurado do INSS ou já era aposentado.","Ela não exige um número mínimo de contribuições de quem faleceu.","Para o cônjuge ou companheiro, a duração depende da idade na data do óbito, do tempo de união e das contribuições de quem faleceu.","Se a união tinha menos de 2 anos ou o falecido tinha menos de 18 contribuições, em regra a pensão dura só 4 meses.","Fora isso, ela é vitalícia para quem tinha 45 anos ou mais na data do óbito. Abaixo disso, dura por um prazo que varia conforme a idade."],
 mito:["Toda viúva recebe pensão para o resto da vida.","A duração depende da idade, do tempo de união e das contribuições."],
 erro:"deixar de reunir provas da união estável, como conta conjunta, endereço comum e fotos, antes de pedir a pensão",
 pergunta:"Vivia em união estável sem papel passado. Tenho direito à pensão por morte?",
 hipotese:"a Lúcia, de 39 anos, viveu 6 anos em união estável com o Paulo, que contribuía para o INSS e faleceu",
 base:"Lei 8.213/91, arts. 16, 74 e 77; Lei 13.135/2015; Portaria ME 424/2020; EC 103/2019, art. 23", conferir:"Tabela de idades vigente para óbitos desde 01/01/2021 (Portaria ME 424/2020). Pode ser reajustada por nova portaria.", tags:["pensaopormorte","viuvez","inss"]},

{id:"p-bpc-idoso", area:"prev", titulo:"BPC/LOAS para pessoa idosa", capa:"BPC para idosos", kw:["bpc","loas","idoso","65 anos","benefício assistencial"],
 publico:"Pessoas com 65 anos ou mais, de baixa renda, e suas famílias", objetivo:"Informar direito pouco conhecido",
 ganchos:["Nunca contribuiu para o INSS e já tem 65 anos? Existe um benefício que talvez seja para você.","BPC não é aposentadoria. E essa diferença importa muito.","Quem pode receber o BPC do idoso? Vou te explicar."],
 pontos:["O BPC é um benefício assistencial de um salário mínimo por mês para a pessoa idosa de 65 anos ou mais em situação de baixa renda.","Não é preciso ter contribuído para o INSS.","O critério legal de renda é de até um quarto do salário mínimo por pessoa da família que mora junto.","É obrigatório estar no CadÚnico, com cadastro atualizado, e ter documento com biometria.","O BPC não é aposentadoria: não paga 13º e não deixa pensão por morte para a família."],
 mudanca:"desde a Lei 15.077/2024, o cadastro no CadÚnico precisa ser atualizado a cada 24 meses e a biometria passou a ser exigida",
 mito:["O BPC passa para o marido ou para os filhos quando a pessoa falece.","O BPC não gera pensão por morte."],
 erro:"deixar o CadÚnico desatualizado e ter o benefício bloqueado",
 pergunta:"Minha mãe tem 66 anos e nunca trabalhou com carteira. Ela pode receber algum benefício?",
 hipotese:"o Seu Antônio, de 67 anos, mora sozinho, nunca contribuiu e vive de pequenos bicos",
 base:"Lei 8.742/93 (LOAS), art. 20; Lei 15.077/2024", conferir:"O critério de renda e as regras de cadastro mudam com frequência. Confira no gov.br/inss antes de gravar.", tags:["bpc","loas","idoso","assistenciasocial"]},

{id:"p-bpc-def", area:"prev", titulo:"BPC/LOAS para pessoa com deficiência", capa:"BPC para pessoa com deficiência", kw:["bpc","loas","deficiência","deficiencia","autismo","autista","tea","criança com deficiência"],
 publico:"Famílias de pessoas com deficiência, inclusive crianças", objetivo:"Educar e acolher",
 ganchos:["Criança com deficiência pode receber BPC? Pode, e muita família não sabe.","Deficiência leve dá direito ao BPC? Vamos esclarecer.","BPC para pessoa com deficiência: o que o INSS avalia."],
 pontos:["O BPC também é garantido à pessoa com deficiência de qualquer idade, inclusive crianças, em situação de baixa renda.","A deficiência considerada é o impedimento de longo prazo, de pelo menos 2 anos, que dificulta a participação na sociedade em igualdade com as outras pessoas.","Há avaliação médica e avaliação social no INSS.","A lei de 2024 não tirou o direito de quem tem deficiência leve. Esse trecho foi vetado.","A renda do cônjuge que não mora na mesma casa não entra no cálculo da renda da família."],
 mito:["Deficiência leve não dá direito ao BPC.","Esse trecho foi vetado. O que se avalia é o impedimento de longo prazo e a renda."],
 erro:"não levar relatórios que mostrem como a deficiência afeta a rotina, a escola ou o trabalho",
 pergunta:"Meu filho é autista. Ele pode receber o BPC?",
 hipotese:"o Pedro tem 8 anos, é autista e a mãe cuida dele sozinha com uma renda baixa",
 base:"Lei 8.742/93, art. 20, §§ 2º e 10; Lei 15.077/2024", conferir:"Conferir critério de renda e regras de avaliação vigentes.", tags:["bpc","pessoacomdeficiencia","autismo","inclusao"]},

{id:"p-revisao", area:"prev", titulo:"Revisão de benefício do INSS", capa:"Seu benefício pode estar errado?", kw:["revisão","revisao","recalcular","valor errado","benefício baixo"],
 publico:"Aposentados e pensionistas", objetivo:"Educar e construir autoridade",
 ganchos:["Será que o valor da sua aposentadoria está certo?","Aposentado: existe prazo para pedir revisão. Você sabia?","Revisão da vida toda: ainda dá para pedir?"],
 pontos:["A revisão serve para corrigir erros no cálculo ou na concessão do benefício.","Os erros mais comuns são vínculos que não foram contados, salários errados e períodos especiais ou rurais ignorados.","Em regra, o prazo para pedir a revisão do ato de concessão é de 10 anos.","A chamada revisão da vida toda foi rejeitada pelo STF em 2024. Desconfie de quem promete esse tipo de revisão.","Antes de qualquer pedido, é preciso analisar a carta de concessão e o histórico de contribuições."],
 mito:["Todo aposentado tem direito à revisão da vida toda.","O STF decidiu que o segurado não pode escolher essa forma de cálculo."],
 erro:"cair em promessas de revisões milagrosas sem uma análise do próprio caso",
 pergunta:"Como saber se a minha aposentadoria foi calculada errado?",
 hipotese:"o Seu Jorge se aposentou há 3 anos e percebeu que o tempo de serviço militar dele não foi contado",
 base:"Lei 8.213/91, art. 103; STF, ADI 2110 e 2111", conferir:null, tags:["revisaodeaposentadoria","aposentado","inss"]},

{id:"p-recurso", area:"prev", titulo:"Benefício negado pelo INSS: e agora?", capa:"O INSS negou. E agora?", kw:["negado","indeferido","recurso","recurso administrativo","negativa"],
 publico:"Quem teve um pedido negado no INSS", objetivo:"Orientação prática",
 ganchos:["O INSS negou o seu pedido? Calma, isso não é o fim.","Benefício negado: o primeiro passo é ler isso aqui.","Existe prazo para recorrer de uma negativa do INSS. Você sabe qual é?"],
 pontos:["O primeiro passo é ler a carta de indeferimento e entender o motivo da negativa.","Contra a decisão cabe recurso administrativo, em regra no prazo de 30 dias da ciência.","Em alguns casos é melhor fazer um novo pedido com mais documentos, e em outros, buscar a Justiça.","A escolha do caminho depende do motivo da negativa e das provas que você tem.","Guarde todos os protocolos e a data do primeiro pedido. Ela pode ser importante para valores atrasados."],
 erro:"perder o prazo do recurso por não abrir as mensagens do Meu INSS",
 pergunta:"O que fazer quando o INSS nega o benefício?",
 hipotese:"a Marta teve o auxílio negado porque a perícia não viu incapacidade, mas o médico dela diz o contrário",
 base:"Decreto 3.048/99, art. 305; Lei 8.213/91, art. 126", conferir:"Conferir prazos vigentes no Regimento do CRPS.", tags:["inss","beneficionegado","recursoadministrativo"]},

{id:"p-requerimento", area:"prev", titulo:"Como funciona um pedido no INSS", capa:"Pedido no INSS passo a passo", kw:["requerimento","pedido","meu inss","135","exigência","protocolo"],
 publico:"Quem vai fazer o primeiro pedido de benefício", objetivo:"Orientação prática",
 ganchos:["Vai pedir um benefício no INSS? Entenda o caminho antes.","O que é uma exigência do INSS e por que você não pode ignorar.","Pediu um benefício e não acompanha o processo? Cuidado."],
 pontos:["Os pedidos são feitos pelo aplicativo ou site Meu INSS, ou pela central 135.","Depois do pedido, acompanhe tudo pelo Meu INSS, inclusive as mensagens.","Se o INSS pedir documentos, isso se chama exigência, e ela tem prazo para ser cumprida.","A data do pedido, chamada DER, é importante para definir desde quando o benefício pode ser pago.","Organizar os documentos antes de pedir evita idas e vindas."],
 erro:"não cumprir uma exigência no prazo e ter o pedido encerrado",
 pergunta:"Fiz o pedido no Meu INSS. E agora, o que acontece?",
 hipotese:"a Paula fez o pedido de aposentadoria e recebeu uma mensagem pedindo documentos que ela não viu",
 base:"Lei 8.213/91; Decreto 3.048/99; IN PRES/INSS 128/2022", conferir:null, tags:["meuinss","inss","beneficio"]},

{id:"p-rural", area:"prev", titulo:"Aposentadoria do trabalhador rural", capa:"Trabalhador rural se aposenta mais cedo", kw:["rural","agricultor","segurado especial","campo","produtor rural","lavoura"],
 publico:"Trabalhadores do campo e agricultores familiares", objetivo:"Informar e criar conexão regional",
 ganchos:["Trabalhou na roça? Esse tempo pode valer para a sua aposentadoria.","Quem trabalha no campo pode se aposentar mais cedo. Você sabia?","Agricultor familiar: o INSS pede provas. Quais são?"],
 pontos:["O trabalhador rural em regime de economia familiar, chamado segurado especial, pode se aposentar por idade mais cedo.","A idade é de 55 anos para a mulher e 60 para o homem, com 15 anos de atividade rural.","Para o segurado especial, o que se comprova é o tempo de atividade no campo, e não contribuições mensais.","Servem como prova documentos em nome próprio ou da família, como bloco de produtor, notas, contratos e certidões que indiquem a profissão.","Também é feita uma autodeclaração, que precisa estar de acordo com os documentos."],
 mito:["Quem trabalhou no campo sem contribuir não tem direito a nada.","O segurado especial comprova atividade rural, não contribuições."],
 erro:"jogar fora notas e documentos antigos da propriedade da família",
 pergunta:"Trabalhei com meus pais na lavoura quando era jovem. Esse tempo conta?",
 hipotese:"a Dona Irma, 56 anos, sempre plantou com o marido numa pequena propriedade no interior",
 base:"Lei 8.213/91, arts. 11, VII; 39; 48, § 1º; 106; CF, art. 201, § 7º, II", conferir:null, tags:["trabalhadorrural","aposentadoriarural","seguradoespecial","agro"]},

{id:"p-graca", area:"prev", titulo:"Período de graça: parou de contribuir e continua protegido", capa:"Parou de contribuir?", kw:["período de graça","periodo de graca","qualidade de segurado","desempregado","parou de contribuir"],
 publico:"Pessoas desempregadas ou que pararam de contribuir", objetivo:"Informar direito pouco conhecido",
 ganchos:["Parou de contribuir para o INSS? Você ainda pode estar protegido.","Desempregado também pode ter direito a benefício do INSS. Entenda.","O que é o tal período de graça do INSS?"],
 pontos:["Quem para de contribuir não perde a proteção do INSS de imediato. Esse tempo se chama período de graça.","Em regra, ele dura 12 meses depois da última contribuição.","Pode chegar a 24 meses para quem tem mais de 120 contribuições sem ter perdido a qualidade de segurado.","E pode ganhar mais 12 meses para quem comprovar que ficou desempregado.","Para quem contribui como facultativo, o prazo é menor: 6 meses."],
 erro:"deixar passar o período de graça sem voltar a contribuir e perder a cobertura",
 pergunta:"Estou desempregado há 8 meses. Se eu ficar doente, tenho direito a algum benefício?",
 hipotese:"o Rafael foi demitido há 10 meses e agora precisou de uma cirurgia",
 base:"Lei 8.213/91, art. 15", conferir:null, tags:["qualidadedesegurado","desemprego","inss"]},

{id:"p-mei", area:"prev", titulo:"MEI e autônomo: como a contribuição conta", capa:"MEI vai se aposentar como?", kw:["mei","autônomo","autonomo","contribuinte individual","facultativo","carnê","gps"],
 publico:"MEIs, autônomos e donas de casa que contribuem", objetivo:"Educar",
 ganchos:["Você é MEI? Então precisa entender como a sua contribuição conta para a aposentadoria.","Pagar o INSS no valor mínimo tem um detalhe que pouca gente conhece.","Dona de casa pode contribuir para o INSS? Pode, e tem regras próprias."],
 pontos:["O MEI contribui com um valor reduzido, que garante benefícios como aposentadoria por idade, auxílio por incapacidade e salário-maternidade.","Contribuições pelo plano simplificado, com alíquota reduzida, não contam para a aposentadoria por tempo de contribuição, a não ser que a diferença seja complementada.","Quem não tem renda própria pode contribuir como facultativo, inclusive donas de casa.","Existe a opção de baixa renda para quem não tem renda própria, se dedica ao trabalho do lar e está no CadÚnico, com regras específicas.","Antes de escolher a forma de contribuir, vale entender qual benefício você pretende alcançar."],
 erro:"pagar no código errado ou com atraso sem saber se a contribuição vai valer",
 pergunta:"O MEI se aposenta com quanto?",
 hipotese:"a Renata é manicure, abriu MEI há 3 anos e quer saber se isso conta para a aposentadoria",
 base:"Lei 8.212/91, art. 21, §§ 2º e 3º; Lei 8.213/91", conferir:"Alíquotas e valores mudam com o salário mínimo. Não cite valores sem conferir.", tags:["mei","autonomo","contribuicao","inss"]},

{id:"p-especial", area:"prev", titulo:"Atividade especial: trabalho com ruído, químicos e calor", capa:"Trabalho insalubre e aposentadoria", kw:["especial","insalubre","ruído","ppp","químicos","aposentadoria especial"],
 publico:"Trabalhadores expostos a agentes nocivos", objetivo:"Informar direito pouco conhecido",
 ganchos:["Trabalhou exposto a barulho ou produtos químicos? Isso pode mudar a sua aposentadoria.","O que é o PPP e por que você deveria pedir o seu.","Trabalho insalubre conta diferente para o INSS. Entenda."],
 pontos:["Quem trabalha exposto a agentes nocivos, como ruído alto, produtos químicos ou agentes biológicos, pode ter direito ao reconhecimento de atividade especial.","O principal documento é o PPP, o Perfil Profissiográfico Previdenciário, fornecido pela empresa.","Esse tempo pode dar direito à aposentadoria especial.","Para períodos trabalhados até 13 de novembro de 2019, o tempo especial ainda pode ser convertido em tempo comum com acréscimo.","Peça o PPP ao sair de cada empresa. Depois de anos, pode ficar difícil conseguir."],
 erro:"sair da empresa sem pedir o PPP",
 pergunta:"Trabalhei 10 anos numa indústria barulhenta. Isso conta como tempo especial?",
 hipotese:"o Marcos trabalhou 12 anos como frentista e nunca pediu o PPP",
 base:"Lei 8.213/91, arts. 57 e 58; EC 103/2019, art. 25, § 2º", conferir:null, tags:["aposentadoriaespecial","ppp","insalubridade"]},

{id:"p-pcd-apos", area:"prev", titulo:"Aposentadoria da pessoa com deficiência", capa:"Aposentadoria da pessoa com deficiência", kw:["aposentadoria da pessoa com deficiência","lc 142","deficiência","pcd"],
 publico:"Trabalhadores com deficiência", objetivo:"Informar direito pouco conhecido",
 ganchos:["Pessoa com deficiência tem regras próprias de aposentadoria. Você conhecia?","Trabalha com alguma deficiência? Talvez você se aposente antes.","Essa aposentadoria quase não aparece nas notícias."],
 pontos:["A pessoa com deficiência que contribui para o INSS tem regras próprias de aposentadoria, previstas em lei complementar.","Na aposentadoria por idade, são 55 anos para a mulher e 60 para o homem, com 15 anos de contribuição na condição de pessoa com deficiência.","Há também aposentadoria por tempo de contribuição, sem idade mínima, com tempo reduzido conforme o grau da deficiência.","O grau é definido em avaliação médica e funcional no INSS."],
 erro:"pedir a aposentadoria comum sem verificar se a regra da pessoa com deficiência é mais vantajosa",
 pergunta:"Tenho deficiência auditiva e trabalho há 25 anos. Existe regra diferente para mim?",
 hipotese:"a Fernanda tem visão monocular e trabalha com carteira assinada há 20 anos",
 base:"Lei Complementar 142/2013", conferir:null, tags:["pessoacomdeficiencia","aposentadoria","inclusao"]},

/* ---------------- FAMÍLIA ---------------- */
{id:"f-30porcento", area:"fam", titulo:"Pensão alimentícia: existe a regra dos 30%?", capa:"Pensão é sempre 30%?", kw:["pensão alimentícia","pensao alimenticia","30%","valor da pensão","alimentos"],
 publico:"Pais e mães que pagam ou recebem pensão", objetivo:"Desfazer mito e gerar compartilhamentos",
 ganchos:["Pensão alimentícia é sempre 30% do salário? Não é bem assim.","Todo mundo fala dos 30%. Mas isso não está na lei.","Como o juiz decide o valor da pensão alimentícia?"],
 pontos:["Não existe na lei um percentual fixo de 30% para a pensão alimentícia.","O valor é definido olhando a necessidade de quem recebe e a possibilidade de quem paga.","Também se busca proporcionalidade: os dois pais contribuem, cada um conforme a sua condição.","Por isso, o valor pode ser maior ou menor do que 30%, dependendo do caso.","Gastos com escola, saúde, alimentação e moradia da criança ajudam a mostrar a necessidade."],
 mito:["A pensão é sempre 30% do salário.","A lei não fixa percentual. O valor depende do caso."],
 erro:"fazer um acordo de boca, sem documento, e depois não conseguir cobrar",
 pergunta:"Quanto eu tenho que pagar de pensão?",
 hipotese:"o pai do Lucas ganha um salário mínimo e a mãe pediu 50% de pensão",
 base:"Código Civil, arts. 1.694, § 1º, e 1.703", conferir:null, tags:["pensaoalimenticia","alimentos","direitodefamilia"]},

{id:"f-atraso", area:"fam", titulo:"Pensão atrasada: o que pode acontecer", capa:"Pensão atrasada", kw:["pensão alimentícia","pensão atrasada","atraso","prisão","execução de alimentos","cobrar pensão","dívida de pensão"],
 publico:"Mães e pais que não estão recebendo a pensão", objetivo:"Informar e orientar",
 ganchos:["A pensão está atrasada? A lei prevê meios de cobrança bem sérios.","Pensão atrasada dá prisão? Depende. Vou explicar.","Quantos meses de pensão atrasada podem ser cobrados com pedido de prisão?"],
 pontos:["A pensão fixada por decisão judicial ou acordo homologado pode ser cobrada na Justiça.","Para as três últimas parcelas anteriores à cobrança, e as que vencerem durante o processo, pode haver pedido de prisão civil.","Para parcelas mais antigas, a cobrança costuma seguir pelo caminho da penhora de bens e valores.","Também pode haver protesto do título e inclusão do nome em cadastros de inadimplentes.","Guardar comprovantes de pagamento é importante para os dois lados."],
 erro:"esperar acumular anos de atraso para só então cobrar",
 pergunta:"Ele está há 5 meses sem pagar a pensão. O que eu faço?",
 hipotese:"a Camila recebe a pensão do filho pela metade há 6 meses",
 base:"CPC, arts. 528 e 530; Súmula 309 do STJ", conferir:null, tags:["pensaoalimenticia","pensaoatrasada","direitodefamilia"]},

{id:"f-maioridade", area:"fam", titulo:"Pensão acaba automaticamente aos 18 anos?", capa:"Pensão acaba aos 18?", kw:["pensão alimentícia","18 anos","maioridade","exoneração","faculdade","universitário"],
 publico:"Pais que pagam pensão e filhos que estão fazendo 18 anos", objetivo:"Desfazer mito",
 ganchos:["Seu filho fez 18 anos. Você já pode parar de pagar a pensão? Cuidado.","A pensão não acaba sozinha na maioridade. Entenda.","Filho na faculdade continua tendo direito à pensão?"],
 pontos:["A pensão não termina automaticamente quando o filho faz 18 anos.","Para deixar de pagar, é preciso pedir a exoneração na Justiça, e o filho tem o direito de se manifestar.","Se o filho ainda estuda, como em curso técnico ou faculdade, a pensão costuma ser mantida por mais tempo, conforme o caso.","Parar de pagar por conta própria pode gerar dívida e cobrança."],
 mito:["Fez 18 anos, acabou a pensão.","É preciso decisão judicial. A maioridade não encerra a pensão sozinha."],
 erro:"parar de pagar no dia do aniversário de 18 anos sem nenhuma decisão",
 pergunta:"Meu filho fez 18 anos e não estuda. Posso parar de pagar?",
 hipotese:"o Roberto parou de pagar a pensão quando a filha fez 18, mas ela está no primeiro ano da faculdade",
 base:"Súmula 358 do STJ; Código Civil, art. 1.694", conferir:null, tags:["pensaoalimenticia","maioridade","direitodefamilia"]},

{id:"f-revisional", area:"fam", titulo:"Dá para mudar o valor da pensão?", capa:"Revisão de pensão", kw:["pensão alimentícia","revisional","revisão de pensão","aumentar pensão","diminuir pensão","mudar valor"],
 publico:"Quem paga ou recebe pensão e teve mudança na vida financeira", objetivo:"Educar",
 ganchos:["Perdeu o emprego e não consegue pagar a pensão? Existe um caminho.","O custo da criança aumentou. Dá para pedir aumento da pensão?","O valor da pensão não é para sempre. Entenda."],
 pontos:["O valor da pensão pode ser revisto quando muda a situação financeira de quem paga ou de quem recebe.","Pode ser para aumentar, diminuir ou até exonerar, conforme o caso.","Isso é feito por uma ação revisional, ou por acordo homologado.","Enquanto não houver nova decisão, o valor antigo continua valendo.","Por isso, quem perdeu renda deve buscar a revisão logo, e não simplesmente parar de pagar."],
 erro:"reduzir o valor por conta própria, sem acordo ou decisão",
 pergunta:"Fui demitido. Posso pagar menos pensão?",
 hipotese:"o Diego foi demitido e passou a ganhar metade do que ganhava quando a pensão foi fixada",
 base:"Código Civil, art. 1.699; Lei 5.478/68, art. 15", conferir:null, tags:["pensaoalimenticia","revisional","direitodefamilia"]},

{id:"f-gravidicos", area:"fam", titulo:"Alimentos gravídicos: pensão durante a gravidez", capa:"Pensão na gravidez existe", kw:["pensão alimentícia","gravídicos","gravidicos","gravidez","gestante","grávida","pensão na gravidez"],
 publico:"Gestantes", objetivo:"Informar direito pouco conhecido",
 ganchos:["Você sabia que a gestante pode pedir pensão antes de o bebê nascer?","Grávida e o pai não ajuda? A lei tem uma resposta.","Alimentos gravídicos: um direito que pouca gente conhece."],
 pontos:["A gestante pode pedir ao suposto pai ajuda com as despesas da gravidez. São os alimentos gravídicos.","Eles cobrem gastos como consultas, exames, alimentação especial, medicamentos e parto.","Não é preciso exame de DNA antes: bastam indícios da paternidade, como mensagens e fotos.","Depois do nascimento, os alimentos gravídicos se convertem em pensão para a criança, até eventual revisão."],
 mito:["Só dá para pedir pensão depois que o bebê nasce.","A lei garante alimentos durante a gravidez."],
 erro:"esperar o bebê nascer para buscar ajuda financeira do pai",
 pergunta:"Estou grávida e o pai não quer ajudar. O que posso fazer?",
 hipotese:"a Bianca está grávida de 4 meses e o namorado sumiu depois da notícia",
 base:"Lei 11.804/2008", conferir:null, tags:["alimentosgravidicos","gestante","direitodefamilia"]},

{id:"f-avos", area:"fam", titulo:"Avós podem ter que pagar pensão?", capa:"Avós pagam pensão?", kw:["pensão alimentícia","avós","avos","avó","avô","pensão avoenga"],
 publico:"Mães, pais e avós", objetivo:"Desfazer mito",
 ganchos:["Os avós podem ser obrigados a pagar pensão? A resposta surpreende.","O pai não paga. Posso cobrar dos avós?","Pensão dos avós: quando é possível."],
 pontos:["Os avós podem ser chamados a ajudar no sustento dos netos, mas de forma complementar.","Isso acontece quando os pais não conseguem pagar, ou pagam menos do que o necessário.","Não é uma troca automática: primeiro se analisa a situação dos pais.","A condição financeira dos avós também é considerada."],
 mito:["Se o pai não paga, os avós pagam no lugar dele automaticamente.","A obrigação dos avós é complementar e depende de análise."],
 erro:"cobrar os avós sem antes demonstrar que os pais não conseguem arcar",
 pergunta:"O pai do meu filho não paga. Posso cobrar dos avós?",
 hipotese:"o pai da Sofia está desempregado há um ano e os avós paternos têm boa condição",
 base:"Código Civil, arts. 1.696 e 1.698; Súmula 596 do STJ", conferir:null, tags:["pensaoalimenticia","avos","direitodefamilia"]},

{id:"f-guarda-comp", area:"fam", titulo:"Guarda compartilhada não é dividir a semana ao meio", capa:"Guarda compartilhada de verdade", kw:["guarda compartilhada","guarda","filhos","separação"],
 publico:"Pais e mães separados ou se separando", objetivo:"Educar e gerar compartilhamentos",
 ganchos:["Guarda compartilhada não significa a criança ficar metade do tempo em cada casa.","Você sabe qual é a regra geral de guarda no Brasil?","Guarda compartilhada: o que ela significa na prática."],
 pontos:["No Brasil, a guarda compartilhada é a regra geral quando os dois pais estão aptos.","Ela significa dividir as responsabilidades e as decisões importantes sobre a vida do filho, como escola e saúde.","Não quer dizer, necessariamente, dividir o tempo igualmente. A criança pode ter uma casa de referência.","Ela não é aplicada quando um dos pais declara que não quer a guarda ou quando há risco de violência doméstica ou familiar.","O foco é sempre o melhor interesse da criança."],
 mito:["Na guarda compartilhada a criança mora uma semana em cada casa.","Compartilha-se a responsabilidade. A convivência é definida conforme o caso."],
 erro:"confundir guarda compartilhada com alternância de casas",
 pergunta:"Guarda compartilhada quer dizer que meu filho vai morar metade do tempo com o pai?",
 hipotese:"a Luana e o Tiago se separaram, moram em bairros diferentes e a filha tem 5 anos",
 base:"Código Civil, arts. 1.583 e 1.584, § 2º; Lei 13.058/2014; Lei 14.713/2023", conferir:null, tags:["guardacompartilhada","guarda","direitodefamilia","parentalidade"]},

{id:"f-guarda-pensao", area:"fam", titulo:"Guarda compartilhada tem pensão?", capa:"Compartilhada tem pensão?", kw:["pensão alimentícia","guarda compartilhada pensão","pensão na guarda compartilhada"],
 publico:"Pais separados", objetivo:"Desfazer mito",
 ganchos:["Guarda compartilhada acaba com a pensão? Não necessariamente.","Esse é um dos mitos mais comuns do Direito de Família.","Se a guarda é compartilhada, quem paga as despesas?"],
 pontos:["A guarda compartilhada não elimina, por si só, a pensão alimentícia.","Se a criança mora mais com um dos pais, o outro costuma contribuir com pensão.","O que se busca é que os dois arquem com o sustento, na proporção das suas condições.","Cada caso é analisado conforme a rotina da criança e a renda de cada um."],
 mito:["Com guarda compartilhada ninguém paga pensão.","A pensão pode existir normalmente."],
 erro:"pedir guarda compartilhada achando que isso vai acabar com a pensão",
 pergunta:"Pedi guarda compartilhada. Vou parar de pagar pensão?",
 hipotese:"o André tem guarda compartilhada, mas o filho mora com a mãe durante a semana",
 base:"Código Civil, arts. 1.583, 1.694 e 1.703", conferir:null, tags:["guardacompartilhada","pensaoalimenticia","direitodefamilia"]},

{id:"f-convivencia", area:"fam", titulo:"Convivência com os filhos é direito da criança", capa:"Visitas são direito de quem?", kw:["visita","visitas","convivência","convivencia","regulamentação","fim de semana"],
 publico:"Pais e mães separados", objetivo:"Construir autoridade e acolher",
 ganchos:["As visitas não são um favor para o pai ou para a mãe. São um direito da criança.","Não paga pensão, então não vê o filho? Não é assim que funciona.","Como funciona a regulamentação de convivência com os filhos."],
 pontos:["A convivência com os dois pais é um direito da criança, não um prêmio para o adulto.","Ela pode ser organizada por acordo ou definida na Justiça, com dias, horários, férias e datas especiais.","Pensão e convivência são assuntos separados: atraso na pensão não autoriza impedir visitas.","Dificultar sem motivo a convivência pode ser considerado ato de alienação parental.","Em situações de risco à criança, a convivência pode ser ajustada para proteger o filho."],
 mito:["Se não paga pensão, não pode ver o filho.","Pensão e convivência não se misturam."],
 erro:"usar a criança como moeda de troca entre os adultos",
 pergunta:"O pai não paga pensão. Posso proibir as visitas?",
 hipotese:"a mãe do Davi impede as visitas porque o pai atrasou a pensão",
 base:"Código Civil, art. 1.589; ECA, art. 19; Lei 12.318/2010", conferir:null, tags:["convivenciafamiliar","guarda","direitodefamilia","parentalidade"]},

{id:"f-divorcio", area:"fam", titulo:"Divórcio: não precisa de motivo nem da concordância do outro", capa:"Ninguém é obrigado a ficar casado", kw:["divórcio","divorcio","separação","separar","cartório","divórcio em cartório"],
 publico:"Pessoas casadas pensando em se separar", objetivo:"Educar",
 ganchos:["Ele não quer assinar o divórcio. E agora?","Divórcio em cartório: quando é possível.","Você não precisa de um motivo para pedir o divórcio."],
 pontos:["O divórcio é um direito: não é preciso apresentar motivo nem ter a concordância do outro.","Quando há acordo, ele pode ser feito em cartório, sempre com advogado.","Se houver filhos menores ou incapazes, o cartório só é possível se as questões dos filhos, como guarda e pensão, já tiverem sido resolvidas na Justiça.","Sem acordo, o divórcio é pedido na Justiça, e ninguém pode ser forçado a continuar casado.","Partilha de bens, pensão e guarda podem ser resolvidas junto ou depois."],
 mudanca:"desde a Resolução 571/2024 do CNJ, é possível fazer o divórcio em cartório mesmo com filhos menores, se as questões dos filhos já estiverem resolvidas judicialmente",
 mito:["Se um não quiser, o divórcio não sai.","Não é preciso concordância. O divórcio pode ser pedido na Justiça."],
 erro:"sair de casa e deixar tudo sem formalizar por anos",
 pergunta:"Meu marido não aceita o divórcio. Eu consigo me divorciar mesmo assim?",
 hipotese:"a Patrícia está separada de fato há 3 anos, mas nunca formalizou o divórcio",
 base:"CF, art. 226, § 6º (EC 66/2010); CPC, art. 733; Resolução CNJ 35/2007, alterada pela Resolução CNJ 571/2024", conferir:null, tags:["divorcio","divorcioextrajudicial","direitodefamilia"]},

{id:"f-partilha", area:"fam", titulo:"Divórcio e divisão de bens: o que entra na partilha", capa:"Divórcio: o que se divide?", kw:["partilha","bens","comunhão parcial","regime de bens","casa","herança"],
 publico:"Pessoas casadas ou em união estável", objetivo:"Educar",
 ganchos:["No divórcio, tudo é dividido meio a meio? Nem sempre.","Herança entra na divisão de bens do divórcio?","Você sabe qual é o seu regime de bens?"],
 pontos:["O que é dividido no divórcio depende do regime de bens do casamento.","O regime mais comum é a comunhão parcial, que vale quando o casal não escolhe outro.","Na comunhão parcial, em regra, divide-se o que foi comprado durante o casamento.","Bens que cada um já tinha antes, e o que recebeu por herança ou doação, em regra não entram.","Dívidas feitas em benefício da família também podem entrar na conta."],
 mito:["Herança recebida durante o casamento é dividida no divórcio.","Na comunhão parcial, herança e doação, em regra, ficam de fora."],
 erro:"não guardar documentos que mostram quando e como cada bem foi adquirido",
 pergunta:"Ganhei uma casa de herança durante o casamento. Ela entra na partilha?",
 hipotese:"o casal comprou um carro durante o casamento e a esposa herdou um terreno do pai",
 base:"Código Civil, arts. 1.640, 1.658 e 1.659", conferir:null, tags:["partilhadebens","divorcio","regimedebens"]},

{id:"f-uniao", area:"fam", titulo:"União estável: o que é e o que garante", capa:"União estável tem direitos?", kw:["união estável","uniao estavel","morar junto","companheiro","companheira","juntado"],
 publico:"Casais que vivem juntos sem casamento", objetivo:"Educar e gerar compartilhamentos",
 ganchos:["Mora junto há anos? Você pode estar em união estável sem saber.","União estável precisa de tempo mínimo? Não.","Juntado tem os mesmos direitos de casado? Vamos falar disso."],
 pontos:["União estável é a convivência pública, contínua e duradoura com o objetivo de constituir família.","A lei não exige tempo mínimo nem que o casal more na mesma casa.","Se o casal não fizer contrato, vale a comunhão parcial de bens, como no casamento.","Uma escritura em cartório facilita muito a prova da união, por exemplo para pensão por morte ou partilha.","Ela também pode ser convertida em casamento."],
 mito:["União estável só existe depois de 5 anos juntos.","Não há prazo mínimo na lei."],
 erro:"não ter nenhum documento que comprove a união e precisar provar tudo depois",

const ccTema = id => CC_TEMAS.find(t => t.id===id);
function ccSemPonto(s){ return String(s||"").trim().replace(/[.!?]+$/,""); }
function ccMinusc(s){ s = String(s||""); return s ? s[0].toLowerCase()+s.slice(1) : s; }
function ccPalavras(s){ return String(s||"").trim().split(/\s+/).filter(Boolean).length; }
function ccResumoTela(frase){ // texto curto para a tela
  let s = ccSemPonto(frase).replace(/^(Em regra|Hoje|Mas|E|Também|Por isso|Fora isso|Desde|Para o|Para a)(,\s*|\s+)/i,"");
  s = s.split(/[,:;](?![^()]*\))/)[0];
  let p = s.split(/\s+/); if(p.length > 8){ p = p.slice(0,7); while(p.length > 3 && /^(que|de|do|da|dos|das|a|o|os|as|e|nem|para|por|com|em|no|na|nos|nas|um|uma|se|ou|ao|à|é|mais|seu|sua)$/i.test(p[p.length-1])) p.pop(); s = p.join(" ")+"…"; }
  return s.replace(/^./, c => c.toUpperCase());
}
function ccFormatosDoTema(t){
  if(t.area==="bast") return ["bastidores","posicionamento"];
  const f = ["educativo","pr","direitos","duvidas","orientacao"];
  if(t.mito) f.push("mitos"); if(t.erro) f.push("erros"); if(t.hipotese) f.push("hipotetica"); if(t.mudanca) f.push("mudanca");
  return f;
}
function ccRand(arr, semente){ return arr[Math.abs(semente||0) % arr.length]; }

/* Roteiro de vídeo por formato */
function ccMontarRoteiro(t, formato, v){
  v = v || 0; const cenas = CC_CENAS[t.area] || CC_CENAS.bast; const B = [];
  const add = (parte, fala, tela, i) => B.push({parte, fala, tela: tela===undefined ? ccResumoTela(fala) : tela, cena: cenas[(i+v) % cenas.length]});
  const pts = t.pontos.slice();
  const gancho = t.ganchos[v % t.ganchos.length];
  if(t.area==="bast"){
    add("Gancho", gancho, t.capa, 0);
    (t.cenas||[]).forEach((c, i) => { if(pts[i]) B.push({parte:"Cena "+(i+1), fala:pts[i], tela:"", cena:c}); });
    pts.slice((t.cenas||[]).length).forEach((p, i) => add("Desenvolvimento", p, "", i+1));
    add("Fechamento", formato==="posicionamento" ? "É assim que eu acredito que o trabalho deve ser feito: com clareza, cuidado e verdade." : "Esse foi um pouquinho dos meus bastidores.", "", 3);
    return B;
  }
  const tit = ccMinusc(t.titulo.split(":")[0]);
  switch(formato){
    case "pr":
      add("Gancho", `Uma pergunta que eu escuto muito: ${t.pergunta}`, t.pergunta, 0);
      add("Resposta curta", pts[0], undefined, 1); pts.slice(1,4).forEach((p,i) => add("Explicação", p, undefined, i+2)); break;
    case "mitos":
      add("Gancho", `Mito ou verdade: ${ccMinusc(ccSemPonto(t.mito[0]))}?`, "MITO OU VERDADE?", 0);
      add("Revelação", `Mito. ${t.mito[1]}`, "MITO", 1); pts.slice(0,3).forEach((p,i) => add("Explicação", p, undefined, i+2)); break;
    case "erros":
      add("Gancho", `Um erro muito comum quando o assunto é ${tit}: ${t.erro}.`, "ERRO COMUM", 0);
      add("Por que é um problema", pts[0], undefined, 1); pts.slice(1,4).forEach((p,i) => add("Como evitar", p, undefined, i+2)); break;
    case "direitos":
      add("Gancho", `Pouca gente sabe disso: ${ccMinusc(pts[0])}`, "VOCÊ SABIA?", 0); pts.slice(1,4).forEach((p,i) => add("Desenvolvimento", p, undefined, i+1)); break;
    case "mudanca":
      add("Gancho", `Atenção: ${t.mudanca}.`, "O QUE MUDOU", 0); pts.slice(0,4).forEach((p,i) => add("O que você precisa saber", p, undefined, i+1)); break;
    case "duvidas":
      add("Gancho", `As dúvidas que mais aparecem sobre ${tit}.`, "DÚVIDAS FREQUENTES", 0);
      add("Dúvida 1", `${t.pergunta} ${pts[0]}`, t.pergunta, 1);
      if(t.mito) add("Dúvida 2", `${t.mito[0].replace(/\.$/,"")}? ${t.mito[1]}`, ccResumoTela(t.mito[0])+"?", 2);
      if(pts[2]) add("Dúvida 3", pts[2], undefined, 3); break;
    case "hipotetica":
      add("Gancho", `Imagina a seguinte situação: ${t.hipotese}. O que acontece?`, "IMAGINA ESSA SITUAÇÃO", 0);
      pts.slice(0,3).forEach((p,i) => add("O que a lei diz", p, undefined, i+1));
      add("Conclusão", "Por isso, cada situação precisa ser analisada com calma, olhando os documentos.", "", 4); break;
    case "orientacao":
      add("Gancho", gancho, t.capa, 0); add("Contexto", `Se você é ${ccMinusc(t.publico)}, presta atenção nesses pontos.`, "", 1);
      pts.slice(0,4).forEach((p,i) => add(`Passo ${i+1}`, p, `${i+1}. ${ccResumoTela(p)}`, i+2)); break;
    default: // educativo
      add("Gancho", gancho, t.capa, 0); pts.slice(0,4).forEach((p,i) => add("Desenvolvimento", p, undefined, i+1));
  }
  add("Fechamento", "Lembrando: cada caso tem os seus detalhes. Por isso, informação de qualidade faz toda a diferença.", "", 5);
  return B;
}
function ccDuracao(blocos){ const w = blocos.reduce((s,b) => s + ccPalavras(b.fala), 0); return Math.max(15, Math.round(w / 2.6)); }
function ccHashtags(t, extra){ const base = [...(CC_HASH_BASE[t.area]||[]), ...(t.tags||[]), ...(extra||[]), ...CC_HASH_LOCAL]; return [...new Set(base)].slice(0, 12).map(h => "#"+h).join(" "); }
function ccCta(t, formato, v){ if(t.area==="bast") return CC_CTAS.bast; const op = [CC_CTAS.salvar, CC_CTAS.compartilhar, CC_CTAS.comentar, CC_CTAS.seguir]; return op[(v + (formato==="mitos"?1:0)) % op.length]; }

/* Busca de temas por palavras-chave */
function ccNormal(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }
function ccBuscarTemas(q, area){
  const n = ccNormal(q); if(!n.trim()) return [];
  const pal = n.split(/[^a-z0-9%]+/).filter(w => w.length > 2 && !["sobre","para","como","que","uma","dos","das","com","video","videos","conteudo","conteudos","roteiro","roteiros","quando","quem","qual","meu","minha","seu","sua","ter","tem","pode","nao"].includes(w));
  const r = CC_TEMAS.filter(t => !t.id.startsWith("__") && (!area || t.area===area)).map(t => {
    const alvo = ccNormal([t.titulo, ...(t.kw||[])].join(" | ")); let sc = 0, frase = false, achou = 0;
    const temPal = (txt, w) => new RegExp("(^|[^a-z0-9])" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).test(txt);
    (t.kw||[]).forEach(k => { const nk = ccNormal(k); if(nk.length > 3 && temPal(n, nk)){ sc += 5; if(nk.includes(" ") || nk.includes("-") || nk.length > 6) frase = true; } });
    pal.forEach(w => { if(temPal(alvo, w)){ sc += 1; achou++; } });
    const cobertura = pal.length ? achou / pal.length : 0;
    return {t, sc, ok: frase || cobertura >= 0.5};
  }).filter(x => x.sc > 0 && x.ok).sort((a,b) => b.sc - a.sc);
  if(!r.length) return [];
  const areaTop = r[0].t.area; return r.filter(x => x.t.area===areaTop).map(x => x.t);
}

function ccSegunda(d){ const w = diaSemana(d); return addDias(d, w===0 ? -6 : 1-w); }
function ccPlanejarSemana(segunda, opc){
  opc = opc || {}; const cfg = ccCfg(), m = cfg.metas, hoje = hojeStr(); const criados = [];
  const dias = Array.from({length:7}, (_, i) => addDias(segunda, i));
  const futuros = dias.filter(d => d >= hoje); if(!futuros.length) return {criados, msg:"Essa semana já passou."};
  let gravDia = dias.find(d => cfg.diasGravacao.includes(diaSemana(d)) && d >= hoje) || futuros[0];
  const usados = new Set();
  // equilíbrio entre áreas: vídeos alternam Previdenciário / Família / Bastidores
  const semanaN = Math.floor(toUTC(segunda) / (7*86400000));
  const seq = semanaN % 2 ? ["fam","prev","bast","fam","prev","prev","fam"] : ["prev","fam","bast","prev","fam","fam","prev"];
  // dias de publicação de vídeos: distribui depois da gravação
  const posGrav = dias.filter(d => d > gravDia); const pubDias = [];
  const prefer = [1,3,5,2,4,6,0]; // ter, qui, sáb, qua, sex, dom, seg (offset na semana)
  for(const off of prefer){ const d = addDias(segunda, off); if(d > gravDia && pubDias.length < m.videos) pubDias.push(d); }
  while(pubDias.length < m.videos) pubDias.push(posGrav[pubDias.length % Math.max(1,posGrav.length)] || addDias(gravDia, 1+pubDias.length));
  pubDias.sort();
  for(let i=0;i<m.videos;i++){
    const t = ccProximoTema(seq[i % seq.length], usados); usados.add(t.id);
    const it = ccGerarVideo(t.id, ccProximoFormato(t), {variacao: Math.floor(Math.random()*3)});
    it.dataPrevista = pubDias[i]; it.hora = cfg.horarios.reels; it.gravacaoData = gravDia; it.planoSemana = segunda;
    ccDB().itens.push(it); criados.push(it);
    ccTarefa(gravDia, `Gravar vídeo: ${it.titulo}`, {itemId:it.id, acao:"gravar", plano:segunda});
  }
  if(m.videos) ccTarefa(addDias(gravDia,1) <= dias[6] ? addDias(gravDia,1) : gravDia, "Enviar e editar os vídeos gravados", {acao:"editar", plano:segunda});
  const carroDias = [2,4,0].map(o => addDias(segunda, o)).filter(d => d >= hoje);
  const feedDiario = ccFeedAtivo(); // com o feed diário planejado, a semana cuida só de vídeos e stories
  for(let i=0;i<(feedDiario?0:m.carrosseis);i++){
    const area = (semanaN + i) % 2 ? "fam" : "prev"; const t = ccProximoTema(area, usados); usados.add(t.id);
    const it = ccGerarCarrossel(t.id, {variacao:i}); it.dataPrevista = carroDias[i % Math.max(1,carroDias.length)] || futuros[futuros.length-1]; it.hora = cfg.horarios.feed; it.planoSemana = segunda;
    ccDB().itens.push(it); criados.push(it);
    ccTarefa(addDias(it.dataPrevista, -1) >= hoje ? addDias(it.dataPrevista, -1) : hoje, `Aprovar carrossel: ${it.titulo}`, {itemId:it.id, acao:"aprovar", plano:segunda});
  }
  for(let i=0;i<(feedDiario?0:m.posts);i++){
    const t = ccProximoTema(i%2?"fam":"prev", usados); usados.add(t.id);
    const it = ccGerarPost(t.id, {variacao:i}); it.dataPrevista = futuros[Math.min(futuros.length-1, 4)] || futuros[0]; it.hora = cfg.horarios.feed; it.planoSemana = segunda;
    ccDB().itens.push(it); criados.push(it); ccTarefa(addDias(it.dataPrevista,-1) >= hoje ? addDias(it.dataPrevista,-1) : hoje, `Aprovar post: ${it.titulo}`, {itemId:it.id, acao:"aprovar", plano:segunda});
  }
  const objs = ["rotina","juridico","bastidores","duvidas","organizacao","proximidade","divulgar"];
  const stDias = [0,2,4,1,3,5,6].map(o => addDias(segunda, o)).filter(d => d >= hoje).slice(0, m.stories).sort();
  stDias.forEach((d, i) => { const it = ccGerarStories(objs[(semanaN + i) % objs.length], d); it.planoSemana = segunda; ccDB().itens.push(it); criados.push(it);
    ccTarefa(d, `Fazer stories: ${it.titulo.toLowerCase()}`, {itemId:it.id, acao:"stories", plano:segunda}); });
  const rev = dias.filter(d => d >= hoje && diaSemana(d)===5)[0] || futuros[futuros.length-1];
  ccTarefa(rev, "Revisar a programação da semana que vem", {acao:"revisar", plano:segunda});
  registrar("conteúdo", `Semana de ${fmtData(segunda)} planejada: ${criados.length} conteúdo(s)`);
  salvar(); return {criados, gravDia};
}
function ccSemanaJaPlanejada(segunda){ return ccDB().itens.filter(i => i.planoSemana===segunda).length; }
function ccPlanejarMes(ano, mes){
  let d = `${ano}-${pad(mes)}-01`; const fim = addDias(`${mes===12?ano+1:ano}-${pad(mes===12?1:mes+1)}-01`, -1); let seg = ccSegunda(d); const res = [];
  while(seg <= fim){ if(addDias(seg,6) >= hojeStr() && !ccSemanaJaPlanejada(seg)) res.push(ccPlanejarSemana(seg)); seg = addDias(seg, 7); }
  return res;
}

/* ---------- Sugestão de horários ---------- */
function ccSugestaoHorarios(){
  const pub = ccDB().itens.filter(i => i.status==="publicado" && i.metricas && (i.metricas.alcance || i.metricas.views) && i.dataPrevista && i.hora);
  if(pub.length < 8) return {base:false, n:pub.length, texto:`Sugestões iniciais (não comprovadas): Reels e TikTok entre 18h e 20h; carrosséis no horário de almoço; stories ao longo do dia. Com pelo menos 8 publicações com métricas, o sistema passa a sugerir a partir dos seus próprios resultados.`};
  const g = {};
  pub.forEach(i => { const k = `${DSEM[diaSemana(i.dataPrevista)]} · ${i.hora.slice(0,2)}h`; const e = ccEngaj(i.metricas); (g[k] = g[k] || []).push(e); });
  const ord = Object.entries(g).map(([k, v]) => ({k, n:v.length, med:v.reduce((s,x)=>s+x,0)/v.length})).filter(x => x.n >= 2).sort((a,b) => b.med - a.med);
  return {base:true, n:pub.length, ranking:ord.slice(0,5), texto: ord.length ? `Com base em ${pub.length} publicações suas, os melhores horários até agora: ${ord.slice(0,3).map(x => `${x.k} (${(x.med*100).toFixed(1)}% de engajamento, ${x.n} posts)`).join("; ")}.` : "Ainda não há repetições suficientes de dia e horário para comparar."};
}
function ccEngaj(m){ const base = Number(m.alcance)||Number(m.views)||0; if(!base) return 0; return ((+m.curtidas||0)+(+m.comentarios||0)+(+m.compartilhamentos||0)+(+m.salvamentos||0))/base; }

/* ---------- Arquivos (vídeos e imagens) cifrados ---------- */
async function ccGuardarArquivo(id, buf){ const c = await cifrarBytes(CHAVE, buf); await ARM.put("arquivos", id, {iv:c.iv, ct:c.ct}); }
async function ccLerArquivo(id, mime){ const r = await ARM.get("arquivos", id); if(!r) return null; const buf = await decifrarBytes(CHAVE, r.iv, r.ct); return new Blob([buf], {type:mime||"application/octet-stream"}); }
const CC_URLS = new Map();
async function ccUrl(id, mime){ if(CC_URLS.has(id)) return CC_URLS.get(id); const b = await ccLerArquivo(id, mime); if(!b) return null; const u = URL.createObjectURL(b); CC_URLS.set(id, u); return u; }
function ccIdsVideo(){ const s = new Set(); ccDB()?.midias?.forEach(m => { if(m.tipo==="video") s.add(m.id); (m.renders||[]).forEach(r => s.add(r.id)); }); return s; }
async function ccApagarArquivo(id){ try{ await ARM.del("arquivos", id); }catch(e){} if(CC_URLS.has(id)){ URL.revokeObjectURL(CC_URLS.get(id)); CC_URLS.delete(id); } }

function ccProximasDatas(dias){

}

function ccTeleprompter(i){
  const txt = i.roteiro.map(b => b.fala).join("\n\n");
  const f = document.createElement("div"); f.className = "cc-tp";
  f.innerHTML = `<div class="cc-tp-barra"><b>${esc(i.titulo)}</b><span><label>Velocidade <input type="range" min="10" max="120" value="40" id="tp-vel"></label><label>Tamanho <input type="range" min="28" max="72" value="44" id="tp-tam"></label>
    <label class="chk" style="color:inherit"><input type="checkbox" id="tp-esp"> Espelhar</label><button class="btn btn-sm btn-ouro" id="tp-play">Iniciar</button><button class="btn btn-sm" id="tp-fim">Fechar</button></span></div>
    <div class="cc-tp-texto" id="tp-txt"><div style="height:40vh"></div>${esc(txt).replace(/\n/g,"<br>")}<div style="height:70vh"></div></div>`;
  document.body.appendChild(f);
  const box = f.querySelector("#tp-txt"); let rodando = false, ult = 0, acum = 0;
  const passo = ts => { if(!rodando) return; if(ult){ acum += (ts-ult)/1000 * Number(f.querySelector("#tp-vel").value); const n = Math.floor(acum); if(n){ box.scrollTop += n; acum -= n; } } ult = ts; requestAnimationFrame(passo); };
  f.querySelector("#tp-play").onclick = e => { rodando = !rodando; e.target.textContent = rodando ? "Pausar" : "Continuar"; ult = 0; if(rodando) requestAnimationFrame(passo); };
  f.querySelector("#tp-tam").oninput = e => box.style.fontSize = e.target.value+"px";
  f.querySelector("#tp-esp").onchange = e => box.style.transform = e.target.checked ? "scaleX(-1)" : "";
  const fechar = () => { rodando = false; f.remove(); document.removeEventListener("keydown", tecla); };
  const tecla = e => { if(e.key==="Escape") fechar(); if(e.key===" "){ e.preventDefault(); f.querySelector("#tp-play").click(); } };
  f.querySelector("#tp-fim").onclick = fechar; document.addEventListener("keydown", tecla);
}

async function ccEnviarVideo(file, itemId){
  if(!file || !/^video\//.test(file.type||"video/")) return toast("Escolha um arquivo de vídeo.", true);
  toast("Guardando o vídeo com segurança…");
  const meta = await ccMetaVideo(file);
  const m = {id:uid(), tipo:"video", nome:file.name, tamanho:file.size, mime:file.type||"video/mp4", duracao:meta.duracao, largura:meta.w, altura:meta.h, itemId:itemId||null,
    assunto: itemId ? ccItem(itemId)?.area : "", criado:new Date().toISOString(), edicao:null, renders:[]};
  try{ await ccGuardarArquivo(m.id, await file.arrayBuffer()); }
  catch(e){ toast("Não foi possível guardar o vídeo (espaço insuficiente?). "+(e.message||""), true); return null; }
  ccDB().midias.push(m);
  if(itemId){ const it = ccItem(itemId); if(it){ if(it.midiaId && it.midiaId!==m.id) it.midiasAnteriores = [...(it.midiasAnteriores||[]), it.midiaId]; it.midiaId = m.id; ccMudarStatus(it, "enviado", m.nome); ccConcluirTarefas(it, "gravar"); } }
  try{ navigator.storage?.persist?.(); }catch(e){}
  registrar("conteúdo", `Vídeo enviado: ${m.nome} (${fmtTam(m.tamanho)})`); salvar(); toast("Vídeo enviado."); return m;
}
function ccMetaVideo(blob){
  return new Promise(res => { const v = document.createElement("video"); v.preload = "metadata"; v.muted = true;
    const u = URL.createObjectURL(blob); const fim = r => { URL.revokeObjectURL(u); res(r); };
    v.onloadedmetadata = () => fim({duracao:isFinite(v.duration)?v.duration:0, w:v.videoWidth, h:v.videoHeight}); v.onerror = () => fim({duracao:0, w:0, h:0}); v.src = u; setTimeout(() => fim({duracao:0,w:0,h:0}), 15000); });
}
function ccFmtT(s){ s = Math.max(0, s||0); const m = Math.floor(s/60), r = s - m*60; return `${m}:${r.toFixed(1).padStart(4,"0")}`; }

    const l = ms.filter(m => !filtro || (filtro==="sem" ? !m.itemId : (ccItem(m.itemId)?.area||m.assunto)===filtro));
    c.innerHTML = `<div class="cartao cc-upload"><h3>Enviar vídeos gravados</h3>

      <div class="largo"><button class="btn btn-pri">Enviar</button> <span class="sub">Os vídeos ficam cifrados neste computador. Nada é enviado para a internet.</span></div></form></div>

    <div class="cartao">${l.length ? l.map(m => { const it = ccItem(m.itemId); return `<div class="cc-linha"><div class="cc-tipo cc-t-video">VÍDEO</div>
