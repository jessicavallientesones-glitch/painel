      <div class="barra-acoes" style="margin:0">${it ? ccPill(it.status) : `<select data-vinc="${m.id}" class="btn-sm"><option value="">Vincular a…</option>${semVideo.map(i => `<option value="${i.id}">${esc(i.titulo)}</option>`).join("")}</select>`}
      <button class="btn btn-sm btn-pri" data-ed="${m.id}">Editar</button><button class="btn btn-sm" data-bx="${m.id}">Baixar</button><button class="btn btn-sm btn-perigo" data-del="${m.id}">Excluir</button></div></div>`; }).join("")
      : `<div class="vazio">Nenhum vídeo enviado ainda.</div>`}</div>
    <p class="sub">Cada vídeo ocupa espaço neste computador. Vídeos não entram no backup automático (para não gerar arquivos enormes); ative em Integrações se quiser incluí-los.</p>`;
    c.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { filtro = b.dataset.f; desenhar(); });
    $("#cc-f-up").onsubmit = async e => { e.preventDefault(); const fs = [...e.target.arq.files]; const it = e.target.item.value; for(let k=0;k<fs.length;k++){ const m = await ccEnviarVideo(fs[k], k===0 ? it : null); if(m) ms.unshift(m); } ccRerender(); };
    c.querySelectorAll("[data-ed]").forEach(b => b.onclick = () => ir("conteudo-edicao-"+b.dataset.ed));
    c.querySelectorAll("[data-bx]").forEach(b => b.onclick = async () => { const m = ccMidia(b.dataset.bx); salvarArquivo(m.nome, await ccLerArquivo(m.id, m.mime), m.mime); });
    c.querySelectorAll("[data-vinc]").forEach(s => s.onchange = () => { if(!s.value) return; const m = ccMidia(s.dataset.vinc), it = ccItem(s.value); m.itemId = it.id; m.assunto = it.area; it.midiaId = m.id; ccMudarStatus(it, "enviado", m.nome); salvar(); toast("Vídeo vinculado."); ccRerender(); });
    c.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => { const m = ccMidia(b.dataset.del);
      if(!(await confirmar("Excluir vídeo", `Excluir "${esc(m.nome)}" e as versões editadas? Esta ação não pode ser desfeita.`, "Excluir", true))) return;
      await ccApagarArquivo(m.id); for(const r of m.renders||[]) await ccApagarArquivo(r.id);
      ccDB().midias = ccDB().midias.filter(x => x.id!==m.id); ccDB().itens.forEach(i => { if(i.midiaId===m.id){ i.midiaId = null; if(["enviado","edicao","aprovacao"].includes(i.status)) ccMudarStatus(i, "gravar", "Vídeo excluído"); } });
      registrar("conteúdo", `Vídeo excluído: ${m.nome}`); salvar(); ccRerender(); });
  };
  desenhar();
}

const CC_AUDIO = new Map(); // análise em memória por mídia
function ccEdicaoPadrao(m){

}
async function ccEditor(c, midiaId){
  const m = ccMidia(midiaId); if(!m){ c.innerHTML = `<div class="vazio">Vídeo não encontrado. <a href="#conteudo-edicao">Voltar</a></div>`; return; }

  m.edicao = m.edicao || ccEdicaoPadrao(m); const ed = m.edicao; const it = ccItem(m.itemId);

  <div class="cc-editor">
    <div class="cc-ed-prev">

      <div class="barra-acoes" style="margin-top:8px"><label class="chk"><input type="checkbox" id="ed-pular" checked> Pular os cortes na reprodução</label><button class="btn btn-sm" id="ed-play">▶ Reproduzir resultado</button></div>
      <canvas id="ed-onda" class="cc-onda" width="1200" height="110"></canvas>
      <div class="sub" id="ed-info"></div>
    </div>
    <div class="cc-ed-ferr">
      <div class="abas" id="ed-abas">${[["cortes","Cortes e pausas"],["legendas","Legendas"],["textos","Títulos na tela"],["visual","Visual e enquadramento"],["exportar","Exportar"]].map(([k,t],n) => `<button data-a="${k}" class="${n?"":"ativo"}">${t}</button>`).join("")}</div>

  const v = $("#ed-v"), cv = $("#ed-c"), cx = cv.getContext("2d"), onda = $("#ed-onda");
  const logo = await ccLogo(); await ccFontes();
  let aba = "cortes";
  const segsManter = () => ed.segmentos.filter(s => s.manter && s.fim - s.ini > 0.05);
  const durFinal = () => segsManter().reduce((s,x) => s + x.fim - x.ini, 0);
  const info = () => { $("#ed-info").textContent = `Duração original ${ccFmtT(m.duracao)} → resultado ${ccFmtT(durFinal())} · ${ed.segmentos.filter(s=>!s.manter).length} trecho(s) cortado(s) · ${ed.legendas.length} legenda(s)`; };
  const desenhaPrevia = () => { ccDesenharQuadro(cx, cv.width, cv.height, v, v.currentTime, ed, "reels", logo); };
  const desenhaOnda = () => ccDesenharOnda(onda, CC_AUDIO.get(m.id), ed, m.duracao, v.currentTime);
  let raf = 0; const loop = () => { desenhaPrevia(); desenhaOnda();
    if(!v.paused && $("#ed-pular").checked){ const t = v.currentTime; const s = ed.segmentos.find(x => t >= x.ini && t < x.fim); if(s && !s.manter){ const prox = ed.segmentos.find(x => x.manter && x.ini >= s.fim); if(prox) v.currentTime = prox.ini; else v.pause(); } }
    raf = requestAnimationFrame(loop); };
  raf = requestAnimationFrame(loop);

/* ---------- Áudio: energia por janela e segmentação ---------- */
async function ccAnalisarAudio(m){
  const blob = await ccLerArquivo(m.id, m.mime); const buf = await blob.arrayBuffer();
  const AC = window.AudioContext || window.webkitAudioContext; const ac = new AC();
  let ab; try{ ab = await ac.decodeAudioData(buf); } finally { ac.close?.(); }
  const sr = ab.sampleRate, passo = 0.02, n = Math.floor(ab.duration / passo), win = Math.floor(sr*passo);
  const ch = []; for(let k=0;k<ab.numberOfChannels;k++) ch.push(ab.getChannelData(k));

  for(let i=0;i<n;i++){ let s = 0; const o = i*win; for(let j=0;j<win;j++){ let x = 0; for(const c of ch) x += c[o+j]||0; x /= ch.length; s += x*x; } const rms = Math.sqrt(s/win); db[i] = rms > 0 ? 20*Math.log10(rms) : -100; }
  const ord = Array.from(db).sort((a,b) => a-b); const pc = q => ord[Math.min(ord.length-1, Math.floor(q*ord.length))];
  return {db, passo, p10:pc(0.10), p95:pc(0.95), dur:ab.duration};
}
function ccLimiar(a, ajuste){ return Math.max(-60, a.p10 + 0.32*(a.p95 - a.p10)) + (ajuste||0); }
function ccSegmentar(a, an, dur){
  const L = ccLimiar(a, an.ajuste), fala = Array.from(a.db, x => x > L); const P = a.passo;
  // trechos de fala, unindo pausas curtas
  const trechos = []; let ini = -1;
  for(let i=0;i<=fala.length;i++){ if(i<fala.length && fala[i]){ if(ini<0) ini = i; } else if(ini>=0){ trechos.push([ini*P, i*P]); ini = -1; } }
  const unidos = [];
  trechos.forEach(t => { const u = unidos[unidos.length-1]; if(u && t[0] - u[1] < an.minPausa) u[1] = t[1]; else unidos.push(t.slice()); });
  const manter = unidos.filter(t => t[1]-t[0] >= 0.12).map(([i,f]) => [Math.max(0, i - an.margem), Math.min(dur, f + an.margem)]);
  if(!manter.length) return [{ini:0, fim:dur, manter:true}];
  const segs = []; let pos = 0;
  manter.forEach(([i,f]) => { if(i > pos + 0.01) segs.push({ini:pos, fim:i, manter:false}); const u = segs[segs.length-1]; if(u && u.manter && i <= u.fim) u.fim = Math.max(u.fim, f); else segs.push({ini:Math.max(pos,i), fim:f, manter:true}); pos = Math.max(pos, f); });
  if(pos < dur - 0.01) segs.push({ini:pos, fim:dur, manter:false});

}
function ccCortarIntervalo(segs, a, b){
  const r = [];

    if(s.fim <= a || s.ini >= b){ r.push({...s}); return; }
    if(s.ini < a) r.push({ini:s.ini, fim:a, manter:s.manter});
    r.push({ini:Math.max(s.ini,a), fim:Math.min(s.fim,b), manter:false});
    if(s.fim > b) r.push({ini:b, fim:s.fim, manter:s.manter});

}
function ccDesenharOnda(cv, a, ed, dur, t){

  if(!dur) return;

  if(a){ const n = a.db.length, L = ccLimiar(a, ed.analise.ajuste); g.fillStyle = "#5A4032";
    for(let x=0;x<W;x++){ const i = Math.floor(x/W*n); const v = Math.max(0, (a.db[i] + 70) / 70); const h = v*H*0.9; g.fillRect(x, (H-h)/2, 1, h); }

/* ---------- Legendas e títulos ---------- */
function ccFrases(txt){
  const palavras = String(txt||"").replace(/\s+/g," ").trim().split(" ").filter(Boolean); const r = []; let cur = [];
  palavras.forEach((w, i) => { cur.push(w); const fimFrase = /[.!?:;]$/.test(w), virg = /,$/.test(w);
    if(cur.length >= 6 || fimFrase || (virg && cur.length >= 3)){ r.push(cur.join(" ")); cur = []; } });
  if(cur.length) r.push(cur.join(" ")); return r;
}
function ccMapaEditado(segs){ const k = segs.filter(s => s.manter); let acc = 0; const m = k.map(s => { const o = {ini:s.ini, fim:s.fim, e0:acc}; acc += s.fim - s.ini; return o; }); return {m, total:acc}; }
function ccEditadoParaOriginal(mapa, te){ for(const s of mapa.m){ if(te <= s.e0 + (s.fim - s.ini) + 1e-6) return {t: s.ini + (te - s.e0), seg:s}; } const u = mapa.m[mapa.m.length-1]; return {t:u ? u.fim : te, seg:u}; }
function ccLegendasDoTexto(txt, segs, dur){
  const fr = ccFrases(txt); if(!fr.length) return [];
  const mapa = ccMapaEditado(segs.length ? segs : [{ini:0, fim:dur, manter:true}]); const T = mapa.total || dur;
  const pesos = fr.map(f => ccPalavras(f) + 0.6), soma = pesos.reduce((s,x)=>s+x,0); let acc = 0;
  return fr.map((f, i) => { const e0 = acc / soma * T; acc += pesos[i]; const e1 = acc / soma * T;
    const a = ccEditadoParaOriginal(mapa, e0 + 0.001), b = ccEditadoParaOriginal(mapa, e1 - 0.001);
    const fim = (a.seg && b.seg !== a.seg) ? a.seg.fim : b.t; return {ini:+a.t.toFixed(2), fim:+Math.max(a.t+0.3, fim).toFixed(2), texto:f.replace(/[,;]$/,"")}; });
}
function ccOverlaysDoRoteiro(it, segs, dur){
  const mapa = ccMapaEditado(segs.length ? segs : [{ini:0, fim:dur, manter:true}]); const T = mapa.total || dur;
  const pesos = it.roteiro.map(b => ccPalavras(b.fala)), soma = pesos.reduce((s,x)=>s+x,0) || 1; let acc = 0; const r = [];
  it.roteiro.forEach((b, i) => { const e0 = acc/soma*T; acc += pesos[i]; if(!b.tela) return; const a = ccEditadoParaOriginal(mapa, e0 + 0.001); r.push({ini:+a.t.toFixed(2), fim:+(a.t + (i===0 ? 3 : 2.5)).toFixed(2), texto:b.tela}); });
  for(let k=0;k<r.length-1;k++) r[k].fim = Math.max(r[k].ini + 0.8, Math.min(r[k].fim, r[k+1].ini));
  return r;
}
function ccDestacar(txt, it){
  if(/\*/.test(txt)) return txt;
  const chaves = ["inss","bpc","loas","direito","direitos","pensão","aposentadoria","guarda","divórcio","mito","verdade","stf","cnis","perícia","prazo","cuidado","atenção","carência","vitalícia"];
  (it?.capa?.texto||"").split(/\s+/).filter(w => w.length > 4).forEach(w => chaves.push(ccNormal(w)));
  return txt.split(" ").map(w => { const n = ccNormal(w).replace(/[^a-z0-9%]/g,""); return (/\d/.test(w) || chaves.includes(n)) ? `*${w.replace(/([.,!?;:]+)$/,"")}*${(w.match(/[.,!?;:]+$/)||[""])[0]}` : w; }).join(" ").replace(/\*\s\*/g," ");
}

/* ---------- Desenho de cada quadro (prévia e exportação) ---------- */
let CC_LOGO = null;
async function ccLogo(){

}
async function ccFontes(){ try{ await Promise.all(['600 40px "Montserrat"','500 40px "Montserrat"','400 40px "Bodoni Moda"','italic 400 40px "Bodoni Moda"','400 40px "Pinyon Script"'].map(f => document.fonts.load(f))); }catch(e){} }
function ccTokens(texto){ const r = []; let dest = false; String(texto||"").split(/(\*)/).forEach(p => { if(p==="*"){ dest = !dest; return; } p.split(/(\s+)/).forEach(w => { if(w && !/^\s+$/.test(w)) r.push({w, d:dest}); }); }); return r; }
function ccQuebrar(g, toks, max){ const linhas = [[]]; let larg = 0; const esp = g.measureText(" ").width;
  toks.forEach(t => { const w = g.measureText(t.w).width; if(larg && larg + esp + w > max){ linhas.push([]); larg = 0; } linhas[linhas.length-1].push({...t, larg:w}); larg += (larg?esp:0) + w; }); return linhas; }

    g.drawImage(v, (W-dw)*ed.enq.x, (H-dh)*ed.enq.y, dw, dh); }

  if(ov){ g.font = `400 ${Math.round(64*k)}px "Bodoni Moda", Georgia, serif`; const linhas = ccQuebrar(g, ccTokens(ov.texto.replace(/\*/g,"")), W*0.8); const lh = 76*k, alt = linhas.length*lh + 56*k, y0 = (plat==="tiktok" ? 170 : 150)*k;
    g.fillStyle = "rgba(90,64,50,.92)"; ccRet(g, W*0.07, y0, W*0.86, alt, 18*k); g.fill(); g.fillStyle = "#B8955F"; g.fillRect(W/2 - 40*k, y0 + alt - 22*k, 80*k, 3*k);
    g.fillStyle = "#F7F2E9"; g.textAlign = "center"; g.textBaseline = "middle"; linhas.forEach((l, n) => g.fillText(l.map(x=>x.w).join(" "), W/2, y0 + 30*k + lh*(n+0.5))); g.textAlign = "left"; }
  // legendas
  const lg = ed.legendas.find(l => t >= l.ini && t < l.fim);
  if(lg){ const tam = Math.round(58*k*(ed.estilo.tamanho||1)); g.font = `600 ${tam}px "Montserrat", Arial, sans-serif`; const linhas = ccQuebrar(g, ccTokens(lg.texto), W*0.84); const lh = tam*1.28;
    let yc = H * (plat==="tiktok" ? Math.min(ed.estilo.pos, 0.66) : ed.estilo.pos); const y0 = yc - (linhas.length*lh)/2; const esp = g.measureText(" ").width;
    if(ed.estilo.legenda==="faixa"){ const lmax = Math.max(...linhas.map(l => l.reduce((s,x)=>s+x.larg,0) + esp*(l.length-1))); g.fillStyle = "rgba(90,64,50,.9)"; ccRet(g, (W-lmax)/2 - 28*k, y0 - 16*k, lmax + 56*k, linhas.length*lh + 32*k, 14*k); g.fill(); }

      l.forEach(tk => { if(ed.estilo.legenda!=="faixa"){ g.strokeStyle = "rgba(43,30,22,.85)"; g.lineWidth = tam*0.16; g.strokeText(tk.w, x, y); }
        g.fillStyle = tk.d ? "#D9C092" : (ed.estilo.legenda==="branco" ? "#FFFFFF" : "#F7F2E9"); g.fillText(tk.w, x, y); x += tk.larg + esp; }); }); }

}
function ccRet(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x+r, y); g.arcTo(x+w, y, x+w, y+h, r); g.arcTo(x+w, y+h, x, y+h, r); g.arcTo(x, y+h, x, y, r); g.arcTo(x, y, x+w, y, r); g.closePath(); }

/* ---------- Exportação real ---------- */
function ccMimeGravacao(){
  if(typeof MediaRecorder === "undefined") return null;
  return ["video/mp4;codecs=avc1.640028,mp4a.40.2","video/mp4;codecs=avc1.4d0028,mp4a.40.2","video/mp4;codecs=avc1.42E028,mp4a.40.2","video/mp4;codecs=avc1,mp4a.40.2","video/mp4;codecs=avc1,mp4a",
    "video/mp4;codecs=avc1.640028,opus","video/mp4;codecs=avc1,opus","video/mp4;codecs=avc1","video/mp4;codecs=vp9,opus","video/mp4","video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"].find(t => MediaRecorder.isTypeSupported(t)) || null;
}
function ccDescreverFormato(mime){
  if(!mime) return {ok:false, txt:"Este navegador não permite gravar vídeo. Use o Google Chrome ou o Microsoft Edge."};
  if(/avc1/.test(mime) && /mp4a/.test(mime)) return {ok:true, txt:"MP4 com vídeo H.264 e áudio AAC: o formato recomendado pelo Instagram e pelo TikTok."};
  if(/avc1/.test(mime)) return {ok:true, aviso:true, txt:"MP4 com vídeo H.264 e áudio Opus. O TikTok aceita; se o Instagram recusar o arquivo, gere pelo Google Chrome ou Edge atualizados no Windows, que gravam áudio AAC."};
  return {ok:true, aviso:true, txt:`${/mp4/.test(mime)?"MP4":"WEBM"} com vídeo VP9. Pode ser recusado pelo Instagram. Use o Google Chrome ou Microsoft Edge atualizados no Windows para gerar H.264.`};
}
async function ccRenderizar(m, plat, qual, prog){

  const segs = ed.segmentos.filter(s => s.manter && s.fim - s.ini > 0.05); if(!segs.length) throw new Error("todos os trechos estão cortados");

  v.style.cssText = "position:fixed;left:-9999px;width:2px;height:2px"; document.body.appendChild(v);
  await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = () => rej(new Error("não foi possível ler o vídeo")); });
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H; const g = cv.getContext("2d"); const logo = await ccLogo(); await ccFontes();
  const AC = window.AudioContext || window.webkitAudioContext; const ac = new AC(); await ac.resume();
  const src = ac.createMediaElementSource(v), dest = ac.createMediaStreamDestination(); src.connect(dest);

      if(!iniciado){ rec.start(500); iniciado = true; } else rec.resume();
      await v.play();
      await new Promise(res => {
        let fim = false; const acabar = () => { if(fim) return; fim = true; v.pause(); clearInterval(tm); res(); };
        const passo = () => { if(fim) return; desenha(); prog(Math.min(1, (feito + Math.max(0, v.currentTime - s.ini))/total), `Exportando… ${ccFmtT(feito + Math.max(0, v.currentTime - s.ini))} de ${ccFmtT(total)}`);
          if(v.currentTime >= s.fim - 0.03 || v.ended) acabar(); else (v.requestVideoFrameCallback ? v.requestVideoFrameCallback(passo) : requestAnimationFrame(passo)); };

}

const CC_PALETA = [["#F7F2E9","Creme"],["#FFFFFF","Branco"],["#EBDDCB","Nude"],["#F3EADD","Nude claro"],["#5A4032","Marrom"],["#47322A","Marrom escuro"],["#3B2B21","Texto"],["#B8955F","Dourado"],["#D9C092","Dourado claro"],["#8F6E3E","Dourado escuro"]];
const CC_TEMAS_VIS = {
  creme:{fundo:"#F7F2E9", texto:"#3B2B21", titulo:"#5A4032", destaque:"#B8955F", nome:"Creme clássico"},
  marrom:{fundo:"#5A4032", texto:"#F7F2E9", titulo:"#F7F2E9", destaque:"#D9C092", nome:"Marrom elegante"},
  nude:{fundo:"#EBDDCB", texto:"#3B2B21", titulo:"#5A4032", destaque:"#8F6E3E", nome:"Nude suave"},
  branco:{fundo:"#FFFFFF", texto:"#3B2B21", titulo:"#5A4032", destaque:"#B8955F", nome:"Branco minimalista"}
};
function ccLum(h){ const n = parseInt(String(h).slice(1),16); const c = [n>>16&255, n>>8&255, n&255].map(v => { v/=255; return v<=.03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); }); return .2126*c[0]+.7152*c[1]+.0722*c[2]; }
function ccCores(i){ const v = i.visual || {tema:"creme"}; return Object.assign({}, CC_TEMAS_VIS[v.tema] || CC_TEMAS_VIS.creme, v.cores || {}); }
const CC_IMGS = new Map();
async function ccImagem(id){ if(CC_IMGS.has(id)) return CC_IMGS.get(id); const meta = ccDB().imagens.find(x => x.id===id); const u = await ccUrl(id, meta?.mime || "image/png"); if(!u) return null; const im = new Image(); im.src = u; try{ await im.decode(); }catch(e){ return null; } CC_IMGS.set(id, im); return im; }
function ccAjustarFonte(g, txt, familia, peso, max, maxAlt, tam, lhFat, minT){
  let t = tam; let linhas;
  while(true){ g.font = `${peso} ${t}px ${familia}`; linhas = ccQuebrar(g, ccTokens(txt), max); if(linhas.length * t * lhFat <= maxAlt || t <= (minT||24)) break; t -= 2; }

}
function ccTexto(g, linhas, x, y, t, lhFat, cor, corDest, alinh, W){
  const esp = g.measureText(" ").width; g.textBaseline = "top";

    l.forEach(k => { g.fillStyle = k.d ? corDest : cor; g.fillText(k.w, xx, y + n*t*lhFat); xx += k.larg + esp; }); });
  return y + linhas.length*t*lhFat;
}
async function ccDesenharSlide(g, W, H, i, idx){
  if(i.design) return ccAtDesenhar(g, W, H, i, idx);

  const BOD = `"Bodoni Moda", Georgia, serif`, MON = `"Montserrat", Arial, sans-serif`;
  g.fillStyle = cor.fundo; g.fillRect(0,0,W,H);
  let corTit = cor.titulo, corTxt = cor.texto, corDest = cor.destaque;
  if(s.imgId){ const im = await ccImagem(s.imgId); if(im){ const e = Math.max(W/im.naturalWidth, H/im.naturalHeight); g.drawImage(im, (W-im.naturalWidth*e)/2, (H-im.naturalHeight*e)/2, im.naturalWidth*e, im.naturalHeight*e);
    const gr = g.createLinearGradient(0, H*0.25, 0, H); gr.addColorStop(0, "rgba(71,50,42,.15)"); gr.addColorStop(1, "rgba(71,50,42,.88)"); g.fillStyle = gr; g.fillRect(0,0,W,H); corTit = "#F7F2E9"; corTxt = "#F7F2E9"; corDest = "#D9C092"; } }
  // moldura fina dourada
  g.strokeStyle = corDest; g.globalAlpha = .55; g.lineWidth = 2*k; g.strokeRect(40*k, 40*k, W-80*k, H-80*k); g.globalAlpha = 1;
  const logo = await ccLogo(); if(logo){ g.drawImage(logo, 80*k, 80*k, 84*k, 84*k); }
  g.font = `500 ${22*k}px ${MON}`; g.fillStyle = corTxt; g.globalAlpha = .75; g.textBaseline = "alphabetic";
  const rod = [cfg.assinatura, cfg.subassinatura].filter(Boolean).join("  ·  "); g.fillText(rod.toUpperCase().split("").join(String.fromCharCode(8202)), 80*k, H - 82*k);
  g.textAlign = "right"; g.fillText(cfg.arroba || "", W - 80*k, H - 82*k); if(total > 1){ g.fillText(`${idx+1}/${total}`, W - 80*k, 130*k); } g.textAlign = "left"; g.globalAlpha = 1;
  const mx = 96*k, larg = W - 2*mx; const papel = s.papel || (idx===0 && total>1 ? "capa" : idx===total-1 && total>1 ? "final" : "meio");
  if(papel==="capa" || papel==="unico"){
    const tt = ccAjustarFonte(g, s.titulo, BOD, 400, larg, H*0.42, 104*k, 1.14, 56*k); const tx = s.texto ? (g.font = `400 ${40*k}px ${MON}`, ccAjustarFonte(g, s.texto, MON, 400, larg, H*0.26, 42*k, 1.45, 28*k)) : null;
    const altT = tt.linhas.length*tt.t*1.14, altX = tx ? tx.linhas.length*tx.t*1.45 + 60*k : 0; let y = (H - altT - altX - 40*k)/2 + 20*k;
    g.font = `400 ${tt.t}px ${BOD}`; y = ccTexto(g, tt.linhas, mx, y, tt.t, 1.14, corTit, corDest, "center", W);
    g.fillStyle = corDest; g.fillRect(W/2 - 50*k, y + 26*k, 100*k, 3*k);
    if(tx){ g.font = `400 ${tx.t}px ${MON}`; ccTexto(g, tx.linhas, mx, y + 70*k, tx.t, 1.45, corTxt, corDest, "center", W); }
    if(papel==="capa"){ g.font = `500 ${24*k}px ${MON}`; g.fillStyle = corDest; g.textAlign = "center"; g.textBaseline = "alphabetic"; g.fillText("ARRASTE PARA O LADO  →", W/2, H - 150*k); g.textAlign = "left"; }
    return;
  }
  let y = (papel==="meio" && !String(s.texto||"").trim()) ? H*0.27 : 250*k;
  if(papel==="meio"){ g.font = `400 ${84*k}px ${BOD}`; g.fillStyle = corDest; g.textBaseline = "top"; g.fillText(String(idx).padStart(2,"0"), mx, y); y += 120*k; }
  if(s.titulo){ const soTit = !String(s.texto||"").trim(); const tt = ccAjustarFonte(g, s.titulo, BOD, 400, larg, soTit ? H*0.55 : H*0.24, soTit ? 76*k : 70*k, 1.18, 44*k); g.font = `400 ${tt.t}px ${BOD}`; y = ccTexto(g, tt.linhas, mx, y, tt.t, 1.16, corTit, corDest, "left", W); g.fillStyle = corDest; g.fillRect(mx, y + 24*k, 64*k, 3*k); y += 64*k; }

  const disp = H - y - 200*k; const tx = ccAjustarFonte(g, s.texto||"", MON, 400, larg, disp, 46*k, 1.48, 28*k); g.font = `400 ${tx.t}px ${MON}`; ccTexto(g, tx.linhas, mx, y, tx.t, 1.48, corTxt, corDest, "left", W);
  if(papel==="final"){ g.font = `600 ${26*k}px ${MON}`; g.fillStyle = corDest; g.textBaseline = "alphabetic"; g.fillText("SALVE ESTE POST  ·  COMPARTILHE COM QUEM PRECISA", mx, H - 150*k); }
}
function ccTamPost(i){ return [1080, 1350]; }
async function ccMiniaturas(i, el){

async function ccSlidePNG(i, n){ const [W,H] = ccTamPost(i); const cv = document.createElement("canvas"); cv.width = W; cv.height = H; await ccDesenharSlide(cv.getContext("2d"), W, H, i, n); return new Promise(r => cv.toBlob(r, "image/png")); }

async function ccArtesStories(i){
  await ccFontes(); const logo = await ccLogo(); const arq = []; const W = 1080, H = 1920;
  const qs = i.quadros.filter(q => /fundo/i.test(q.midia)); if(!qs.length) return toast("Esta sequência não tem quadros de texto sobre fundo (são fotos ou vídeos seus).", true);
  for(const q of qs){ const cv = document.createElement("canvas"); cv.width = W; cv.height = H; const g = cv.getContext("2d");
    const tema = /marrom/i.test(q.midia) ? CC_TEMAS_VIS.marrom : /nude/i.test(q.midia) ? CC_TEMAS_VIS.nude : CC_TEMAS_VIS.creme;
    g.fillStyle = tema.fundo; g.fillRect(0,0,W,H); if(logo) g.drawImage(logo, W/2-55, 260, 110, 110);
    const tt = ccAjustarFonte(g, q.texto, `"Bodoni Moda", Georgia, serif`, 400, W*0.76, H*0.45, 76, 1.22, 40); g.font = `400 ${tt.t}px "Bodoni Moda", Georgia, serif`;
    const alt = tt.linhas.length*tt.t*1.22; const y = ccTexto(g, tt.linhas, 0, (H-alt)/2, tt.t, 1.22, tema.titulo, tema.destaque, "center", W);
    g.fillStyle = tema.destaque; g.fillRect(W/2-50, y+30, 100, 3);
    g.font = `500 26px "Montserrat", Arial, sans-serif`; g.fillStyle = tema.texto; g.textAlign = "center"; g.textBaseline = "alphabetic"; g.fillText(ccCfg().arroba||"", W/2, H-260); g.textAlign = "left";
    const b = await new Promise(r => cv.toBlob(r, "image/png")); arq.push({nome:`story-${String(q.ordem).padStart(2,"0")}.png`, dados:new Uint8Array(await b.arrayBuffer())}); }
  salvarArquivo(`stories-${ccSlug(i.titulo)}-${i.dataPrevista||hojeStr()}.zip`, new Blob([zipStore(arq)], {type:"application/zip"}), "application/zip");
}

  }
  c.innerHTML = `<div class="barra-acoes cc-cal-barra"><div class="seg">${[["mes","Mês"],["semana","Semana"],["dia","Dia"]].map(([k,t]) => `<button data-m="${k}" class="${CC_CAL.modo===k?"ativo":""}">${t}</button>`).join("")}</div>

      ccDB().tarefas.filter(t => t.itemId===i.id && !t.feito && t.data===de && t.acao!=="gravar").forEach(t => t.data = i.dataPrevista);
      salvar(); toast(`Movido para ${fmtData(i.dataPrevista)}.`); ccTelaCalendario(c); };
    if(CC_CAL.modo!=="dia") d.ondblclick = () => { CC_CAL.ref = d.dataset.dia; CC_CAL.modo = "dia"; ccTelaCalendario(c); }; });
  ccLigarItens(c);
}

function ccAreaDaCategoria(cat){ return cat==="Previdenciário" ? "prev" : cat==="Família" ? "fam" : ["Bastidores","Rotina","Empreendedorismo","Autoridade profissional"].includes(cat) ? "bast" : null; }
function ccTransformarIdeia(x, tipo){
  const area = ccAreaDaCategoria(x.categoria) || ccAdivinharArea(x.texto); const t = ccBuscarTemas(x.texto, area==="bast"?null:area)[0];
  let it;
  if(tipo==="stories") it = ccGerarStories(t && t.area!=="bast" ? "juridico" : "proximidade", hojeStr(), t && t.area!=="bast" ? t.id : null);
  else if(t){ const base = ccDB().itens.filter(i => i.temaId===t.id).length; it = tipo==="carrossel" ? ccGerarCarrossel(t.id, {variacao:base}) : tipo==="post" ? ccGerarPost(t.id, {variacao:base}) : ccGerarVideo(t.id, ccProximoFormato(t), {variacao:base}); it.ideiaOrigem = x.texto; }
  else it = ccItemDeTemaLivre(tipo, x.texto, area, null, {});
  ccDB().itens.push(it); x.usada = true; x.itemId = it.id; registrar("conteúdo", `Ideia transformada em ${CC_TIPOS[tipo]||tipo}: ${x.texto}`); salvar();
  toast(t && tipo!=="stories" ? `Usei o tema conferido "${t.titulo}".` : "Criado como assunto livre: complete e confira as informações."); return it;
}

/* ---------------- DESEMPENHO ---------------- */
function ccRelatorio(ini, fim){
  const pub = ccDB().itens.filter(i => i.status==="publicado" && (i.publicadoEm||i.dataPrevista||"") >= ini && (i.publicadoEm||i.dataPrevista||"") <= fim);
  const com = pub.filter(i => i.metricas && ccMetricasCampos.some(([k]) => i.metricas[k] != null));
  const tot = {}; ccMetricasCampos.forEach(([k]) => tot[k] = com.reduce((s,i) => s + (+i.metricas[k]||0), 0));
  const grupo = chave => { const g = {}; com.forEach(i => { const k = chave(i); (g[k] = g[k] || []).push(i); }); return Object.entries(g).map(([k, l]) => ({k, n:l.length, eng:l.reduce((s,i)=>s+ccEngaj(i.metricas),0)/l.length, salv:l.reduce((s,i)=>s+(+i.metricas.salvamentos||0),0)/l.length, views:l.reduce((s,i)=>s+(+i.metricas.views||+i.metricas.alcance||0),0)/l.length})).sort((a,b) => b.eng-a.eng); };
  return {pub, com, comMetrica:com.length, tot, porTipo:grupo(i => CC_TIPOS[i.tipo]), porArea:grupo(i => CC_AREAS[i.area]), porFormato:grupo(i => CC_FORMATOS[i.formato]||"—"), top:com.slice().sort((a,b) => ccEngaj(b.metricas)-ccEngaj(a.metricas)).slice(0,5)};
}
function ccSugestoes(r){
  const s = []; if(r.comMetrica < 3) return ["Ainda há poucos dados neste período para tirar conclusões. Registre os resultados de pelo menos 3 publicações."];
  const pc = x => (x*100).toFixed(1)+"%";
  if(r.porTipo.length > 1) s.push(`${r.porTipo[0].k} teve o maior engajamento médio (${pc(r.porTipo[0].eng)}), contra ${pc(r.porTipo[r.porTipo.length-1].eng)} de ${r.porTipo[r.porTipo.length-1].k}. Considere produzir mais nesse formato.`);
  if(r.porArea.length > 1) s.push(`Os temas de ${r.porArea[0].k} despertaram mais interesse (${pc(r.porArea[0].eng)} de engajamento médio).`);
  if(r.porFormato.length > 1 && r.porFormato[0].n >= 2) s.push(`O formato "${r.porFormato[0].k}" funcionou melhor. Vale repetir com outros temas.`);
  const salv = r.com.slice().sort((a,b) => (+b.metricas.salvamentos||0)-(+a.metricas.salvamentos||0))[0]; if(salv && +salv.metricas.salvamentos) s.push(`"${salv.titulo}" foi o mais salvo (${salv.metricas.salvamentos}). Conteúdo salvo indica utilidade: vale uma continuação ou outra versão.`);
  if(r.top[0]) s.push(`Para explorar de novo: "${r.top[0].titulo}". Use "Gerar outra versão" no conteúdo para variar o formato.`);
  return s;
}
function ccTelaDesempenho(c){

  let p = "mes";
  const desenhar = () => {
    const [ini, fim, rot] = per[p]; const r = ccRelatorio(ini, fim); const sug = ccSugestoes(r); const pc = x => (x*100).toFixed(1)+"%";

    c.innerHTML = `<div class="barra-acoes"><div class="seg">${Object.entries(per).map(([k,v]) => `<button data-p="${k}" class="${p===k?"ativo":""}">${v[2]}</button>`).join("")}</div>
      ${ccCfg().ig.token ? `<button class="btn btn-sm" id="dp-ig">Importar métricas do Instagram</button>` : `<span class="sub">Instagram não conectado: as métricas são registradas manualmente.</span>`}</div>
      <p class="sub">Relatório de ${fmtData(ini)} a ${fmtData(fim)} · ${r.pub.length} publicação(ões), ${r.comMetrica} com métricas. Engajamento = (curtidas + comentários + compartilhamentos + salvamentos) ÷ alcance (ou visualizações).</p>
      ${r.comMetrica ? `<div class="kpis kpis-fin">${ccMetricasCampos.map(([k,l]) => `<div class="kpi" style="cursor:default"><div class="n">${(r.tot[k]||0).toLocaleString("pt-BR")}</div><div class="l">${l}</div></div>`).join("")}</div>
        <div class="cartao" style="margin-top:16px"><h3>Análise e sugestões</h3><ul>${sug.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
        <div class="grade2">${tab("Por tipo de conteúdo", r.porTipo)}${tab("Por área", r.porArea)}</div>${tab("Por formato", r.porFormato)}`
        : `<div class="cartao vazio">Nenhuma métrica registrada neste período. O sistema não inventa números: registre os resultados de cada publicação (abra o conteúdo publicado → "Editar link e métricas") ou conecte o Instagram em Integrações.</div>`}
      <h2 class="secao-tit">Publicações do período</h2><div class="cartao">${r.pub.map(i => ccLinhaItem(i, i.metricas ? `engaj. ${pc(ccEngaj(i.metricas))}` : "sem métricas")).join("") || `<div class="vazio">Nenhuma publicação registrada.</div>`}</div>`;
    c.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { p = b.dataset.p; desenhar(); });
    ccLigarItens(c); const bi = $("#dp-ig"); if(bi) bi.onclick = async () => { await ccIGImportar(); desenhar(); };
  };
  desenhar();

const CC_NUM = {um:1,uma:1,dois:2,duas:2,"três":3,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10};
async function ccExecutarComando(texto){
  const t = ccNormal(texto), h = hojeStr();
  const qtd = (() => { const m = t.match(/\b(\d{1,2}|um|uma|dois|duas|tres|quatro|cinco|seis|sete|oito|nove|dez)\b\s+(videos?|reels|roteiros?|carrosse(?:is|l)|posts?|conteudos?)/); if(!m) return 1; return Math.min(10, +m[1] || CC_NUM[m[1]] || 1); })();
  const sobre = (texto.match(/sobre\s+(.+?)(?:\s+para\s+(?:o\s+)?(?:tiktok|instagram|reels).*)?[.!?]?$/i)||[])[1] || (texto.match(/^transforme\s+(.+?)\s+em\s+/i)||[])[1];
  const ultimoVideo = () => ccDB().midias.filter(m => m.tipo==="video").sort((a,b) => b.criado.localeCompare(a.criado))[0];
  const itemAlvo = () => { const m = ultimoVideo(); return (m && ccItem(m.itemId)) || ccDB().itens.filter(i => i.tipo==="video").sort((a,b) => (b.atualizado||b.criado).localeCompare(a.atualizado||a.criado))[0]; };
  const MES = MESES.map(ccNormal);
  if(/(monte|planej|organiz|prepare).*(proxima semana|semana que vem)/.test(t)){ const r = ccPlanejarSemana(addDias(ccSegunda(h),7)); return {msg:`Planejei a próxima semana: ${r.criados.length} conteúdos, gravação em ${r.gravDia?fmtData(r.gravDia):"—"}.`, itens:r.criados, ir:"planejamento"}; }
  if(/(monte|planej|organiz).*(essa|esta) semana|minha semana/.test(t)){ const r = ccPlanejarSemana(ccSegunda(h)); return {msg:r.criados.length ? `Planejei esta semana: ${r.criados.length} conteúdos.` : (r.msg||"Nada criado."), itens:r.criados, ir:"planejamento"}; }
  const mm = t.match(/(organiz|planej|monte).*\b(janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)\b/);
  if(mm){ const mes = MES.indexOf(mm[2]) + 1; let ano = +h.slice(0,4); if(mes < +h.slice(5,7)) ano++; const res = ccPlanejarMes(ano, mes); const n = res.reduce((s,x) => s + x.criados.length, 0);
    return {msg: n ? `Organizei ${MESES[mes-1]} de ${ano}: ${n} conteúdos em ${res.length} semana(s).` : `As semanas de ${MESES[mes-1]} já estavam planejadas (ou já passaram).`, itens:res.flatMap(x => x.criados).slice(0,12), ir:"calendario"}; }
  if(/stories/.test(t)){ const obj = /duvida/.test(t) ? "duvidas" : /bastidor/.test(t) ? "bastidores" : /rotina/.test(t) ? "rotina" : /jurid|informa/.test(t) ? "juridico" : ["rotina","juridico","bastidores","proximidade"][diaSemana(h) % 4];
    const it = ccGerarStories(obj, /amanha/.test(t) ? addDias(h,1) : h); ccDB().itens.push(it); ccTarefa(it.dataPrevista, `Fazer stories: ${it.titulo.toLowerCase()}`, {itemId:it.id, acao:"stories"}); return {msg:`Sequência de ${it.quadros.length} stories pronta (${it.titulo}).`, itens:[it], ir:"stories"}; }
  if(/analis|relatorio|desempenho|resultado/.test(t)){ const r = ccRelatorio(addDias(h,-29), h); return {msg: r.comMetrica ? ccSugestoes(r).join(" ") : "Ainda não há métricas registradas para analisar. Registre os resultados das publicações ou conecte o Instagram.", ir:"desempenho"}; }
  if(/(temas?|assuntos?).*(nao explor|ainda nao|novos)|sugira/.test(t)){ const l = ccTemasNaoExplorados(); return {msg: l.length ? `Temas que você ainda não explorou: ${l.slice(0,10).map(x => x.titulo).join("; ")}.` : "Você já usou todos os temas da biblioteca. Experimente novos formatos com “Gerar outra versão”.", ir:"criar"}; }
  if(/edit.*video|video.*(acabei|enviei)/.test(t)){ const m = ultimoVideo(); if(!m) return {msg:"Nenhum vídeo enviado ainda. Envie em Edição de vídeos."}; return {msg:`Abrindo o editor de "${m.nome}". Clique em "Encontrar e remover pausas" e depois gere as legendas do roteiro.`, ir:"edicao-"+m.id, acao:() => ir("conteudo-edicao-"+m.id)}; }
  if(/\bcapa\b/.test(t) && !sobre){ const i = itemAlvo(); if(!i) return {msg:"Nenhum vídeo encontrado para criar capa."}; return {msg:`Abrindo o criador de capa para "${i.titulo}".`, itens:[i], acao:() => ccCriarCapa(i)}; }
  if(/legenda/.test(t) && !sobre){ const i = itemAlvo(); if(!i) return {msg:"Nenhum vídeo encontrado."}; const tm = i.temaId && ccTema(i.temaId); if(tm) i.legenda = ccLegenda(tm, i.cta || ccCta(tm, i.formato, i.variacao||0), i.variacao||0); ccAlterouAposAprovar(i); return {msg:`Legenda ${tm?"criada":"mantida"} para "${i.titulo}". Abra o conteúdo para ajustar ou copiar.`, itens:[i]}; }
  if(/gravar hoje|para (eu )?gravar|video para hoje/.test(t)){ const area = /famil|pensao|guarda|divorc/.test(t) ? "fam" : /inss|aposent|previd/.test(t) ? "prev" : (diaSemana(h)%2 ? "fam" : "prev"); const tm = ccProximoTema(area);
    const it = ccGerarVideo(tm.id, ccProximoFormato(tm), {status:"gravar"}); it.gravacaoData = h; it.dataPrevista = addDias(h, 1); it.hora = ccCfg().horarios.reels; ccDB().itens.push(it); ccTarefa(h, `Gravar vídeo: ${it.titulo}`, {itemId:it.id, acao:"gravar"});
    return {msg:`Roteiro pronto para gravar hoje: "${it.titulo}" (${CC_FORMATOS[it.formato]}, cerca de ${it.duracao}s). Está na sua missão de hoje.`, itens:[it]}; }
  // geração por assunto
  const tipo = /carrosse/.test(t) ? "carrossel" : /\bposts?\b/.test(t) ? "post" : "video";
  const plats = /tiktok/.test(t) && !/instagram|reels/.test(t) ? ["tiktok"] : /reels|instagram/.test(t) && !/tiktok/.test(t) ? ["reels"] : ["reels","tiktok"];
  if(sobre || /video|roteiro|carrossel|post|conteudo/.test(t)){
    const assunto = (sobre || texto).trim();
    let temas = ccBuscarTemas(assunto);
    if(/beneficios? do inss|inss/.test(ccNormal(assunto)) && temas.length < qtd) temas = [...new Set([...temas, ...CC_TEMAS.filter(x => x.area==="prev")])];
    if(/familia/.test(ccNormal(assunto)) && temas.length < qtd) temas = [...new Set([...temas, ...CC_TEMAS.filter(x => x.area==="fam")])];
    const novos = [];
    if(temas.length){
      for(let k=0;k<qtd;k++){ const tm = temas[k % temas.length]; const base = ccDB().itens.filter(i => i.temaId===tm.id).length + k;
        const it = tipo==="carrossel" ? ccGerarCarrossel(tm.id, {variacao:base}) : tipo==="post" ? ccGerarPost(tm.id, {variacao:base}) : ccGerarVideo(tm.id, ccFormatosDoTema(tm)[base % ccFormatosDoTema(tm).length], {variacao:base, plataformas:plats});
        ccDB().itens.push(it); novos.push(it); }
      return {msg:`Criei ${novos.length} ${tipo==="carrossel"?"carrossel(éis)":tipo==="post"?"post(s)":"roteiro(s) de vídeo"} com base nos temas conferidos: ${[...new Set(novos.map(i => i.titulo))].join("; ")}.`, itens:novos};
    }
    if(ccCfg().ollama.modelo){ for(let k=0;k<qtd;k++){ const it = await ccIAGerar(tipo, assunto, null); if(it){ it.plataformas = tipo==="video" ? plats : ["feed"]; ccDB().itens.push(it); novos.push(it); } }
      if(novos.length) return {msg:`A IA local escreveu ${novos.length} conteúdo(s) sobre "${assunto}". Confira as informações antes de aprovar.`, itens:novos}; }
    for(let k=0;k<qtd;k++){ const it = ccItemDeTemaLivre(tipo, assunto, null, null, {variacao:k}); if(tipo==="video") it.plataformas = plats; ccDB().itens.push(it); novos.push(it); }
    return {msg:`Não encontrei "${assunto}" na biblioteca conferida. Criei ${novos.length} roteiro(s) com a estrutura pronta e lacunas marcadas para você completar e conferir.`, itens:novos};
  }
  return {msg:"Não entendi o pedido. Tente um dos exemplos abaixo do campo."};
}

/* ---------------- IA LOCAL (Ollama, gratuita) ---------------- */
async function ccIAGerar(tipo, assunto, area){
  const cfg = ccCfg().ollama; if(!cfg.modelo) return null;
  toast("A IA local está escrevendo… (pode levar alguns minutos)");
  const prompt = `Você é estrategista de marketing jurídico no Brasil e escreve para o Instagram e o TikTok de Jéssica Valiente, que fala de Direito Previdenciário e de Direito de Família em linguagem simples, como numa conversa.
Assunto: "${assunto}".
Regras obrigatórias (Código de Ética da OAB e Provimento 205/2021): nada de promessa ou garantia de resultado, nada de preço, nada de "me chame no WhatsApp", nada de sensacionalismo, nada de casos de clientes. Não invente leis, números de artigos, valores ou decisões: se não tiver certeza, escreva [conferir].
Responda SOMENTE com JSON válido neste formato:
{"titulo":"...","gancho":"frase de abertura de até 15 palavras","pontos":["4 a 5 frases curtas e simples, uma ideia por frase"],"base_legal":"lei/artigo ou [conferir]","cta":"chamada ética (salvar, compartilhar, comentar)","capa":"texto de capa com até 5 palavras","hashtags":["8 hashtags sem #"]}`;
  try{
    const r = await fetch(cfg.url.replace(/\/$/,"") + "/api/generate", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({model:cfg.modelo, prompt, stream:false, format:"json", options:{temperature:0.6}})});
    if(!r.ok) throw new Error("HTTP "+r.status); const j = await r.json(); const d = JSON.parse(j.response);
    const it = ccItemDeTemaLivre(tipo, d.titulo || assunto, area || ccAdivinharArea(assunto + " " + (d.titulo||"")), (d.pontos||[]).slice(0,6), {});
    if(d.gancho && it.roteiro){ it.roteiro[0].fala = d.gancho; it.gancho = d.gancho; }
    if(d.gancho && it.slides){ it.slides[0].titulo = d.gancho; it.gancho = d.gancho; }
    if(d.capa) it.capa = Object.assign(it.capa||{}, {texto:d.capa}); if(d.cta) it.cta = d.cta;
    it.legenda = [d.titulo || assunto, "", ...(d.pontos||[]).slice(0,3).map(p => "• "+p), "", d.cta||CC_CTAS.salvar, "", CC_AVISO, "", (d.hashtags||[]).slice(0,10).map(h => "#"+String(h).replace(/^#/,"").replace(/\s+/g,"")).join(" ")].join("\n");
    it.origem = "ia"; it.verificacao = {status:"conferir", texto:`Escrito pela IA local. Base indicada: ${d.base_legal||"não informada"}. Confira tudo em fonte oficial antes de aprovar.`};
    return it;
  }catch(e){ toast("Não consegui falar com a IA local. Confira se o Ollama está aberto e configurado (Integrações). "+(e.message||""), true); return null; }
}

async function ccIG(caminho, params){
  const cfg = ccCfg().ig; const u = new URL("https://graph.instagram.com/v22.0/" + caminho); Object.entries(Object.assign({access_token:cfg.token}, params||{})).forEach(([k,v]) => u.searchParams.set(k, v));
  const r = await fetch(u); const j = await r.json(); if(j.error) throw new Error(j.error.message); return j;

async function ccIGImportar(){
  if(!ccCfg().ig.token) return toast("Conecte o Instagram em Integrações.", true);
  toast("Buscando suas publicações no Instagram…");
  try{
    const lista = await ccIG("me/media", {fields:"id,caption,media_type,media_product_type,permalink,timestamp,like_count,comments_count", limit:50});
    let at = 0, novos = 0; const norm = u => String(u||"").replace(/[?#].*$/,"").replace(/\/$/,"").toLowerCase();
    for(const md of lista.data||[]){
      const met = {curtidas:md.like_count??null, comentarios:md.comments_count??null};
      try{ const ins = await ccIG(md.id+"/insights", {metric: md.media_product_type==="STORY" ? "reach,views" : "reach,saved,shares,views"});
        (ins.data||[]).forEach(x => { const v = x.values?.[0]?.value ?? x.total_value?.value; if(x.name==="reach") met.alcance = v; if(x.name==="saved") met.salvamentos = v; if(x.name==="shares") met.compartilhamentos = v; if(x.name==="views") met.views = v; }); }catch(e){}
      let i = ccDB().itens.find(x => x.link && norm(x.link)===norm(md.permalink));
      if(!i){ i = ccNovoItem({tipo: md.media_product_type==="REELS" ? "video" : md.media_type==="CAROUSEL_ALBUM" ? "carrossel" : "post", titulo:(md.caption||"Publicação do Instagram").split("\n")[0].slice(0,90), area:ccAdivinharArea(md.caption||""), formato:"", plataformas:[md.media_product_type==="REELS"?"reels":"feed"], status:"publicado", origem:"instagram", link:md.permalink}); ccDB().itens.push(i); novos++; }
      i.publicadoEm = md.timestamp.slice(0,10); i.dataPrevista = i.dataPrevista || i.publicadoEm; i.hora = i.hora || new Date(md.timestamp).toTimeString().slice(0,5);
      i.metricas = Object.assign({}, i.metricas, met, {registradoEm:new Date().toISOString(), fonte:"instagram"}); if(i.status!=="publicado") ccMudarStatus(i, "publicado", "Importado do Instagram"); at++;
    }
    ccCfg().ig.ultima = new Date().toISOString(); registrar("conteúdo", `Instagram: ${at} publicação(ões) atualizada(s), ${novos} nova(s)`); salvar(); toast(`Instagram: ${at} publicações atualizadas (${novos} novas).`);
  }catch(e){ toast("Instagram recusou a consulta: "+e.message, true); }
}

  <div class="grade2">
  <div class="cartao"><h3>Instagram profissional · métricas</h3>
    <p style="margin-top:0">Status: <b>${cfg.ig.token ? "token cadastrado" : "não conectado"}</b>${cfg.ig.ultima?` · última importação ${new Date(cfg.ig.ultima).toLocaleString("pt-BR")}`:""}</p>
    <ol class="passos sub"><li>Sua conta do Instagram precisa ser <b>profissional</b> (Criador ou Empresa) — gratuito, nas configurações do app.</li><li>Em <a href="https://developers.facebook.com/apps" target="_blank" rel="noopener">developers.facebook.com</a>, crie um app (gratuito) e adicione o produto <b>Instagram</b> → "API com login do Instagram".</li><li>Adicione sua conta como testadora e gere um <b>token de acesso</b> com as permissões <code>instagram_business_basic</code> e <code>instagram_business_manage_insights</code>.</li><li>Cole o token abaixo. Ele vale cerca de 60 dias; depois, gere outro.</li></ol>
    <form id="aj-ig" class="campos"><label class="largo">Token de acesso<input name="token" type="password" value="${esc(cfg.ig.token)}" autocomplete="off"></label><div class="largo barra-acoes" style="margin:0"><button class="btn btn-sm btn-pri">Salvar</button><button type="button" class="btn btn-sm" id="aj-ig-t">Testar conexão</button><button type="button" class="btn btn-sm" id="aj-ig-i">Importar métricas</button></div></form>
    <p class="sub">Publicar pela API exige que o arquivo esteja num endereço público na internet (o sistema é local), então a publicação é assistida: o sistema baixa o arquivo, copia a legenda e abre o Instagram. Para agendar de graça: <a href="https://business.facebook.com/latest/content_calendar" target="_blank" rel="noopener">Meta Business Suite</a>.</p></div>
  <div class="cartao"><h3>TikTok</h3>
    <p style="margin-top:0">Status: <b>não disponível gratuitamente neste sistema</b>.</p>
    <p class="sub">As APIs do TikTok para publicar e ler métricas exigem um site com servidor para o login e passam por auditoria do TikTok antes de liberar publicação pública. Como o sistema roda no seu computador, sem servidor, essa integração não foi simulada.</p>
    <p class="sub">Alternativas gratuitas que funcionam: agendar posts no <a href="https://www.tiktok.com/tiktokstudio/upload" target="_blank" rel="noopener">TikTok Studio</a> (até 10 dias à frente) e registrar as métricas no próprio conteúdo publicado (visualizações, curtidas, comentários, compartilhamentos, salvamentos).</p></div>
  <div class="cartao"><h3>IA local gratuita (opcional)</h3>
    <p style="margin-top:0">A biblioteca e o motor de roteiros funcionam sem IA. Para texto livre sobre qualquer assunto, você pode instalar uma IA que roda no seu computador, sem custo e sem enviar dados para fora:</p>
    <ol class="passos sub"><li>Baixe e instale o <a href="https://ollama.com/download" target="_blank" rel="noopener">Ollama</a> (gratuito, código aberto).</li><li>No Prompt de Comando: <code>ollama pull qwen2.5:7b</code> (ou outro modelo com bom português).</li><li>Libere o acesso do sistema: no Windows, crie a variável de ambiente <code>OLLAMA_ORIGINS</code> com o valor <code>*</code> e reinicie o Ollama.</li><li>Preencha abaixo e teste.</li></ol>
    <form id="aj-ia" class="campos"><label>Endereço<input name="url" value="${esc(cfg.ollama.url)}"></label><label>Modelo<input name="modelo" value="${esc(cfg.ollama.modelo)}" placeholder="qwen2.5:7b"></label><div class="largo barra-acoes" style="margin:0"><button class="btn btn-sm btn-pri">Salvar</button><button type="button" class="btn btn-sm" id="aj-ia-t">Testar conexão</button></div></form>
    <p class="sub">Precisa de um computador com pelo menos 8 GB de memória. Todo texto da IA sai marcado como "conferir antes de publicar".</p></div>
  <div class="cartao"><h3>Armazenamento e backup</h3><p id="aj-esp" class="sub" style="margin-top:0">Calculando espaço…</p>

/* ---------- Gerador de publicações do feed ---------- */
function atFrases(p){ return String(p||"").match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g)?.map(x => x.trim()).filter(Boolean) || []; }
function atPrimeira(p){ const f = atFrases(p); return [ccSemPonto(f[0]||p), f.slice(1).join(" ")]; }
function atDestacar(tit){
  tit = String(tit||"").trim(); if(!tit || /\*/.test(tit)) return tit;
  const ws = tit.split(/\s+/); if(ws.length < 3) return tit;
  let n = 1; if(ws[ws.length-1].replace(/[^\p{L}\d%]/gu,"").length <= 4 && ws.length > 4) n = 2;
  return ws.slice(0, -n).join(" ") + " *" + ws.slice(-n).join(" ") + "*";
}
function atCurto(p, max){ return atPrimeira(p)[0]; }
const AT_ICONES_AREA = {prev:["escudo","documento","calendario","moeda","lupa","relogio"], fam:["familia","coracao","casa","documento","balanca","crianca"], bast:["livro","maleta","coracao","calendario","check","documento"]};
const AT_CTAS = [
  "📌 Salve este post para consultar quando precisar.",
  "📤 Envie para alguém que precisa dessa informação.",
  "💬 Qual parte desse tema gera mais dúvida? Comente aqui: ela pode virar um próximo conteúdo.",
  "🔁 Compartilhe nos stories e ajude mais pessoas a conhecer os próprios direitos."
];
function atLegenda(t, tipo, v){
  const L = []; const g = t.ganchos[v % t.ganchos.length];
  const g1 = g.replace(/\*/g,"").trim(); L.push(/[.?!]$/.test(g1) ? g1 : g1 + ".", "");
  if(tipo==="carrossel"){ L.push("Neste carrossel:"); t.pontos.slice(0, 4).forEach(p => L.push("▸ " + atCurto(p, 18) + ".")); }
  else { atFrases(t.pontos[0]).forEach(f => L.push(f)); if(t.pontos[1]) L.push("", t.pontos[1]); }
  L.push("", AT_CTAS[(v + (tipo==="post"?1:0)) % AT_CTAS.length]);
  if(t.base && !/\[/.test(t.base)) L.push("", "📚 Base: " + t.base + ".");
  L.push("", "⚖️ " + AT_AVISO);
  return L.join("\n");
}
function atHashtags(t){ return ccHashtags(t, ["informacaojuridica","conhecaseusdireitos"]); }
function atTomPorData(data, padrao){
  const n = Math.floor(toUTC(data)/86400000);
  if(padrao==="xadrez") return n % 2 ? "escuro" : "claro";
  if(padrao==="livre") return atRng(n)() < .33 ? "escuro" : "claro";
  return n % 3 === 2 ? "escuro" : "claro"; // coluna
}
function atPaletaPorData(data){
  const f = ccCfg().feed || {}; const n = Math.floor(toUTC(data)/86400000);
  return atTomPorData(data, f.padraoGrade) === "escuro" ? AT_ESCUROS[Math.floor(n/3) % AT_ESCUROS.length] : AT_CLAROS[(n + 2*Math.floor(n/3)) % AT_CLAROS.length];
}

  if(tipo==="post" && estilo==="frase") return [{papel:"unico", layout:"frase", titulo: gk ? gk.frase : atDestacar(atPrimeira(t.mito ? t.mito[1] : t.pontos[0])[0] + ".")}];
  if(tipo==="post" && estilo==="dica") return [{papel:"unico", layout:"dica", rotulo:"DICA RÁPIDA", titulo: gk ? gk.dica : (t.erro ? "Evite " + t.erro + "." : atPrimeira(t.pontos[0])[0] + "."), sub:"Salve para lembrar quando precisar."}];

  if(al.length){ if(lote) return false; if(!(await confirmar("Há alertas na revisão ética", `${al.map(a => `• ${esc(a.msg)} — “${esc(a.trecho)}”`).join("<br>")}<br><br>Aprovar mesmo assim?`, "Aprovar mesmo assim"))) return false; }
  if(i.verificacao?.status==="conferir"){ if(lote) return false; if(!(await confirmar("Conferir antes de publicar", `${esc(i.verificacao.texto)}<br><br>Você conferiu essas informações em fonte oficial?`, "Conferi, aprovar"))) return false; }
  const cap = ccFeedLegendaCompleta(i); if(cap.length > 2200 || (cap.match(/#/g)||[]).length > 30){ toast("A legenda passa do limite do Instagram (2.200 caracteres ou 30 hashtags). Ajuste antes de aprovar.", true); return false; }
  if(!i.design && i.slides){ /* conteúdo antigo: segue no visual anterior */ }
  i.aprovacao = {em:new Date().toISOString(), por:USU?.nome||"", versao:i.versao||1, hash: i.design ? ccFeedAssinatura(i) : atHash(JSON.stringify([i.slides, i.visual, i.legenda, i.hashtags]))};
  i.ajuste = null; i.pub = Object.assign({}, i.pub, {status:"fila", erro:null, tentativas:0});
  const fila = (ccCfg().feed.autoFila !== false) && i.dataPrevista && i.hora;
  ccMudarStatus(i, fila ? "agendado" : "aprovado", `Aprovado expressamente por ${USU?.nome||""} (versão ${i.versao||1})${fila ? ` · fila: ${fmtData(i.dataPrevista)} ${i.hora}` : ""}`);
  ccConcluirTarefas(i, "aprovar"); salvar(); if(i.status==="agendado") ccPubPrepararFundo(i);
  return true;
}
function atAssinaturaAtual(i){ return i.design ? ccFeedAssinatura(i) : atHash(JSON.stringify([i.slides, i.visual, i.legenda, i.hashtags])); }
async function ccFeedReprovar(i){

    [{t:"Cancelar", v:null},{t:"Reprovar", cls:"btn-perigo", acao: f => { const v = lerForm(f.querySelector("form")); if(!v.obs){ toast("Escreva o motivo.", true); return false; } return v; }}]);

async function ccSlideBlob(i, n, tipo){ const cv = document.createElement("canvas"); cv.width = 1080; cv.height = 1350; await ccDesenharSlide(cv.getContext("2d"), 1080, 1350, i, n); return new Promise(r => cv.toBlob(r, tipo==="jpg" ? "image/jpeg" : "image/png", .93)); }
async function ccFeedBaixar(i, tipo){
  await ccFontes(); const ext = tipo==="jpg" ? "jpg" : "png", nome = `${i.dataPrevista||"sem-data"}-${ccSlug(i.titulo)}`;
  if(i.slides.length===1) return salvarArquivo(`${nome}.${ext}`, await ccSlideBlob(i, 0, tipo), tipo==="jpg" ? "image/jpeg" : "image/png");
  const arq = []; for(let n=0;n<i.slides.length;n++){ const b = await ccSlideBlob(i, n, tipo); arq.push({nome:`${nome}-${String(n+1).padStart(2,"0")}.${ext}`, dados:new Uint8Array(await b.arrayBuffer())}); }
  arq.push({nome:`${nome}-legenda.txt`, dados:enc.encode(ccFeedLegendaCompleta(i))});
  salvarArquivo(`${nome}.zip`, new Blob([zipStore(arq)], {type:"application/zip"}), "application/zip");
}
async function ccFeedExportarFila(){
  const l = ccFeedItens().filter(i => ["agendado","aprovado"].includes(i.status) && i.slides).sort((a,b) => atQuando(a) - atQuando(b));
  if(!l.length) return toast("Nenhuma publicação aprovada para exportar.", true);
  toast(`Preparando ${l.length} publicação(ões)…`); await ccFontes(); const arq = [];
  for(const i of l){ const pasta = `${i.dataPrevista||"sem-data"}_${(i.hora||"").replace(":","h")}_${ccSlug(i.titulo)}`;
    for(let n=0;n<i.slides.length;n++){ const b = await ccSlideBlob(i, n, "jpg"); arq.push({nome:`${pasta}/${String(n+1).padStart(2,"0")}.jpg`, dados:new Uint8Array(await b.arrayBuffer())}); }
    arq.push({nome:`${pasta}/legenda.txt`, dados:enc.encode(`Data: ${fmtData(i.dataPrevista)} ${i.hora||""}\n\n${ccFeedLegendaCompleta(i)}`)}); }
  salvarArquivo(`fila-instagram-${hojeStr()}.zip`, new Blob([zipStore(arq)], {type:"application/zip"}), "application/zip");
}

const AT_PREMIUM = {atelier:"Premium · Ateliê (arco e ramos)", revista:"Premium · Revista (editorial)", bloco:"Premium · Bloco dividido", classico:"Premium · Clássico com moldura", moderno:"Premium · Moderno geométrico"};
const AP_ORDEM = ["atelier","bloco","revista","classico","moderno"];
const AP_MOTIVACIONAIS = [
  "Conhecer seus direitos é o *primeiro passo* para cuidar do seu futuro.",
  "Informação de qualidade *transforma decisões.*",
  "Cada documento guardado hoje é *tranquilidade* amanhã.",

function apFamiliaPorData(data, seed){ const n = data ? Math.floor(toUTC(data)/86400000) : (seed||0); return AP_ORDEM[((n % AP_ORDEM.length) + AP_ORDEM.length) % AP_ORDEM.length]; }
function apEscuro(P, seed){ return P.escuro ? P : AT_PALETAS[["cafe","chocolate"][(seed||0) % 2]]; }
function apClaro(P){ return P.escuro ? AT_PALETAS.areia : P; }
function apCardCor(P){ return P.escuro ? P.card : (P.bg==="#FFFFFF" ? "#F7F2E9" : "#FFFFFF"); }

/* ---------- elementos gráficos ---------- */
function apPapel(g, W, H, P, seed, k){
  g.fillStyle = P.bg; g.fillRect(0, 0, W, H);
  const gr = g.createRadialGradient(W*.25, H*.18, 0, W*.25, H*.18, W*1.15); gr.addColorStop(0, P.escuro ? "rgba(255,255,255,.08)" : "rgba(255,255,255,.6)"); gr.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const gb = g.createLinearGradient(0, H*.55, 0, H); gb.addColorStop(0, "rgba(0,0,0,0)"); gb.addColorStop(1, P.escuro ? "rgba(0,0,0,.20)" : "rgba(90,64,50,.06)"); g.fillStyle = gb; g.fillRect(0, 0, W, H);
  const r = atRng(seed*13 + 5); g.save(); g.strokeStyle = P.escuro ? "#FFFFFF" : "#8F6E3E"; g.lineWidth = .9*k;
  for(let n=0;n<80;n++){ g.globalAlpha = .02 + r()*.03; const x = r()*W, y = r()*H, l = (24 + r()*70)*k, a = r()*Math.PI; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a)*l/2 + (r()-.5)*12*k, y + Math.sin(a)*l/2 + (r()-.5)*12*k, x + Math.cos(a)*l, y + Math.sin(a)*l); g.stroke(); }
  g.restore(); atGrao(g, W, H, seed, P.escuro);
}
function apBrilho(g, x, y, s, cor){ g.save(); g.fillStyle = cor; g.beginPath(); g.moveTo(x, y - s); g.quadraticCurveTo(x + s*.14, y - s*.14, x + s, y); g.quadraticCurveTo(x + s*.14, y + s*.14, x, y + s); g.quadraticCurveTo(x - s*.14, y + s*.14, x - s, y); g.quadraticCurveTo(x - s*.14, y - s*.14, x, y - s); g.fill(); g.restore(); }
function apRamo(g, x, y, len, ang, cor, k, espelho){
  g.save(); g.translate(x, y); g.rotate(ang); if(espelho) g.scale(1, -1); g.strokeStyle = cor; g.lineWidth = 1.5*k; g.lineCap = "round";
  const P = t => { const u = 1 - t; return [3*u*u*t*len*.33 + 3*u*t*t*len*.66 + t*t*t*len, 3*u*u*t*(-len*.10) + 3*u*t*t*(-len*.04) + t*t*t*(-len*.2)]; };
  g.beginPath(); g.moveTo(0, 0); g.bezierCurveTo(len*.33, -len*.10, len*.66, -len*.04, len, -len*.2); g.stroke();
  for(let n=1;n<=8;n++){ const t = n/9, [px, py] = P(t), lado = n % 2 ? 1 : -1, fl = len*(.15 - t*.06);
    g.save(); g.translate(px, py); g.rotate(-0.25 + lado*-0.85); g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(fl*.5, -fl*.32, fl, 0); g.quadraticCurveTo(fl*.5, fl*.32, 0, 0); g.stroke(); g.restore(); }
  const [ex, ey] = P(1); g.beginPath(); g.arc(ex + 6*k, ey - 2*k, 4*k, 0, Math.PI*2); g.fillStyle = cor; g.fill();
  g.restore();
}
function apCanto(g, x, y, s, rot, cor, k){ g.save(); g.translate(x, y); g.rotate(rot); g.strokeStyle = cor; g.fillStyle = cor; g.lineWidth = 1.4*k;
  g.beginPath(); g.moveTo(0, s); g.lineTo(0, 0); g.lineTo(s, 0); g.stroke();
  g.beginPath(); g.moveTo(10*k, s*.62); g.lineTo(10*k, 10*k); g.lineTo(s*.62, 10*k); g.stroke();
  g.beginPath(); g.arc(10*k, 10*k, s*.32, 0, Math.PI/2); g.stroke();
  g.save(); g.rotate(Math.PI/4); g.fillRect(-4.5*k, -4.5*k, 9*k, 9*k); g.restore(); g.restore(); }
function apSelo(g, cx, cy, r, P, k, cor){

  g.font = `600 ${r*.15}px ${AT_SANS}`; g.textAlign = "center"; g.textBaseline = "middle";
  ch.forEach((c, n) => { const a = -Math.PI/2 + (n/ch.length)*Math.PI*2; g.save(); g.translate(cx + Math.cos(a)*r*.82, cy + Math.sin(a)*r*.82); g.rotate(a + Math.PI/2); g.fillText(c, 0, 0); g.restore(); });

/* ---------- motor ---------- */
async function apDesenhar(g, W, H, i, idx){
  const s = i.slides[idx] || {}, total = i.slides.length, k = W/1080, d = i.design || {}, seed = (d.seed||1)*31 + idx*7;
  const papel = s.papel || (total===1 ? "unico" : idx===0 ? "capa" : idx===total-1 ? "final" : "meio");
  const C = {g, W, H, i, s, idx, total, k, d, seed, P:atPaleta(i, s), fam: AT_PREMIUM[d.premium] ? d.premium : "atelier", papel, mx:96*k, rot:(s.rotulo || atAreaRot(i)), ic:(s.icone || d.icone || "balanca")};
  g.save(); g.textAlign = "left"; g.textBaseline = "alphabetic";
  if(papel==="capa") await apCapa(C);
  else if(papel==="final") await apFinal(C);
  else if(papel==="unico") await apUnico(C);
  else await apMeio(C);
  g.restore();
}

  if(C.fam==="atelier"){ apRamo(g, W - K(70), K(110), K(170), Math.PI*.82, P.ac, k); apBrilho(g, W - K(250), K(96), K(9), P.ac); }
  if(C.fam==="bloco"){ const D = apEscuro(P, seed); g.save(); g.beginPath(); g.rect(0, 0, K(26), H); g.clip(); g.fillStyle = D.bg; g.fillRect(0, 0, W, H); g.restore(); }
  const top = C.fam==="classico" ? K(128) : K(118);
  apRot(g, C.rot, mx, top, P.ac2, k, 15);
  g.font = `italic 400 ${K(30)}px ${AT_SERIF}`; g.fillStyle = P.mut; g.textAlign = "right"; g.fillText(C.total > 1 ? `${String(C.idx+1).padStart(2,"0")} / ${String(C.total).padStart(2,"0")}` : `Nº ${apNum(C.i)}`, W - mx, top + K(2)); g.textAlign = "left";
  apLinha(g, mx, top + K(28), W - mx, top + K(28), P.tit, k, 1, C.fam==="revista" ? .7 : .25);
  if(C.fam==="revista") apLinha(g, mx, top + K(35), W - mx, top + K(35), P.tit, k, .6, .5);

function ccxResponder(texto, msg, itens){

/* ---------- GERAR NOVOS CONTEÚDOS ---------- */
function ccxProximoDiaLivre(d){ let x = d || addDias(hojeStr(), 1); for(let n=0;n<400;n++){ if(!ccFeedDoDia(x).length) return x; x = addDias(x, 1); } return x; }
function ccxGerar(o){
  const fc = ccCfg().feed; const criados = []; let aviso = "";
  const usados = new Set(ccFeedItens().filter(i => (i.dataPrevista||"") >= addDias(hojeStr(), -20)).map(i => i.temaId).filter(Boolean));
  let temas = o.assunto ? ccBuscarTemas(o.assunto, o.area || undefined) : [];
  if(o.assunto && !temas.length){ const ar = o.area || ccAdivinharArea(o.assunto); aviso = ` Não encontrei “${o.assunto}” na biblioteca de temas conferidos, então usei temas de ${ar==="fam" ? "Direito de Família" : "Direito Previdenciário"}.`; if(!o.area && (ar==="prev" || ar==="fam")) o.area = ar; }
  const formatos = (o.formatos && o.formatos.length ? o.formatos : (fc.formatosPref && fc.formatosPref.length ? fc.formatosPref : Object.keys(AT_ESTILOS))).filter(k => AT_ESTILOS[k]);
  const capas = (o.capas || fc.capasPref || []).filter(k => AT_CAPAS_V3[k] || AT_PREMIUM[k]);
  const ordem = AT_RITMO.filter(x => formatos.includes(x)); const seqF = ordem.length ? ordem : formatos;
  const instr = [fc.instrucoes, o.instr].filter(Boolean).join(" ");
  let d = o.inicio && o.inicio > hojeStr() ? o.inicio : addDias(hojeStr(), 1);
  for(let k=0;k<o.qtd;k++){
    d = ccxProximoDiaLivre(d);
    const area = o.area || (Math.floor(toUTC(d)/86400000) % 2 ? "fam" : "prev");
    const t = temas.length ? temas[k % temas.length] : ccProximoTema(area, usados); if(!t) continue; usados.add(t.id);
    const estilo = seqF[k % seqF.length] || "info", tipo = estilo==="carrossel" ? "carrossel" : "post";
    const base = ccDB().itens.filter(i => i.temaId===t.id).length;
    const it = ccFeedGerar(t.id, tipo, {variacao:base, data:d, estilo, capa: capas.length ? capas[k % capas.length] : null}); if(!it) continue;
    if(it.slides[0]?.papel==="capa" && AT_CAPAS_ED[it.design.capa]) delete it.slides[0].layout;
    it.planoFeed = d; it.origem = "central"; if(o.instr) it.instrucoes = o.instr;
    const ap = ccxAplicarInstr(it, instr);
    it.historico.push({ts:new Date().toISOString(), de:it.status, para:it.status, obs:`Criado em GERAR NOVOS CONTEÚDOS${ap.length ? " · " + ap.join(", ") : ""}`, usuario:USU?.nome||""});
    ccDB().itens.push(it); criados.push(it); d = addDias(d, 1);
  }
  if(criados.length) registrar("conteúdo", `Central: ${criados.length} conteúdo(s) gerado(s) para aprovação`);
  salvar(); return {criados, aviso, semRef: !capas.length};
}
function ccxAplicarInstr(i, txt){ // só aplica o que for pedido de forma clara; cores sempre dentro da paleta da marca
  const n = ccNormal(txt||""), d = i.design, feito = []; if(!n.trim() || !d) return feito;
  if(/(mais escur|fundo escuro|tons? escuros?|cores escuras)/.test(n)){ d.paleta = AT_ESCUROS[(d.seed||0) % AT_ESCUROS.length]; feito.push(`cores: ${AT_PALETAS[d.paleta].nome}`); }
  else if(/(mais clar|fundo claro|tons? claros?|cores claras|mais leve)/.test(n)){ d.paleta = AT_CLAROS[(d.seed||0) % AT_CLAROS.length]; feito.push(`cores: ${AT_PALETAS[d.paleta].nome}`); }
  if(/(menos texto|textos? (mais )?curtos?|mais diret|enxut|resumid)/.test(n)){ i.slides.forEach(s => { if(s.texto && s.papel!=="final"){ s.texto = atFrases(s.texto)[0] || ""; } if(s.itens) s.itens = s.itens.slice(0, 3); }); feito.push("textos mais curtos"); }
  if(/(elegan|sofistic|refinad|chique|luxo)/.test(n) && !(ccCfg().feed.capasPref||[]).length && AT_PREMIUM[d.premium]){ d.premium = ["classico","atelier","revista"][(d.seed||0) % 3]; feito.push(`modelo: ${AT_PREMIUM[d.premium]}`); }

/* ---------- LIMPAR CONTEÚDOS PENDENTES ---------- */
async function ccxLimpar(){
  const l = ccxPendentes(); if(!l.length){ toast("Não há conteúdos pendentes."); return false; }
  const ag = l.filter(i => i.status==="aprovacao").length, aj = l.length - ag;
  const manter = ccFeedItens().filter(i => ["aprovado","agendado","publicado"].includes(i.status)).length;
  const ok = await confirmar("Apagar todos os conteúdos pendentes?", `Você realmente deseja apagar <b>todos os ${l.length} conteúdos pendentes</b>? (${ag} aguardando aprovação${aj ? `, ${aj} reprovado(s) ou com alteração pedida` : ""})<br><br>Os ${manter} conteúdo(s) aprovados, agendados ou publicados <b>não serão apagados</b>. Se mudar de ideia, use o botão “Desfazer última limpeza”.`, "Sim, apagar todos os pendentes", true);
  if(!ok) return false;
  const ids = new Set(l.map(i => i.id));
  ccDB().lixeiraCentral = {em:new Date().toISOString(), itens:JSON.parse(JSON.stringify(l)), tarefas:JSON.parse(JSON.stringify(ccDB().tarefas.filter(t => ids.has(t.itemId))))};
  ccDB().itens = ccDB().itens.filter(i => !ids.has(i.id)); ccDB().tarefas = ccDB().tarefas.filter(t => !ids.has(t.itemId));
  ccDB().centralUltimos = (ccDB().centralUltimos||[]).filter(id => !ids.has(id)); if(CCX.vista && ids.has(CCX.vista)) CCX.vista = null;
  registrar("conteúdo", `Central: ${l.length} conteúdo(s) pendente(s) apagado(s) de uma vez`);
  ccxResponder("LIMPAR CONTEÚDOS PENDENTES", `Apaguei ${l.length} conteúdo(s) pendente(s). Os aprovados, agendados e publicados continuam. Agora você pode usar “GERAR NOVOS CONTEÚDOS” para começar uma nova sequência do zero.`, []);
  toast(`${l.length} conteúdo(s) pendente(s) apagado(s).`); return true;
}
async function ccxDesfazerLimpeza(){
  const lx = ccDB().lixeiraCentral; if(!lx || !lx.itens?.length) return;
  if(!(await confirmar("Desfazer a última limpeza", `Trazer de volta os ${lx.itens.length} conteúdo(s) apagados em ${new Date(lx.em).toLocaleString("pt-BR")}? Eles voltam para aguardando aprovação, nas mesmas datas (podem ficar dois no mesmo dia, se você já gerou conteúdos novos).`, "Trazer de volta"))) return;
  const tem = new Set(ccDB().itens.map(i => i.id)); const volta = lx.itens.filter(i => !tem.has(i.id));
  ccDB().itens.push(...volta); ccDB().tarefas.push(...(lx.tarefas||[]).filter(t => volta.some(i => i.id===t.itemId)));
  ccDB().lixeiraCentral = null; registrar("conteúdo", `Central: limpeza desfeita (${volta.length} conteúdo(s) restaurado(s))`);
  ccxResponder("Desfazer última limpeza", `Trouxe de volta ${volta.length} conteúdo(s).`, volta);
}

/* ---------- Conversa com a IA da Central ---------- */
function ccxQtd(n){ const m = n.match(/\b(\d{1,2}|um|uma|dois|duas|tres|quatro|cinco|seis|sete|oito|nove|dez)\b\s+(?:novos?\s+|novas?\s+)?(posts?|carrosse(?:is|l)|conteudos?|publicac(?:oes|ao)|artes?|frases?|dicas?)/); return m ? Math.min(60, +m[1] || CC_NUM[m[1]] || 1) : 0; }
function ccxEhEdicao(n){ return /(nao gostei|outro modelo|outra versao|refaz|refaca|mesmo layout|mantenh|troque|troca|mude|muda|altere|altera|ajuste|ajusta|deixe|deixa|melhore|modifique|(desse|dessa|deste|desta|esse|essa|este|esta|nesse|nessa|neste|nesta)\s+(post|modelo|arte|carrossel|layout|conteudo|publicacao|capa))/.test(n); }
function ccxEhGeracao(n){ return /(cri[ea]r?|ger[ea]r?|produz|mont[ea]|fa[cz]a|faz|prepar[ea]|quero|elabor)/.test(n) && /(posts?|carrosse|conteudos?|publicac|artes?|sequencia|frases?|dicas?)/.test(n) && !/(nao gostei|outro modelo|outra versao|mesmo layout|mantenh)/.test(n); }
async function ccxExecutar(texto, alvoSel){
  const n = ccNormal(texto);
  // 1) limpar pendentes
  if(/(limp|apag|exclu|remov|delet)/.test(n) && /(pendent|nao aprovad|aguardando|todos os (posts|conteudos))/.test(n)){ await ccxLimpar(); return; }
  // pedidos de vídeo, stories e planejamento continuam com a assistente já existente
  if(/(video|reels|tiktok|stories|roteiro|gravar|semana|janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro|analis|desempenho)/.test(n) && !/(posts?|carrosse|artes?)\b/.test(n)){ const r = await ccExecutarComando(texto); ccxResponder(texto, r.msg, r.itens||[]); if(r.acao) r.acao(); return; }
  // 2) regra de identidade visual
  const pedeMarca = /(identidade visual|cores da (minha )?marca|minhas cores|nao invente|nao use outras cores|outras cores)/.test(n);
  if(pedeMarca){ const fc = ccCfg().feed; fc.somenteMarca = true; if(!/cores da marca/.test(ccNormal(fc.instrucoes||""))) fc.instrucoes = [fc.instrucoes, "Usar somente as cores da marca."].filter(Boolean).join(" "); }
  // 3) gerar novos
  if(ccxEhGeracao(n) && !(ccxEhEdicao(n) && !ccxQtd(n))){
    const qtd = ccxQtd(n) || (/\b(um|uma)\b/.test(n) ? 1 : /posts|conteudos|carrosseis|artes/.test(n) ? 5 : 1);
    const formatos = /carrosse/.test(n) && !/\bposts?\b/.test(n) ? ["carrossel"] : /(frase|motivac)/.test(n) ? ["frase"] : /\bdicas?\b/.test(n) ? ["dica"] : /informativ/.test(n) ? ["info"] : /carrosse/.test(n) ? ["carrossel", "info"] : null;
    const assunto = ((texto.match(/sobre\s+(.+?)\s*(?:[.!?;]|,\s*(?:com|use|usando|seguindo|mantendo)|\s+(?:com|seguindo|usando|no estilo|nas cores|para o)\s|$)/i)||[])[1]||"").trim();
    const area = /(famil|pensao|guarda|divorc|alimentos|uniao estavel|heranc|inventar)/.test(ccNormal(assunto)) ? "fam" : /(inss|aposent|previd|bpc|loas|auxilio|pensao por morte|beneficio)/.test(ccNormal(assunto)) ? "prev" : "";
    const r = ccxGerar({qtd, formatos, assunto, area, instr:texto, capas: /referenc/.test(n) ? null : undefined});
    const semRef = /referenc/.test(n) && r.semRef ? " Você ainda não marcou os modelos que seguem as suas referências; usei a coleção premium. Abra “Referências e instruções” para escolher." : "";
    ccxResponder(texto, r.criados.length ? `Criei ${r.criados.length} conteúdo(s) com a sua identidade visual (${[...new Set(r.criados.map(i => AT_ESTILOS[i.estilo]||i.tipo))].join(", ")}), de ${fmtData(r.criados[0].dataPrevista)} a ${fmtData(r.criados[r.criados.length-1].dataPrevista)}. Estão aguardando a sua aprovação.${r.aviso}${semRef}` : "Nada foi criado.", r.criados);
    return;
  }
  // 4) alterar conteúdos existentes
  const ehEdicao = ccxEhEdicao(n) || pedeMarca || /(elegan|sofistic|escur|clar|menos texto|legenda|hashtag|titulo|capa|cor|icone|curt|premium|pack|canva)/.test(n);
  if(ehEdicao){
    let alvo = [];
    if(alvoSel==="visto") alvo = [ccxVisto()].filter(Boolean);
    else if(alvoSel==="ultimos") alvo = ccxUltimos();
    else if(alvoSel==="pendentes") alvo = ccxPendentes();
    else { const v = ccxVisto(), u = ccxUltimos().filter(i => i.status!=="publicado"); alvo = /pendentes/.test(n) ? ccxPendentes() : (/(todos|todas)/.test(n) ? (u.length ? u : ccxPendentes()) : v ? [v] : u.length===1 ? u : []);
      if(!alvo.length && u.length > 1) alvo = u; }
    alvo = alvo.filter(i => i && ["carrossel","post"].includes(i.tipo) && i.status!=="publicado" && i.slides && i.design);
    if(!alvo.length){ ccxResponder(texto, pedeMarca ? `Combinado: a Central usa somente as cores da sua marca (${Object.values(AT_PALETAS).map(p => p.nome).join(", ")}). Essa regra ficou salva nas suas instruções.` : "Não sei em qual post aplicar. Clique no post para abri-lo (depois feche) e envie o comando de novo, ou escolha “Todos os pendentes” no campo “Aplicar alterações em”.", []); return; }
    const aprov = alvo.filter(i => ["aprovado","agendado"].includes(i.status)).length;
    if(alvo.length > 1 || aprov){ const ok = await confirmar("Confirmar alteração", `Vou alterar <b>${alvo.length} conteúdo(s)</b>${aprov ? `, sendo ${aprov} já aprovado(s) ou agendado(s): eles perdem a aprovação e voltam para aguardando aprovação` : ""}. A versão anterior de cada um fica guardada no histórico de versões. Continuar?`, "Sim, alterar"); if(!ok) return; }
    const resumo = []; let iguais = 0;
    alvo = alvo.filter(i => { const feito = ccxAlterar(i, texto, n, pedeMarca); if(!feito){ iguais++; return false; } ccAlterouAposAprovar(i); if(i.status==="ajustes"){ ccMudarStatus(i, "aprovacao", "Ajustes feitos pela Central"); i.ajuste = null; }
      i.atualizado = new Date().toISOString(); i.historico.push({ts:i.atualizado, de:i.status, para:i.status, obs:`Alterado pela Central: ${texto} → ${feito.join(", ")}`, usuario:USU?.nome||""}); resumo.push(feito.join(", ")); return true; });
    const uniq = [...new Set(resumo)];
    if(!alvo.length){ ccxResponder(texto, `Nada precisou mudar: ${iguais} conteúdo(s) já estavam na coleção premium.`, []); return; }
    ccxResponder(texto, `${iguais ? `${iguais} conteúdo(s) já estavam na coleção premium e ficaram como estavam. ` : ""}Alterei ${alvo.length} conteúdo(s): ${uniq.slice(0, 3).join(" · ")}${uniq.length > 3 ? " · …" : ""}. A versão anterior ficou guardada (abra o post para restaurar). Confira a prévia abaixo e aprove quando gostar.`, alvo);
    return;
  }
  // 5) demais pedidos (vídeos, stories, planejamento): assistente já existente
  const r = await ccExecutarComando(texto);
  if(r.acao){ ccxResponder(texto, r.msg, r.itens||[]); r.acao(); } else ccxResponder(texto, r.msg, r.itens||[]);
}
function ccxAlterar(i, texto, n, pedeMarca){
  const d = i.design; let feito = [];
  if(/(mesmo layout|mesmo modelo|mesmo visual|mesma arte|mantenh)/.test(n) && /(conteudo|texto|tema|assunto)/.test(n)) return ccxTrocarConteudo(i, /(tema|assunto)/.test(n));
  if(/(premium|pack|canva|profissional|designer)/.test(n) && AT_PREMIUM[d.premium] && !/(elegan|outro|troque|mude|nao gostei|escur|clar|texto|conteudo)/.test(n)) return null;
  if(/(premium|pack|canva|profissional|designer)/.test(n) && !AT_PREMIUM[d.premium]){
    atGuardarVersao(i, texto); d.premium = apFamiliaPorData(i.dataPrevista, d.seed); d.v = 4; i.ultimoPedido = {pedido:texto, feito:["coleção premium"], ts:new Date().toISOString(), versao:i.versao};
    return [`coleção premium: ${AT_PREMIUM[d.premium]}`]; }
  if(/(elegan|sofistic|refinad|chique|luxo)/.test(n) && AT_PREMIUM[d.premium]){
    atGuardarVersao(i, texto); const op = ["classico","atelier","revista","bloco"].filter(x => x!==d.premium); d.premium = op[Math.floor(Math.random()*op.length)]; d.seed = 1 + Math.floor(Math.random()*999999);
    const pal = ["champanhe","branco","chocolate","areia"].filter(p => p!==d.paleta); if(!/(escur|clar|cor)/.test(n)) d.paleta = pal[d.seed % pal.length];
    feito.push(`modelo mais elegante: ${AT_PREMIUM[d.premium]}`, `cores: ${AT_PALETAS[d.paleta].nome}`); i.ultimoPedido = {pedido:texto, feito, ts:new Date().toISOString(), versao:i.versao};
    return feito.concat(/(menos texto|curt)/.test(n) ? ccxAplicarInstr(i, texto) : []); }
  if(/(elegan|sofistic|refinad|chique|luxo)/.test(n)){
    atGuardarVersao(i, texto); const op = Object.keys(AT_CAPAS_ED).filter(k => k!==d.capa); d.capa = op[Math.floor(Math.random()*op.length)]; d.seed = 1 + Math.floor(Math.random()*999999); d.v = 3;
    if(i.slides[0]?.papel==="capa") delete i.slides[0].layout;
    const pal = ["champanhe","branco","chocolate","areia"].filter(p => p!==d.paleta); if(!/(escur|clar|cor)/.test(n)) d.paleta = pal[d.seed % pal.length];
    feito.push(`modelo mais elegante: ${AT_CAPAS_V3[d.capa]}`, `cores: ${AT_PALETAS[d.paleta].nome}`);
    i.ultimoPedido = {pedido:texto, feito, ts:new Date().toISOString(), versao:i.versao};
    const extra = /(escur|clar|menos texto|curt)/.test(n) ? ccxAplicarInstr(i, texto) : []; return feito.concat(extra);
  }
  if(pedeMarca && !/(modelo|layout|nao gostei|outro|escur|clar|texto|legenda)/.test(n)){
    atGuardarVersao(i, texto); if(!AT_PALETAS[d.paleta]) d.paleta = i.dataPrevista ? atPaletaPorData(i.dataPrevista) : "areia";
    return [`somente cores da marca (${AT_PALETAS[d.paleta].nome})`];
  }
  feito = ccFeedAplicarPedido(i, texto);
  if(!AT_PALETAS[d.paleta]) d.paleta = "areia";
  return feito;
}
function ccxTrocarConteudo(i, outroTema){
  const t0 = ccFeedTemaDe(i); const d = i.design; atGuardarVersao(i, "Mesmo layout, novo conteúdo");
  const antes = JSON.stringify(i.slides.map(s => [s.titulo, s.texto]));
  let t = t0, v = (i.variacao||0) + 1, slides = t0 ? atMontarSlides(t0, i.tipo, v, d.seed, i.estilo) : null;
  if(outroTema || !slides || JSON.stringify(slides.map(s => [s.titulo, s.texto]))===antes){

function atSeqFeed(){

  const fut = it.filter(i => i.status!=="publicado").sort((a,b) => atQuando(b) - atQuando(a));
  const pub = it.filter(i => i.status==="publicado").sort((a,b) => (b.publicadoEm||b.dataPrevista||"").localeCompare(a.publicadoEm||a.dataPrevista||""));
  const links = new Set(pub.map(i => (i.link||"").replace(/[?#].*$/,"").replace(/\/$/,"")));
  const ig = ((ccCfg().feed||{}).igGrade||[]).filter(m => !links.has((m.permalink||"").replace(/[?#].*$/,"").replace(/\/$/,"")));
  return [...fut.map(i => ({i})), ...pub.map(i => ({i})), ...ig.map(m => ({ig:m}))];
}
function atHarmonia(seq){
  const al = []; const pal = x => x.i?.design?.paleta || null; const nome = x => x.i ? fmtData(x.i.dataPrevista||"").slice(0,5) : "";
  for(let n=0;n<Math.min(seq.length, 18);n++){ const a = seq[n]; if(!pal(a)) continue;
    const dir = (n % 3 < 2) ? seq[n+1] : null, baixo = seq[n+3];
    if(dir && pal(dir)===pal(a)) al.push(`${nome(a)} e ${nome(dir)} estão lado a lado com a mesma paleta (${AT_PALETAS[pal(a)].nome}).`);
    if(baixo && pal(baixo)===pal(a)) al.push(`${nome(a)} e ${nome(baixo)} ficam um sobre o outro com a mesma paleta.`); }
  const prim = seq.slice(0, 9).filter(x => pal(x)); const esc_ = prim.filter(x => AT_PALETAS[pal(x)].escuro).length;
  return {al, esc:esc_, cla:prim.length - esc_};
}
